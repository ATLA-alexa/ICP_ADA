<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Quatro</title>
<style>
/* ==========================================================================
   QUATRO. One file, no network, runs offline on a phone behind the bar.
   The arch (20px 20px 6px 6px) is the brand, taken from the backlit
   limestone niches. The room is the calm canvas; the drinks are the paint.
   ========================================================================== */

:root {
  --limestone: #FAF6EF;
  --limestone-deep: #F2EBDF;
  --ink: #23201C;
  --ink-soft: #6B6459;
  --gold: #A8863C;
  --gold-pale: #D9C79A;

  --amber: #B26A05;
  --amber-bg: #FBF0DC;
  --green: #2F6B3A;
  --green-bg: #EEF6F0;
  --red: #8C3A2E;
  --red-bg: #FBEEEB;
  --pink-zone: #C4708A;
  --yellow-zone: #C9A227;

  --arch: 20px 20px 6px 6px;
  --arch-sm: 12px 12px 4px 4px;

  --display: 'Marcellus', Georgia, 'Times New Roman', serif;
  --body: 'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--limestone); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }

.wrap { max-width: 820px; margin: 0 auto; padding: 0 var(--s4) var(--s8); }
.smallcaps { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; color: var(--gold); }

/* ---- top bar -------------------------------------------------------------- */

.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--limestone) 93%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--gold-pale); }
.topbar-inner { max-width: 820px; margin: 0 auto; padding: var(--s3) var(--s4); display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: var(--s2); flex: 1 1 auto; min-width: 0; }
.brand-name { font-family: var(--display); font-size: 22px; letter-spacing: 0.02em; }
.brand-city { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }

.seg { display: flex; gap: 2px; background: var(--limestone-deep); border-radius: 999px; padding: 3px; flex: 0 0 auto; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); transition: background 140ms ease, color 140ms ease; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--limestone); }
.seg--lang button { padding: 6px 9px; }

/* ---- sub tabs ------------------------------------------------------------- */

.subtabs { display: flex; gap: var(--s1); overflow-x: auto; padding: var(--s3) var(--s4); max-width: 820px; margin: 0 auto; border-bottom: 1px solid var(--limestone-deep); -webkit-overflow-scrolling: touch; }
.subtabs button { flex: 0 0 auto; border: 1px solid transparent; background: none; border-radius: 999px; padding: 6px 12px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
.subtabs button[aria-selected="true"] { background: #fff; border-color: var(--gold-pale); color: var(--ink); }

/* ---- masthead ------------------------------------------------------------- */

.masthead { text-align: center; padding: var(--s7) 0 var(--s5); }
.masthead h1 { font-size: 40px; letter-spacing: 0.03em; }
.masthead .rule { display: block; width: 120px; height: 1px; background: var(--gold-pale); margin: var(--s4) auto; }
.masthead p { margin: 0; color: var(--ink-soft); font-size: 15px; font-style: italic; }

/* ---- sections ------------------------------------------------------------- */

.section { margin-top: var(--s7); }
.section-head { border-bottom: 1px solid var(--gold-pale); padding-bottom: var(--s2); margin-bottom: var(--s4); }
.section-head h2 { font-size: 26px; margin-top: var(--s1); }
.section-note { margin: var(--s2) 0 0; font-size: 14px; color: var(--ink-soft); font-style: italic; }

.cards { display: grid; grid-template-columns: 1fr; gap: var(--s3); }
@media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr; } }

.card { position: relative; display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch); padding: var(--s4); transition: border-color 140ms ease, transform 140ms ease; }
.card:hover { border-color: var(--gold-pale); }
.card:active { transform: scale(0.995); }
.card-top { display: flex; align-items: baseline; gap: var(--s2); }
.swatch { width: 12px; height: 12px; border-radius: 999px; flex: 0 0 auto; transform: translateY(1px); box-shadow: inset 0 0 0 1px rgba(35,32,28,0.22); }
.card-name { font-family: var(--display); font-size: 19px; flex: 1 1 auto; min-width: 0; }
.card-desc { display: block; margin: var(--s2) 0 0; font-size: 14px; color: var(--ink-soft); }
.card-flav { display: block; margin-top: var(--s2); font-size: 13px; line-height: 1.5;
  color: var(--gold); font-style: italic; }
.sheet-flav { margin: 0 0 var(--s3); font-size: 15px; line-height: 1.5; color: var(--gold);
  font-style: italic; border-left: 2px solid var(--gold-pale); padding-left: var(--s3); }
.card-tag { display: inline-block; margin-top: var(--s3); font-size: 11.5px; color: var(--gold); border: 1px solid var(--gold-pale); border-radius: 999px; padding: 3px 9px; }

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: baseline; gap: var(--s3); border-bottom: 1px solid var(--limestone-deep); padding: var(--s3) 0; }
.row-name { font-family: var(--display); font-size: 17px; flex: 0 0 auto; }
.row-comp { font-size: 13px; color: var(--ink-soft); flex: 1 1 auto; min-width: 0; }

.panel { margin-top: var(--s4); background: var(--limestone-deep); border-radius: var(--arch); padding: var(--s4) var(--s5); }
.panel h3 { font-size: 18px; margin-bottom: var(--s1); }
.panel p { margin: 0; font-size: 14px; color: var(--ink-soft); }
.panel--upsell { background: #fff; border: 1px solid var(--gold-pale); padding: var(--s5); text-align: center; }
.panel--upsell .smallcaps { display: block; margin-bottom: var(--s2); }
.panel--upsell h3 { font-size: 22px; margin-bottom: var(--s2); }
.panel--upsell p { font-size: 15px; color: var(--ink); }
.panel--upsell .sub { display: block; margin-top: var(--s2); font-size: 13px; color: var(--ink-soft); }

.altlist { margin: var(--s3) 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s2); }
.altlist li { font-size: 14px; color: var(--ink-soft); }
.altlist b { color: var(--ink); font-weight: 600; }

.footer { margin-top: var(--s8); border-top: 1px solid var(--gold-pale); padding-top: var(--s4); text-align: center; }
.footer .claim { font-family: var(--display); font-size: 18px; }
.footer .fine { font-size: 12px; color: var(--ink-soft); margin-top: var(--s2); }

/* ---- flags and notes ------------------------------------------------------ */

.flag { margin-top: var(--s3); background: var(--amber-bg); border: 1px dashed var(--amber); border-radius: var(--arch-sm); padding: var(--s3); font-size: 13px; color: var(--amber); line-height: 1.5; }
.flag strong { display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
.warn { margin-top: var(--s3); background: var(--red-bg); border: 1px solid var(--red); border-radius: var(--arch-sm); padding: var(--s3) var(--s4); font-size: 13px; color: var(--red); line-height: 1.5; }
.warn strong { display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
.todo { display: inline-block; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--amber-bg); color: var(--amber); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; margin-left: 6px; font-weight: 600; }

/* ---- detail sheet --------------------------------------------------------- */

.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(35,32,28,0.42); opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; max-height: 88vh; display: flex; flex-direction: column; background: var(--limestone); border-radius: var(--arch); transform: translateY(102%); transition: transform 220ms cubic-bezier(0.2,0,0.2,1); box-shadow: 0 -8px 40px rgba(35,32,28,0.18); }
.sheet.open { transform: translateY(0); }
/* display:flex above beats the browser default for [hidden], so say it here.
   Without this the sheet stays in the hit test and swallows every tap. */
.sheet[hidden] { display: none; }
@media (min-width: 720px) { .sheet { left: 50%; right: auto; width: 660px; transform: translate(-50%, 102%); bottom: 3vh; max-height: 90vh; } .sheet.open { transform: translate(-50%, 0); } }
.sheet-head { padding: var(--s5) var(--s5) var(--s3); border-bottom: 1px solid var(--gold-pale); }
.sheet-title { display: flex; align-items: baseline; gap: var(--s2); padding-right: 40px; }
.sheet-title h3 { font-size: 24px; flex: 1 1 auto; }
.sheet-close { position: absolute; top: var(--s3); right: var(--s3); width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--limestone-deep); background: #fff; color: var(--ink-soft); font-size: 18px; line-height: 1; display: grid; place-items: center; }
.sheet-body { overflow-y: auto; padding: var(--s4) var(--s5) var(--s7); -webkit-overflow-scrolling: touch; }
.story { font-size: 16px; line-height: 1.7; margin: 0; }

/* ---- builds --------------------------------------------------------------- */

.build { background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch); padding: var(--s5); margin-top: var(--s4); }
.build-head { display: flex; align-items: baseline; gap: var(--s2); }
.build-head h3 { font-size: 21px; flex: 1 1 auto; }
.spec { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); margin: var(--s3) 0 var(--s4); padding: 0; }
.spec div { font-size: 13px; }
.spec dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.spec dd { margin: 2px 0 0; }
.ing { margin: 0 0 var(--s4); padding: 0; list-style: none; }
.ing li { display: flex; align-items: baseline; gap: var(--s3); border-bottom: 1px solid var(--limestone-deep); padding: 7px 0; font-size: 14.5px; }
.ing .ml { font-variant-numeric: tabular-nums; color: var(--gold); font-size: 13px; min-width: 56px; flex: 0 0 auto; }
.ing .nm { flex: 1 1 auto; }
.ing .nm small { display: block; color: var(--ink-soft); font-size: 12.5px; }
.substack { margin-bottom: var(--s4); }
.substack h4 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: var(--s2); }
.steps { margin: 0; padding-left: 20px; }
.steps li { margin-bottom: var(--s2); font-size: 14.5px; }
blockquote.say { margin: 0 0 var(--s3); padding: var(--s3) var(--s4); border-left: 2px solid var(--gold); background: var(--limestone); border-radius: 0 var(--arch-sm) var(--arch-sm) 0; font-family: var(--display); font-size: 16.5px; line-height: 1.5; }

/* ---- tables --------------------------------------------------------------- */

.tablewrap { overflow-x: auto; border: 1px solid var(--limestone-deep); border-radius: var(--arch); background: #fff; margin-top: var(--s3); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
table.wide { min-width: 760px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--limestone-deep); vertical-align: top; }
th { background: var(--limestone-deep); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.tbd { color: var(--amber); font-size: 11px; letter-spacing: 0.08em; }
.legend { font-size: 12px; color: var(--ink-soft); margin-top: var(--s3); line-height: 1.6; }

.chip { display: inline-block; font-size: 11px; border-radius: 999px; padding: 2px 9px; border: 1px solid; white-space: nowrap; }
.chip.yes { color: var(--green); border-color: #A9C9B0; background: var(--green-bg); }
.chip.no  { color: var(--red); border-color: #E0B3AA; background: var(--red-bg); }
.chip.due { color: var(--amber); border-color: var(--gold-pale); background: var(--amber-bg); }

/* rail slot colour dot, the house language */
.slot { display: inline-flex; align-items: center; gap: var(--s2); }
.slot-dot { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(35,32,28,0.28); }
.slot-n { font-family: var(--display); font-size: 16px; min-width: 14px; }

/* ---- storage zones ------------------------------------------------------- */

.zone { border-radius: var(--arch); padding: var(--s4) var(--s5); margin-top: var(--s4); background: #fff; border: 1px solid var(--limestone-deep); border-left: 4px solid var(--limestone-deep); }
.zone--pink { border-left-color: var(--pink-zone); }
.zone--yellow { border-left-color: var(--yellow-zone); }
.zone h3 { font-size: 19px; }
.zone-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
.zone--pink .zone-label { color: var(--pink-zone); }
.zone--yellow .zone-label { color: var(--yellow-zone); }
.stations { margin: var(--s3) 0 0; padding-left: 18px; }
.stations li { font-size: 14px; margin-bottom: var(--s2); }
.fridge { margin-top: var(--s4); }
.fridge h4 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: var(--s2); }
.doors { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s1); }
.doors li { font-size: 13.5px; }
.doors b { font-family: var(--mono); font-size: 12px; color: var(--gold); }

/* ---- picks and tool blocks, also used by the print button ----------------- */

.tool-block { background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch); padding: var(--s4) var(--s5); margin-top: var(--s4); }
.tool-block h3 { font-size: 19px; margin-bottom: var(--s3); }
.picks { display: flex; flex-wrap: wrap; gap: var(--s2); }
.pick { border: 1px solid var(--gold-pale); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: var(--s2); transition: opacity 140ms ease, border-color 140ms ease, background 140ms ease; }
.pick .swatch { width: 10px; height: 10px; }
.pick[aria-pressed="true"] { border-color: var(--gold); background: var(--limestone-deep); font-weight: 600; }
body.has-picks .pick[aria-pressed="false"] { opacity: 0.38; }
.pick-count { font-size: 12px; color: var(--ink-soft); margin-top: var(--s2); }

/* ---- print booklet -------------------------------------------------------- */

#booklet { display: none; }

@media print {
  @page { margin: 12mm; }
  body { background: #fff; }
  .topbar, .subtabs, .scrim, .sheet, .print-hide { display: none !important; }

  /* Booklet mode: one drink per page, everything else gone. */
  body.booklet #app { display: none !important; }
  body.booklet #booklet { display: block !important; }
  .bk-page { break-after: page; page-break-after: always; padding-bottom: 6mm; }
  .bk-page:last-child { break-after: auto; page-break-after: auto; }
  .bk-head { border-bottom: 1.5pt solid #000; padding-bottom: 2mm; margin-bottom: 4mm; }
  .bk-head h2 { font-size: 22pt; }
  .bk-swatch { display: inline-block; width: 10pt; height: 10pt; border-radius: 50%; border: 0.75pt solid #000; margin-right: 4pt; }
  .bk-spec { font-size: 9.5pt; letter-spacing: 0.06em; text-transform: uppercase; color: #000; margin-top: 1.5mm; }
  .bk-sec { margin-bottom: 4mm; }
  .bk-sec h3 { font-size: 8.5pt; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 1.5mm; border-bottom: 0.5pt solid #999; padding-bottom: 0.8mm; }
  .bk-sec ol, .bk-sec ul { margin: 0; padding-left: 5mm; font-size: 10pt; }
  .bk-sec li { margin-bottom: 1mm; }
  .bk-say { font-family: var(--display); font-size: 11pt; border-left: 1.5pt solid #000; padding-left: 3mm; margin: 0 0 2mm; }
  .bk-flag { border: 0.75pt dashed #000; padding: 2mm; font-size: 9pt; margin-bottom: 3mm; }
  /* Grayscale safe: a ruled box, no fills. */
  .bk-notes { border: 0.75pt solid #000; padding: 2mm 3mm 0; margin-top: 5mm; }
  .bk-notes h3 { font-size: 8.5pt; letter-spacing: 0.16em; text-transform: uppercase; border: 0; margin-bottom: 1mm; }
  .bk-rule { border-bottom: 0.4pt solid #666; height: 7mm; }

  /* Plain menu print, when not in booklet mode. */
  body:not(.booklet) .wrap { max-width: none; padding: 0; }
  body:not(.booklet) .card { border: 0; padding: 0 0 2mm; break-inside: avoid; border-radius: 0; }
  body:not(.booklet) .cards { grid-template-columns: 1fr 1fr; gap: 2mm 6mm; }
  body:not(.booklet) .flag, body:not(.booklet) .warn { display: none !important; }
}

@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
/* guide, sweet note, prep methods, owner tables */
.sweetnote { margin: 10px 0 0; color: var(--ink-soft); font-size: 14px; }
.guide { margin: 0 0 20px; background: var(--limestone-deep); border: 1px solid var(--gold-pale);
  border-radius: 20px 20px 6px 6px; padding: 12px 16px; }
.guide summary { cursor: pointer; font-weight: 600; font-size: 14px; letter-spacing: 0.02em; color: var(--gold); }
.guide-open { margin: 12px 0; font-size: 14px; line-height: 1.6; }
.guide-list { margin: 0; display: grid; gap: 8px; }
.guide-list div { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-size: 13px; line-height: 1.55; }
.guide-list dt { font-weight: 600; }
.guide-list dd { margin: 0; color: var(--ink-soft); }
.prep-method td { font-size: 13px; line-height: 1.6; color: var(--ink-soft); background: var(--limestone-deep); }
.owner-h { font-size: 16px; margin: 24px 0 8px; }
@media print { .guide { display: none; } }
</style>
</head>
<body class="mode-menu">

<div id="app">

<header class="topbar print-hide">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-name">Quatro</span>
      <span class="brand-city">Amsterdam</span>
    </div>
    <div class="seg" id="modes" role="group" aria-label="Mode"></div>
    <div class="seg seg--lang" id="langs" role="group" aria-label="Language"></div>

</header>

<main class="wrap">

</div>

<div id="booklet"></div>

      <span class="swatch" id="sheet-swatch"></span>
      <h3 id="sheet-name"></h3>
    </div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script>
"use strict";

/* ==========================================================================
   DATA
   One object. A non-developer can edit any text here, add a price, or change
   a build without touching the code below it.

   Every translatable string is {en, nl}. Drink names stay in English by
   instruction, so name is a plain string.

   PRICES. price is null on every drink and nothing renders one. The layout is
   built to look finished without them. When prices land, fill price and
   ops.cost and the Owner block fills in on its own.
   ========================================================================== */

var VAT = 0.09;

var UI = {
  menu:        { en: "Menu",            nl: "Menu" },
  runsheet:    { en: "Run sheet",       nl: "Werkblad" },
  builds:      { en: "Builds",          nl: "Opbouw" },
  rail:        { en: "Rail",            nl: "Speedrail" },
  prep:        { en: "Prep and FIFO",   nl: "Voorbereiding en FIFO" },
  inventory:   { en: "Inventory",       nl: "Voorraad" },
  storage:     { en: "Storage",         nl: "Opslag" },
  future:      { en: "Future",          nl: "Toekomst" },
  tagline:     { en: "The room is the calm canvas. The drinks are the paint.",
                 nl: "De ruimte is het rustige doek. De drankjes zijn de verf." },
  alcoholFree: { en: "Everything on this menu is alcohol-free",
                 nl: "Alles op dit menu is alcoholvrij" },
  allergies:   { en: "Please tell us about any allergies. We build around them.",
                 nl: "Laat het ons weten bij allergieen. Wij passen de drank aan." },
  glass:       { en: "Glass",           nl: "Glas" },
  ice:         { en: "Ice",             nl: "Ijs" },
  method:      { en: "Method",          nl: "Methode" },
  atBar:       { en: "At the bar",      nl: "Achter de bar" },
  atTable:     { en: "At the table",    nl: "Aan tafel" },
  sayThis:     { en: "Say this",        nl: "Zeg dit" },
  ingredients: { en: "Ingredients, in build order", nl: "Ingredienten, in opbouwvolgorde" },
  printBooklet:{ en: "Print booklet",   nl: "Boekje afdrukken" },
  bookletNote: { en: "One drink per page with a notes box, grayscale safe.",
                 nl: "Een drankje per pagina met een notitievak, geschikt voor grijstinten." },
  myNotes:     { en: "My notes",        nl: "Mijn aantekeningen" },
  staffBlock:  { en: "Staff",           nl: "Personeel" },
  ownerBlock:  { en: "Owner",           nl: "Eigenaar" },
  slot:        { en: "Slot",            nl: "Slot" },
  colour:      { en: "Colour",          nl: "Kleur" },
  contents:    { en: "Contents",        nl: "Inhoud" },

var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
};

  LANG = localStorage.getItem("quatro-lang") || "en";
  MODE = localStorage.getItem("quatro-mode") || "menu";
  TAB  = localStorage.getItem("quatro-tab") || "builds";
} catch (e) {}
if (["en", "nl"].indexOf(LANG) === -1) LANG = "en";
if (["menu", "runsheet"].indexOf(MODE) === -1) MODE = "menu";

/* t() takes either a plain string or an {en, nl} pair, so DATA can mix both. */
function t(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[LANG] != null ? v[LANG] : (v.en != null ? v.en : "");
}
function ui(k) { return t(UI[k]); }

      sec.altPanel.items.map(function (it) {
        return "<li><b>" + esc(it.name) + "</b> " + esc(it.cjk) + ". " + esc(t(it.desc)) + "</li>";
      }).join("") + "</ul></div>";
  }
  if (sec.upsell) h += UPSELL();
  return h + "</section>";
}

function renderMenu() {
  var h = guideHTML() +
    '<div class="masthead"><h1>Quatro</h1><span class="rule"></span><p>' + esc(ui("tagline")) + "</p>" +
    '<p class="sweetnote">' + esc(ui("sweetNote")) + "</p></div>";
  SECTIONS.forEach(function (sec) {
    if (sec.future) return;
    h += sectionHTML(sec);
  });
  h += '<footer class="footer"><div class="claim">' + esc(ui("alcoholFree")) + "</div>" +
    '<p class="fine">' + esc(ui("allergies")) + "</p></footer>";
  return h;
}
/* ---------------- run sheet: builds ---------------- */

function ingList(d) {
  return '<ul class="ing">' + d.build.map(function (b) {
    var ing = ING[b.ref];
    if (!ing) return "";
    return "<li><span class=\"ml\">" + (b.ml ? b.ml + " ml" : "") + "</span>" +
      '<span class="nm">' + esc(t(ing.name)) +
      (b.note ? "<small>" + esc(t(b.note)) + "</small>" : "") + "</span></li>";
  }).join("") + "</ul>";
}

function buildBlock(d) {
  var h = '<article class="build" id="build-' + esc(d.id) + '">' +
    '<div class="build-head"><span class="swatch" style="background:' + esc(d.swatch) + '"></span>' +
    "<h3>" + esc(d.name) + "</h3></div>" +
    '<dl class="spec">' +
      "<div><dt>" + esc(ui("glass")) + "</dt><dd>" + esc(t(d.glass)) + "</dd></div>" +
      "<div><dt>" + esc(ui("ice")) + "</dt><dd>" + esc(t(d.ice)) + "</dd></div>" +
      "<div><dt>" + esc(ui("method")) + "</dt><dd>" + esc(t(d.method)) + "</dd></div>" +
    "</dl>";
  h += '<div class="substack"><h4>' + esc(ui("ingredients")) + "</h4>" + ingList(d) + "</div>";
  h += '<div class="substack"><h4>' + esc(ui("atBar")) + '</h4><ol class="steps">' +
    t(d.bar).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
  if (d.table) {
    h += '<div class="substack"><h4>' + esc(ui("atTable")) + '</h4><ol class="steps">' +
      t(d.table).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
  }
  h += '<div class="substack"><h4>' + esc(d.sayLabel ? t(d.sayLabel) : ui("sayThis")) + "</h4>" +
    t(d.say).map(function (s) { return '<blockquote class="say">' + esc(s) + "</blockquote>"; }).join("") + "</div>";
  return h + "</article>";
}

function renderBuilds() {
  return '<section class="section"><div class="section-head"><div class="smallcaps">' + esc(ui("runsheet")) +
    '</div><h2>' + esc(ui("builds")) + "</h2>" +
    '<p class="section-note">' + esc(ui("bookletNote")) + "</p></div>" +
    '<button class="pick" type="button" id="print-booklet" style="border-color:var(--gold)">' + esc(ui("printBooklet")) + "</button>" +
    ACTIVE.map(buildBlock).join("") + "</section>";
}

/* ---------------- rail ---------------- */

function renderRail() {
  return '<section class="section"><div class="section-head"><div class="smallcaps">' + esc(ui("runsheet")) +
    '</div><h2>' + esc(ui("rail")) + "</h2></div>" +
    '<div class="tablewrap"><table class="wide"><thead><tr>' +
      "<th>" + esc(ui("slot")) + "</th><th>" + esc(ui("colour")) + "</th><th>" + esc(ui("contents")) + "</th><th>" + esc(ui("drinksN")) + "</th>" +
    "</tr></thead><tbody>" +
    RAIL.map(function (r) {
      return "<tr><td><span class=\"slot\"><span class=\"slot-n\">" + r.n + "</span></span></td>" +
        '<td><span class="slot"><span class="slot-dot" style="background:' + esc(r.colour) + '"></span>' + esc(t(r.label)) + "</span></td>" +
        "<td>" + esc(t(r.contents)) + "</td>" +
        '<td class="num">' + esc(r.drinks) + "</td></tr>";
    }).join("") + "</tbody></table></div>" +
    '<div class="panel"><h3>' + esc(ui("secondTier")) + "</h3><p>" + esc(t(RAIL_SECOND)) + "</p></div>" +
    RAIL_NOTES.map(function (n) { return '<div class="flag"><strong>Note</strong>' + esc(t(n)) + "</div>"; }).join("") +

}

/* ---------------- prep and FIFO ---------------- */

function renderPrep() {
  return '<section class="section"><div class="section-head"><div class="smallcaps">' + esc(ui("runsheet")) +
    '</div><h2>' + esc(ui("prep")) + "</h2></div>" +
    '<div class="warn"><strong>' + esc(ui("labelRule")) + "</strong>" + esc(ui("labelBody")) + "</div>" +
    '<div class="tablewrap"><table class="wide"><thead><tr>' +
      "<th>" + esc(ui("item")) + "</th><th>" + esc(ui("yield")) + "</th><th>" + esc(ui("keeps")) + "</th><th>" + esc(ui("home")) + "</th>" +
    "</tr></thead><tbody>" +
    PREP.map(function (p) {
      var row = "<tr><td>" + esc(t(p.item)) + "</td><td>" + esc(t(p.yield)) + "</td><td>" + esc(t(p.keeps)) + "</td><td>" + esc(t(p.home)) + "</td></tr>";

/* ---------------- inventory, split staff and owner ---------------- */

function renderInventory() {
  var keys = Object.keys(ING);
  var staff = '<div class="tablewrap"><table class="wide"><thead><tr>' +
    "<th>" + esc(ui("ingredient")) + "</th><th>" + esc(ui("inStock")) + "</th><th>" + esc(ui("home")) + "</th><th>" + esc(ui("needsPrep")) + "</th>" +
    "</tr></thead><tbody>" +
    keys.map(function (k) {
      var i = ING[k];
      return "<tr><td>" + esc(t(i.name)) + "</td>" +
        '<td><span class="chip ' + (i.inStock ? "yes" : "no") + '">' + esc(i.inStock ? ui("yes") : ui("no")) + "</span></td>" +
        "<td>" + esc(t(i.home)) + "</td>" +
        '<td>' + (i.prep ? '<span class="chip due">' + esc(ui("yes")) + "</span>" : '<span class="chip yes">' + esc(ui("no")) + "</span>") + "</td></tr>";
    }).join("") + "</tbody></table></div>";

  /* Owner block: real figures from the 19 Aug 2026 cost worksheet.
     GP is always computed here, never copied in: net = sell / 1.09. */
  function gpCell(sell, cost) {
    var net = sell / 1.09, gp = net - cost, pct = Math.round((gp / net) * 100);
    return '<td class="num">' + money(gp) + " (" + pct + "%)</td>";
  }
  var costTable = '<h4 class="owner-h">' + esc(ui("costPerDrink")) + '</h4>' +
    '<div class="tablewrap"><table class="wide"><thead><tr>' +
    "<th>" + (LANG === "nl" ? "Drankje" : "Drink") + "</th><th>" + esc(ui("pourCost")) + "</th>" +
    COSTS.sellAt.map(function (p) { return "<th>" + esc(ui("gpEur")) + " @ " + p + "</th>"; }).join("") +
    "</tr></thead><tbody>" +
    COSTS.perDrink.map(function (c) {
      var d = byId[c.id];
      return "<tr><td>" + esc(d ? d.name : c.id) + '</td><td class="num">' + money(c.cost) + "</td>" +
        COSTS.sellAt.map(function (p) { return gpCell(p, c.cost); }).join("") + "</tr>";
    }).join("") + "</tbody></table></div>" +
    '<p class="legend">' + (LANG === "nl"
      ? "Richtprijs op de kaart: 10 tot 15. Brutowinst per glas is verkoopprijs exclusief 9 procent btw, minus kostprijs."
      : "Target menu price: 10 to 15. Gross profit per glass is the sell price net of 9 percent VAT, minus the pour cost.") + "</p>";

  var stockTable = '<h4 class="owner-h">' + esc(ui("haveStock")) + '</h4>' +
    '<div class="tablewrap"><table class="wide"><thead><tr>' +
    "<th>" + esc(ui("item")) + "</th><th>" + (LANG === "nl" ? "Hoeveelheid" : "Quantity") + "</th><th>" + (LANG === "nl" ? "Waarde" : "Value") + "</th>" +
    "</tr></thead><tbody>" +
    COSTS.inStock.map(function (r) {
      return "<tr><td>" + esc(t(r.name)) + "</td><td>" + esc(r.qty) + '</td><td class="num">' + esc(r.value) + "</td></tr>";
    }).join("") + "</tbody></table></div>";

  var orderTotal = COSTS.order.reduce(function (a, r) { return a + r.amt; }, 0);
  var orderTable = '<h4 class="owner-h">' + esc(ui("weekOrder")) + '</h4>' +
    '<div class="tablewrap"><table class="wide"><thead><tr>' +
    "<th>" + (LANG === "nl" ? "Categorie" : "Category") + "</th><th>" + (LANG === "nl" ? "Bedrag" : "Amount") + "</th>" +
    "</tr></thead><tbody>" +
    COSTS.order.map(function (r) {
      return "<tr><td>" + esc(t(r.cat)) + '</td><td class="num">' + money(r.amt) + "</td></tr>";
    }).join("") +
    "<tr><td><b>" + (LANG === "nl" ? "Totaal" : "Total") + '</b></td><td class="num"><b>' + money(orderTotal) + "</b></td></tr>" +
    "</tbody></table></div>" +
    '<p class="legend">' + esc(t(COSTS.orderNote)) + "</p>";

  var unitTable = '<h4 class="owner-h">' + esc(ui("unitCosts")) + '</h4>' +
    '<div class="tablewrap"><table class="wide"><thead><tr>' +
    "<th>" + esc(ui("ingredient")) + "</th><th>" + (LANG === "nl" ? "Verpakking en prijs" : "Pack and price") + "</th><th>" + (LANG === "nl" ? "Eenheidsprijs" : "Unit cost") + "</th>" +
    "</tr></thead><tbody>" +
    COSTS.units.map(function (r) {
      return "<tr><td>" + esc(t(r.name)) + "</td><td>" + esc(r.pack) + '</td><td class="num">' + esc(r.unit) + "</td></tr>";
    }).join("") + "</tbody></table></div>" +
    '<div class="flag"><strong>TBD</strong>' + esc(t(COSTS.missing)) + "</div>";

  var owner = costTable + stockTable + orderTable + unitTable;

  return '<section class="section"><div class="section-head"><div class="smallcaps">' + esc(ui("runsheet")) +
    '</div><h2>' + esc(ui("inventory")) + "</h2></div>" +
    '<h3 style="font-size:20px;margin-top:8px">' + esc(ui("staffBlock")) + "</h3>" +
    '<p class="legend">' + (LANG === "nl" ? "Wat er is, waar het staat, wat vandaag gemaakt moet worden. Geen geld." : "What is in stock, where it lives, what needs prepping today. Nothing about money.") + "</p>" +
    staff +
    '<h3 style="font-size:20px;margin-top:32px">' + esc(ui("ownerBlock")) + "</h3>" +
    '<p class="legend">' + esc(ui("moneyTbd")) + "</p>" +
    owner + "</section>";
}

/* ---------------- storage ---------------- */

function renderStorage() {
  var h = '<section class="section"><div class="section-head"><div class="smallcaps">' + esc(ui("runsheet")) +
    '</div><h2>' + esc(ui("storage")) + "</h2></div>";
  STORAGE.zones.forEach(function (z) {
    h += '<div class="zone zone--' + z.key + '"><span class="zone-label">' + esc(t(z.label)) + "</span>" +
      '<ol class="stations">' + t(z.stations).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
  });
  STORAGE.fridges.forEach(function (f) {
    h += '<div class="zone fridge"><h4>' + esc(t(f.name)) + '</h4><ul class="doors">' +
      f.doors.map(function (d) { return "<li><b>" + esc(d.d) + "</b> " + esc(t(d.t)) + "</li>"; }).join("") + "</ul></div>";
  });
  STORAGE.warnings.forEach(function (w) {
    h += '<div class="warn"><strong>' + (LANG === "nl" ? "Let op" : "Warning") + "</strong>" + esc(t(w)) + "</div>";
  });
  return h + "</section>";
}

/* ---------------- future: parked drinks, keeping the vision ---------------- */

function renderFuture() {
  var h = '<section class="section"><div class="section-head"><div class="smallcaps">' + esc(ui("runsheet")) +
    '</div><h2>' + esc(ui("future")) + "</h2>" +
    '<p class="section-note">' + (LANG === "nl"
      ? "Geparkeerd, niet geschrapt. Deze drankjes staan vandaag niet op de kaart, zodat mocktails en koffie eerst afgemaakt worden. De recepten blijven hier klaarstaan."
      : "Parked, not cancelled. These drinks are off today's menu so the mocktails and coffee get finished first. Their recipes stay ready here.") + "</p></div>";
  /* Moved off the Rail tab on 19 November: the point of the note is what the
     Eminence Matcha Mojito will need when it arrives, and it lives here. */
  h += '<div class="flag"><strong>' + esc(LANG === "nl" ? "Let op" : "Note") + "</strong>" +
    esc(LANG === "nl"
      ? "De Eminence Matcha Mojito gaat op dezelfde Jumbo appel-peer als The Hulk en Tropical Velvet. Die twee houden het groene railslot nu al bezet, dus er is geen nieuw slot nodig als deze erbij komt."
      : "The Eminence Matcha Mojito will take the same Jumbo apple-pear as The Hulk and Tropical Velvet. Those two already hold the green rail slot, so no new slot is needed when this one arrives.") + "</div>";
  SECTIONS.forEach(function (sec) {
    if (!sec.future) return;
    h += sectionHTML(sec);
  });
  return h + "</section>";
}

/* ---------------- print booklet ---------------- */

function bookletHTML() {
  return ACTIVE.map(function (d) {
    var h = '<div class="bk-page"><div class="bk-head">' +
      '<h2><span class="bk-swatch"></span>' + esc(d.name) + "</h2>" +
      '<div class="bk-spec">' + esc(t(d.glass)) + "  /  " + esc(t(d.ice)) + "  /  " + esc(t(d.method)) + "</div></div>";
    h += '<div class="bk-sec"><h3>' + esc(ui("ingredients")) + "</h3><ul>" +
      d.build.map(function (b) {
        var ing = ING[b.ref];
        return "<li>" + (b.ml ? b.ml + " ml " : "") + esc(t(ing.name)) + (b.note ? ". " + esc(t(b.note)) : "") + "</li>";
      }).join("") + "</ul></div>";
    h += '<div class="bk-sec"><h3>' + esc(ui("atBar")) + "</h3><ol>" +
      t(d.bar).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
    if (d.table) {
      h += '<div class="bk-sec"><h3>' + esc(ui("atTable")) + "</h3><ol>" +
        t(d.table).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
    }
    h += '<div class="bk-sec"><h3>' + esc(d.sayLabel ? t(d.sayLabel) : ui("sayThis")) + "</h3>" +
      t(d.say).map(function (s) { return '<p class="bk-say">' + esc(s) + "</p>"; }).join("") + "</div>";
    h += '<div class="bk-notes"><h3>' + esc(ui("myNotes")) + "</h3>" +
      '<div class="bk-rule"></div><div class="bk-rule"></div><div class="bk-rule"></div>' +
      '<div class="bk-rule"></div><div class="bk-rule"></div><div class="bk-rule"></div></div>';
    return h + "</div>";
  }).join("");
}

/* ---------------- render ---------------- */

var TABS = { builds: renderBuilds, rail: renderRail, prep: renderPrep, inventory: renderInventory, storage: renderStorage, future: renderFuture };

function render() {
  renderChrome();
  $("#root").innerHTML = MODE === "menu" ? renderMenu() : guideHTML() + (TABS[TAB] || renderBuilds)();
  try {
    localStorage.setItem("quatro-lang", LANG);
    localStorage.setItem("quatro-mode", MODE);
    localStorage.setItem("quatro-tab", TAB);
  } catch (e) {}
  if (sheetDrink) openSheet(sheetDrink.id);
}

/* ---------------- detail sheet, guest facing ---------------- */

var sheet = $("#sheet"), scrim = $("#scrim");
var sheetDrink = null, sheetTimer = null, lastFocus = null;

function openSheet(id) {
  var d = byId[id];
  if (!d) return;
  sheetDrink = d;
  $("#sheet-swatch").style.background = d.swatch;
  $("#sheet-name").textContent = d.name;

  /* FIX 1: STORY DUPLICATION, use story if present, otherwise fall back to desc */
  var displayText = d.story ? t(d.story) : t(d.desc);
  var flav = d.flavour ? '<p class="sheet-flav">' + esc(t(d.flavour)) + "</p>" : "";

  /* Guest sheet: story/desc and tag only. No glass, no ice, no method. */
  $("#sheet-body").innerHTML = flav + '<p class="story">' + esc(displayText) + "</p>" +
    (d.tag ? '<p style="margin-top:20px"><span class="card-tag">' + esc(t(d.tag)) + "</span></p>" : "");

  if (sheetTimer) { clearTimeout(sheetTimer); sheetTimer = null; }
  sheet.hidden = false;
  requestAnimationFrame(function () { sheet.classList.add("open"); scrim.classList.add("open"); });
  $("#sheet-close").focus();
}
function closeSheet() {
  sheet.classList.remove("open"); scrim.classList.remove("open");
  if (sheetTimer) clearTimeout(sheetTimer);
  /* Hiding is deferred so the exit transition can play, and the timer is held
     so a fast reopen can cancel it. */
  sheetTimer = setTimeout(function () { sheet.hidden = true; sheetTimer = null; }, 220);
  sheetDrink = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------------- events ---------------- */

document.addEventListener("click", function (e) {
  var m = e.target.closest("[data-mode]");
  if (m) { MODE = m.dataset.mode; render(); return; }

  var l = e.target.closest("[data-lang]");
  if (l) { LANG = l.dataset.lang; render(); return; }

  var tb = e.target.closest("[data-tab]");
  if (tb) { TAB = tb.dataset.tab; render(); return; }

  if (e.target.closest("#print-booklet")) {
    $("#booklet").innerHTML = bookletHTML();
    document.body.classList.add("booklet");
    window.print();
    /* Leave booklet mode once the dialog is done with. */
    setTimeout(function () { document.body.classList.remove("booklet"); }, 500);
    return;
  }

  var card = e.target.closest("[data-drink]");
  if (card) { lastFocus = card; openSheet(card.dataset.drink); return; }

  if (e.target.id === "sheet-close" || e.target.id === "scrim") closeSheet();
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
});

window.addEventListener("afterprint", function () { document.body.classList.remove("booklet"); });

render();
</script>
