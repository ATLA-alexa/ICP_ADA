<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Quatro, Amsterdam</title>
<style>
/* ==========================================================================
   QUATRO. One file, no network, works offline behind the bar.
   Warm limestone, ink, gold hairlines. The arch (20px 20px 6px 6px) is the
   brand, taken from the backlit limestone niches.
   ========================================================================== */

:root {
  --limestone: #FAF6EF;
  --limestone-deep: #F2EBDF;
  --ink: #23201C;
  --ink-soft: #6B6459;
  --gold: #A8863C;
  --gold-pale: #D9C79A;

  --amber: #B26A05;
  --amber-bg: #FBF0DC;
  --green: #2F6B3A;
  --green-bg: #EEF6F0;
  --red: #8C3A2E;
  --red-bg: #FBEEEB;

  --arch: 20px 20px 6px 6px;
  --arch-sm: 12px 12px 4px 4px;

  --display: 'Marcellus', Georgia, 'Times New Roman', serif;
  --body: 'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0; background: var(--limestone); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }

.wrap { max-width: 780px; margin: 0 auto; padding: 0 var(--s4) var(--s8); }
.smallcaps { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; color: var(--gold); }

/* ---- header + view toggle ------------------------------------------------ */

.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--limestone) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--gold-pale);
}
.topbar-inner {
  max-width: 780px; margin: 0 auto; padding: var(--s3) var(--s4);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
}
.brand { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
.brand-name { font-family: var(--display); font-size: 22px; letter-spacing: 0.02em; }
.brand-city { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }

.views { display: flex; gap: 2px; background: var(--limestone-deep); border-radius: 999px; padding: 3px; }
.views button {
  border: 0; background: transparent; border-radius: 999px; padding: 6px 12px;
  font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft);
  transition: background 140ms ease, color 140ms ease;
}
.views button[aria-pressed="true"] { background: var(--ink); color: var(--limestone); }

/* ---- masthead ------------------------------------------------------------ */

.masthead { text-align: center; padding: var(--s7) 0 var(--s5); }
.masthead h1 { font-size: 40px; letter-spacing: 0.03em; }
.masthead .rule { display: block; width: 120px; height: 1px; background: var(--gold-pale); margin: var(--s4) auto; }
.masthead p { margin: 0; color: var(--ink-soft); font-size: 15px; font-style: italic; }

/* ---- section ------------------------------------------------------------- */

.section { margin-top: var(--s7); }
.section-head { border-bottom: 1px solid var(--gold-pale); padding-bottom: var(--s2); margin-bottom: var(--s4); }
.section-head h2 { font-size: 26px; margin-top: var(--s1); }
.section-note { margin: var(--s2) 0 0; font-size: 14px; color: var(--ink-soft); font-style: italic; }

/* ---- drink cards --------------------------------------------------------- */

.cards { display: grid; grid-template-columns: 1fr; gap: var(--s3); }
@media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }

.card {
  position: relative; display: block; width: 100%; text-align: left;
  background: #fff; border: 1px solid var(--limestone-deep);
  border-radius: var(--arch); padding: var(--s4);
  transition: border-color 140ms ease, transform 140ms ease;
}
.card:hover { border-color: var(--gold-pale); }
.card:active { transform: scale(0.995); }

.card-top { display: flex; align-items: baseline; gap: var(--s2); }
/* The ring keeps pale swatches (cloud white) legible on the limestone. */
.swatch { width: 12px; height: 12px; border-radius: 999px; flex: 0 0 auto; transform: translateY(1px); box-shadow: inset 0 0 0 1px rgba(35,32,28,0.22); }
.card-name { font-family: var(--display); font-size: 19px; flex: 1 1 auto; min-width: 0; }
.card-price { font-family: var(--display); font-size: 16px; font-variant-numeric: tabular-nums; }
.card-desc { display: block; margin: var(--s2) 0 0; font-size: 14px; color: var(--ink-soft); }
.card-tag { display: inline-block; margin-top: var(--s3); font-size: 11.5px; color: var(--gold); border: 1px solid var(--gold-pale); border-radius: 999px; padding: 3px 9px; }

/* ---- rows (coffee, bottled, children) ------------------------------------ */

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: baseline; gap: var(--s3); width: 100%; text-align: left; border-bottom: 1px solid var(--limestone-deep); padding: var(--s3) 0; }
.row-name { font-family: var(--display); font-size: 17px; flex: 0 0 auto; }
.row-comp { font-size: 13px; color: var(--ink-soft); flex: 1 1 auto; min-width: 0; }
.row-price { font-family: var(--display); font-variant-numeric: tabular-nums; flex: 0 0 auto; }

.panel { margin-top: var(--s4); background: var(--limestone-deep); border-radius: var(--arch); padding: var(--s4) var(--s5); }
.panel h3 { font-size: 18px; margin-bottom: var(--s1); }
.panel p { margin: 0; font-size: 14px; color: var(--ink-soft); }

/* The syrup upsell carries more weight than a normal panel: gold hairline,
   paper surface, wider padding. Weight without shouting. */
.panel--upsell {
  background: #fff; border: 1px solid var(--gold-pale);
  padding: var(--s5); text-align: center;
}
.panel--upsell .smallcaps { display: block; margin-bottom: var(--s2); }
.panel--upsell h3 { font-size: 24px; margin-bottom: var(--s2); }
.panel--upsell p { font-size: 15px; color: var(--ink); }
.panel--upsell .sub { display: block; margin-top: var(--s2); font-size: 13px; color: var(--ink-soft); }

.altlist { margin: var(--s3) 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s2); }
.altlist li { font-size: 14px; color: var(--ink-soft); }
.altlist b { color: var(--ink); font-weight: 600; }

/* ---- todo ---------------------------------------------------------------- */

.todo { display: inline-block; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--amber-bg); color: var(--amber); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; font-weight: 600; }
.todo-block { margin-top: var(--s3); background: var(--amber-bg); border: 1px dashed var(--amber); border-radius: var(--arch-sm); padding: var(--s3); font-size: 13px; color: var(--amber); }
.todo-block ul { margin: var(--s2) 0 0; padding-left: 18px; }
.todo-panel { margin-top: var(--s7); background: var(--amber-bg); border: 1px solid var(--amber); border-radius: var(--arch); padding: var(--s5); }
.todo-panel h2 { font-size: 22px; color: var(--amber); }
.todo-panel ol { margin: var(--s3) 0 0; padding-left: 20px; color: var(--amber); font-size: 14px; }
.todo-panel li { margin-bottom: var(--s2); }
body.view-guest .todo, body.view-guest .todo-block, body.view-guest .todo-panel { display: none !important; }

/* ---- consolidated prep panel --------------------------------------------- */

.prep { margin-top: var(--s7); background: #fff; border: 1px solid var(--gold-pale); border-radius: var(--arch); padding: var(--s5); }
.prep h2 { font-size: 24px; }
.prep-group { margin-top: var(--s5); }
.prep-group h3 { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: var(--s2); }
.prep-list { margin: 0; padding: 0; list-style: none; }
.prep-list li { display: flex; flex-wrap: wrap; gap: 2px var(--s3); align-items: baseline; padding: var(--s2) 0; border-bottom: 1px solid var(--limestone-deep); font-size: 14px; }
.prep-name { font-weight: 600; flex: 0 0 auto; }
.prep-yield { color: var(--gold); font-size: 12.5px; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.prep-for { color: var(--ink-soft); font-size: 12.5px; flex: 1 1 100%; }
.fifo { margin-top: var(--s5); border: 1px solid var(--red); background: var(--red-bg); color: var(--red); border-radius: var(--arch-sm); padding: var(--s3) var(--s4); font-size: 13px; line-height: 1.5; }
.fifo strong { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
body.view-guest .prep { display: none !important; }

/* ---- detail sheet -------------------------------------------------------- */

.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(35,32,28,0.42); opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
.scrim.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; max-height: 88vh;
  display: flex; flex-direction: column; background: var(--limestone); border-radius: var(--arch);
  transform: translateY(102%); transition: transform 220ms cubic-bezier(0.2,0,0.2,1);
  box-shadow: 0 -8px 40px rgba(35,32,28,0.18);
}
.sheet.open { transform: translateY(0); }
/* display:flex above beats the browser default for [hidden], so say it here.
   Without this the sheet stays in the hit test and swallows every tap. */
.sheet[hidden], .drawer[hidden] { display: none; }
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; width: 680px; transform: translate(-50%, 102%); bottom: 3vh; max-height: 90vh; }
  .sheet.open { transform: translate(-50%, 0); }
}

.sheet-head { padding: var(--s5) var(--s5) var(--s3); border-bottom: 1px solid var(--gold-pale); }
.sheet-title { display: flex; align-items: baseline; gap: var(--s2); padding-right: 40px; }
.sheet-title h3 { font-size: 24px; flex: 1 1 auto; }
.sheet-meta { margin: var(--s2) 0 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.sheet-colour { margin: var(--s1) 0 0; font-size: 12px; color: var(--gold); font-style: italic; }
/* Guests do not need the glass, the ice or the method code. */
body.view-guest .sheet-meta, body.view-guest .sheet-colour { display: none !important; }

.sheet-close { position: absolute; top: var(--s3); right: var(--s3); width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--limestone-deep); background: #fff; color: var(--ink-soft); font-size: 18px; line-height: 1; display: grid; place-items: center; }

.tabs { display: flex; gap: var(--s1); padding: var(--s3) var(--s5) 0; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 6px 10px; border-radius: 999px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.tabs button[aria-selected="true"] { background: var(--limestone-deep); color: var(--ink); }
.tabs:has(button:only-child) { display: none; }

.sheet-body { overflow-y: auto; padding: var(--s4) var(--s5) var(--s7); -webkit-overflow-scrolling: touch; }
.story { font-size: 16px; line-height: 1.7; margin: 0; }

.spec { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); margin: 0 0 var(--s4); padding: 0; list-style: none; }
.spec div { font-size: 13px; }
.spec dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.spec dd { margin: 2px 0 0; }

.ing { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }
.ing button { display: flex; width: 100%; align-items: baseline; gap: var(--s3); text-align: left; background: none; border: 0; border-bottom: 1px solid var(--limestone-deep); padding: 10px 0; }
.ing .ml { font-variant-numeric: tabular-nums; color: var(--gold); font-size: 13px; min-width: 52px; }
.ing .nm { flex: 1 1 auto; font-size: 15px; }
.ing .nm small { display: block; color: var(--ink-soft); font-size: 12.5px; }
.ing .chev { color: var(--gold-pale); font-size: 14px; }

.steps { margin: 0; padding-left: 20px; }
.steps li { margin-bottom: var(--s2); font-size: 14.5px; }
.substack { margin-bottom: var(--s5); }
.substack h4 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: var(--s2); }

blockquote.say { margin: 0 0 var(--s3); padding: var(--s3) var(--s4); border-left: 2px solid var(--gold); background: #fff; border-radius: 0 var(--arch-sm) var(--arch-sm) 0; font-family: var(--display); font-size: 17px; line-height: 1.5; }
blockquote.say .cue { display: block; font-family: var(--body); font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; margin-top: var(--s2); }

.econ { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch-sm); padding: var(--s3) var(--s4); margin-bottom: var(--s4); }
.econ div { font-size: 13px; }
.econ dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.econ dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.econ .good { color: var(--green); font-weight: 600; }

/* ---- quiz ---------------------------------------------------------------- */

.quiz-btn { margin-bottom: var(--s4); border: 1px solid var(--gold); background: none; color: var(--gold); border-radius: 999px; padding: 7px 14px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.quiz-btn[aria-pressed="true"] { background: var(--gold); color: #fff; }
.quiz-hidden { filter: blur(7px); opacity: 0.55; pointer-events: none; user-select: none; }
.quiz-prompt { background: #fff; border: 1px dashed var(--gold-pale); border-radius: var(--arch-sm); padding: var(--s4); margin-bottom: var(--s4); text-align: center; }
.quiz-prompt strong { font-family: var(--display); font-size: 20px; display: block; }
.quiz-prompt span { font-size: 13px; color: var(--ink-soft); }

/* ---- inventory drawer ---------------------------------------------------- */

.drawer {
  position: fixed; z-index: 70; left: 0; right: 0; bottom: 0; max-height: 70vh; overflow-y: auto;
  background: #fff; border-radius: var(--arch); padding: var(--s5);
  transform: translateY(102%); transition: transform 200ms cubic-bezier(0.2,0,0.2,1);
  box-shadow: 0 -8px 40px rgba(35,32,28,0.22);
}
.drawer.open { transform: translateY(0); }
@media (min-width: 720px) { .drawer { left: 50%; right: auto; width: 520px; transform: translate(-50%, 102%); bottom: 6vh; } .drawer.open { transform: translate(-50%, 0); } }
.drawer h4 { font-size: 20px; margin-bottom: var(--s3); }
.drawer dl { display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s4); margin: 0; font-size: 14px; }
.drawer dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); padding-top: 4px; }
.drawer dd { margin: 0; }

/* ---- owner --------------------------------------------------------------- */

.owner-controls { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: end; margin-bottom: var(--s4); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.field select { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--gold-pale); border-radius: var(--arch-sm); background: #fff; color: var(--ink); }
.owner-summary { font-size: 13px; color: var(--ink-soft); margin: 0 0 var(--s4); }

.tablewrap { overflow-x: auto; border: 1px solid var(--limestone-deep); border-radius: var(--arch); background: #fff; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 900px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--limestone-deep); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--limestone-deep); z-index: 1; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); cursor: pointer; user-select: none; }
th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--gold); }
th .arrow { opacity: 0.4; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.tbd { color: var(--amber); font-size: 11px; letter-spacing: 0.08em; }
tbody tr:hover { background: var(--limestone); }

.pill { font-size: 11px; border-radius: 999px; padding: 2px 8px; border: 1px solid; }
.pill.full { color: var(--green); border-color: #A9C9B0; background: var(--green-bg); }
.pill.base { color: var(--amber); border-color: var(--gold-pale); background: var(--amber-bg); }
.pill.no   { color: var(--red); border-color: #E0B3AA; background: var(--red-bg); }

.bar { display: flex; align-items: center; gap: var(--s2); }
.bar-track { width: 62px; height: 6px; background: var(--limestone-deep); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--gold); border-radius: 999px; }
.legend { font-size: 12px; color: var(--ink-soft); margin-top: var(--s3); line-height: 1.6; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
.kpi { background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch-sm); padding: var(--s3) var(--s4); }
.kpi dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.kpi dd { margin: 4px 0 0; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.kpi small { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

.email { background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch); padding: var(--s4) var(--s5); margin-top: var(--s4); }
.email h4 { font-size: 18px; margin-bottom: var(--s2); }
.email .to { font-size: 12px; color: var(--gold); letter-spacing: 0.06em; margin-bottom: var(--s3); }
.email pre { font-family: var(--mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; background: var(--limestone); border-radius: var(--arch-sm); padding: var(--s3); margin: 0; color: var(--ink); }
.copy-btn { margin-top: var(--s3); border: 1px solid var(--gold); background: none; color: var(--gold); border-radius: 999px; padding: 6px 14px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.copy-btn.done { background: var(--green); border-color: var(--green); color: #fff; }

/* ---- footer -------------------------------------------------------------- */

.footer { margin-top: var(--s8); border-top: 1px solid var(--gold-pale); padding-top: var(--s4); text-align: center; }
.footer .claim { font-family: var(--display); font-size: 18px; }
.footer .fine { font-size: 12px; color: var(--ink-soft); margin-top: var(--s2); }

body:not(.view-owner) .owner-only { display: none; }
body.view-owner .guest-only { display: none; }

/* ---- print --------------------------------------------------------------- */

@media print {
  /* Target is a 2 to 3 page paper menu, tuned tight. */
  @page { margin: 10mm 11mm; }
  body { background: #fff; font-size: 9pt; line-height: 1.4; }
  .topbar, .views, .owner-only, .todo, .todo-block, .todo-panel, .prep, .fifo,
  .scrim, .sheet, .drawer, .quiz-btn, .print-hide { display: none !important; }
  .wrap { max-width: none; padding: 0; }

  .masthead { padding: 0 0 4mm; }
  .masthead h1 { font-size: 22pt; }
  .masthead .rule { margin: 2mm auto; width: 70px; }
  .masthead p { font-size: 9pt; }

  .section { margin-top: 5mm; break-inside: auto; }
  .section-head { break-after: avoid; padding-bottom: 1mm; margin-bottom: 2.5mm; }
  .section-head h2 { font-size: 14pt; }
  .section-head .smallcaps { display: none; }
  .section-note { font-size: 8pt; margin-top: 0.5mm; }

  .cards { grid-template-columns: 1fr 1fr; gap: 2mm 6mm; }
  .card { border: 0; padding: 0 0 2mm; background: none !important; break-inside: avoid; border-radius: 0; }
  .card-name { font-size: 11pt; }
  .card-desc { font-size: 8pt; margin-top: 0.5mm; }
  .card-tag { border: 0; padding: 0; color: var(--ink-soft); font-style: italic; margin-top: 0.5mm; font-size: 7.5pt; display: block; }

  .rows { display: block; column-count: 3; column-gap: 6mm; }
  .row { display: flex; padding: 0.8mm 0; break-inside: avoid; border-bottom: 0; }
  .row-name { font-size: 8.5pt; }
  .row-comp { font-size: 7.5pt; }

  .panel { background: none; border: 0; border-top: 1px solid #ccc; padding: 2mm 0 0; margin-top: 2mm; break-inside: avoid; }
  .panel h3 { font-size: 10pt; }
  .panel p, .altlist li { font-size: 8pt; }
  .panel--upsell { border: 1px solid #999; padding: 2.5mm; text-align: center; }
  .panel--upsell h3 { font-size: 11pt; }

  .footer { margin-top: 5mm; padding-top: 2mm; }
  .footer .claim { font-size: 11pt; }
  .footer .fine { font-size: 7pt; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>
<body class="view-guest">

<header class="topbar print-hide">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-name">Quatro</span>
      <span class="brand-city">Amsterdam</span>
    </div>
    <div class="views" role="group" aria-label="Choose view">
      <button type="button" data-view="guest"  aria-pressed="true">Guest</button>
      <button type="button" data-view="staff"  aria-pressed="false">Staff</button>
      <button type="button" data-view="owner"  aria-pressed="false">Owner</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="masthead">
    <h1>Quatro</h1>
    <span class="rule"></span>
    <p>The venue is the calm campus. The drinks are the paint.</p>
  </div>

  <div id="guest-root" class="guest-only"></div>
  <div id="owner-root" class="owner-only"></div>
  <!-- Prep and open items belong to Staff AND Owner. The body.view-guest
       rules are what keep them away from guests and print. -->
  <div id="prep-root"></div>
  <div id="todo-root"></div>

  <footer class="footer">
    <div class="claim">Everything on this menu is alcohol-free</div>
    <p class="fine">Naturally fermented drinks are non-alcoholic by law and may contain traces below 0.5%, as ripe fruit does. Please tell us about any allergies. We build around them.</p>
  </footer>
</main>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name" hidden>
  <div class="sheet-head">
    <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">&times;</button>
    <div class="sheet-title">
      <span class="swatch" id="sheet-swatch"></span>
      <h3 id="sheet-name"></h3>
      <span class="card-price" id="sheet-price"></span>
    </div>
    <p class="sheet-meta" id="sheet-meta"></p>
    <p class="sheet-colour" id="sheet-colour"></p>
  </div>
  <div class="tabs" id="sheet-tabs" role="tablist"></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-name" hidden>
  <h4 id="drawer-name"></h4>
  <dl id="drawer-body"></dl>
</aside>

var ING = MENU_DATA.inventory;
var $ = function (sel) { return document.querySelector(sel); };
var esc = function (s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
};
var money = function (n) { return n.toFixed(2); };

/* The one place price policy lives. While PRICES_LIVE is false this returns
   null for everything, so no price renders anywhere on the menu. */
function livePrice(d) { return PRICES_LIVE ? (d.price != null ? d.price : d.sheetPrice) : d.price; }

var ALL_DRINKS = [];
MENU_DATA.sections.forEach(function (sec) {
  (sec.drinks || []).forEach(function (d) { d._section = sec.title; ALL_DRINKS.push(d); });
});
var byId = {};
ALL_DRINKS.forEach(function (d) { byId[d.id] = d; });

function netOfVat(sell) { return sell == null ? null : sell / (1 + VAT); }
function gpEur(sell, cost) { return (sell == null || cost == null) ? null : netOfVat(sell) - cost; }
function gpPct(sell, cost) {
  var g = gpEur(sell, cost);
  return g == null ? null : (g / netOfVat(sell)) * 100;
}
function scalability(ops) {
  if (!ops) return null;
  return Math.max(1, Math.min(5, 5 - 0.5 * ops.steps + (ops.prebatch === "full" ? 1 : 0)));
}

var POWDER_TOTALS = (function () {
  var monthly = 0, opening = 0;
  POWDERS.forEach(function (p) {
    p.costPerG = p.costPerKg / 1000;
    p.costPerDrink = p.costPerG * p.gPerDrink;
    p.monthlyCost = p.costPerG * p.monthlyG;
    var kg = parseFloat(p.buy);
    p.openingCost = kg * p.costPerKg;
    p.monthsCovered = (kg * 1000) / p.monthlyG;
    monthly += p.monthlyCost; opening += p.openingCost;
  });
  return { monthly: monthly, opening: opening };
})();

var GLASS_TOTAL = GLASSWARE.reduce(function (n, g) { return n + g.qty * g.unitEur; }, 0);
var GLASS_COUNT = GLASSWARE.reduce(function (n, g) { return n + g.qty; }, 0);

try { VIEW = localStorage.getItem("quatro-view") || "guest"; } catch (e) { VIEW = "guest"; }
if (["guest", "staff", "owner"].indexOf(VIEW) === -1) VIEW = "guest";

function setView(v) {
  VIEW = v;
  document.body.className = "view-" + v;
  Array.prototype.forEach.call(document.querySelectorAll(".views button"), function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.view === v));
  });
  try { localStorage.setItem("quatro-view", v); } catch (e) {}
  if (v === "owner") renderOwner();
  if (sheetDrink) openSheet(sheetDrink.id, activeTab);
}

document.querySelector(".views").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-view]");
  if (b) setView(b.dataset.view);
});

  if (!ing) return "";
  var open = /TODO|CONFIRM|CHECK/.test(ing.supplier || "");
  return '<li><button type="button" data-ing="' + esc(item.ref) + '">' +
      '<span class="ml">' + esc(item.ml ? item.ml + " ml" : "") + "</span>" +
      '<span class="nm">' + esc(ing.name) +
        (item.note ? "<small>" + esc(item.note) + "</small>" : "") +
        (open ? '<span class="todo">todo</span>' : "") +
      "</span><span class=\"chev\">&rsaquo;</span></button></li>";
}

function todoBlock(d) {
  var items = (d.todos || []);
  if (!items.length) return "";
  return '<div class="todo-block"><strong>Open items</strong><ul>' +
    items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>";
}

function econStrip(d) {
  if (VIEW === "guest") return "";
  var cost = d.ops ? d.ops.cost : null, sp = d.sheetPrice;
  var g = gpEur(sp, cost), gp = gpPct(sp, cost);
  return '<dl class="econ">' +
    "<div><dt>Sheet proposal</dt><dd>" + (sp != null ? "EUR " + money(sp) : "TBD") + "</dd></div>" +
    "<div><dt>Pour cost</dt><dd>" + (cost != null ? "EUR " + money(cost) + (d.ops && d.ops.estimate ? " est" : "") : "TBD") + "</dd></div>" +
    "<div><dt>GP if agreed</dt><dd" + (gp != null && gp >= 80 ? ' class="good"' : "") + ">" + (gp != null ? gp.toFixed(1) + "%" : "TBD") + "</dd></div>" +
  "</dl>";
}

function tabBody(d, tab) {
  if (tab === "story") {
    /* Story only. The card already said what it is. */
    var h = '<p class="story">' + esc(d.story) + "</p>";
    if (VIEW !== "guest" && d.credit) h += '<p class="sheet-meta" style="margin-top:16px">' + esc(d.credit) + "</p>";
    if (d.tag) h += '<p style="margin-top:20px"><span class="card-tag">' + esc(d.tag) + "</span></p>";
    return h + todoBlock(d);
  }

  if (tab === "build") {
    var quiz = '<button class="quiz-btn" id="quiz-toggle" type="button" aria-pressed="' + (quizOn ? "true" : "false") + '">' +
      (quizOn ? "Show the build" : "Quiz me") + "</button>";
    var prompt = quizOn
      ? '<div class="quiz-prompt"><strong>' + esc(d.name) + "</strong><span>" + esc(d.glass) + ". Tap to reveal.</span></div>"
      : "";
    var spec = '<dl class="spec">' +
      "<div><dt>Glass</dt><dd>" + esc(d.glass) + "</dd></div>" +
      "<div><dt>Ice</dt><dd>" + esc(d.ice) + "</dd></div>" +
      "<div><dt>Method</dt><dd>" + esc(d.method) + "</dd></div></dl>";
    var list = '<ul class="ing' + (quizOn ? " quiz-hidden" : "") + '">' + d.build.map(ingRow).join("") + "</ul>";
    return quiz + prompt + (quizOn ? "" : econStrip(d) + spec) + list + todoBlock(d);
  }

  if (tab === "service") {
    var h2 = '<div class="substack"><h4>At the bar</h4><ol class="steps">' +
      d.bar.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
    if (d.table && d.table.length) {
      h2 += '<div class="substack"><h4>At the table</h4><ol class="steps">' +
        d.table.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
    }
    /* No FIFO block here any more. It lives once, in the prep panel. */
    return h2 + '<div class="substack"><h4>Between drinks, 30 seconds</h4><ol class="steps">' +
      RESET.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
  }

  return d.say.map(function (s) {
    return '<blockquote class="say">' + esc(s.line) +
      (s.cue ? '<span class="cue">' + esc(s.cue) + "</span>" : "") +
      (s.draft ? '<span class="todo">draft, confirm wording</span>' : "") + "</blockquote>";
  }).join("") + todoBlock(d);
}

function openSheet(id, tab) {
  var d = byId[id];
  if (!d) return;
  if (sheetDrink !== d) quizOn = false;
  sheetDrink = d;
  var allowed = tabsFor().map(function (t) { return t.id; });
  activeTab = allowed.indexOf(tab) === -1 ? "story" : tab;

  var p = livePrice(d);
  $("#sheet-swatch").style.background = d.swatch.hex;
  $("#sheet-name").textContent = d.name;
  $("#sheet-price").textContent = p != null ? money(p) : "";
  /* Guests never see the bar data. CSS hides it too, this keeps it out of the
     accessibility tree as well. */
  $("#sheet-meta").textContent = VIEW === "guest" ? "" : [d.glass, d.ice, d.method].filter(Boolean).join("  /  ");
  $("#sheet-colour").textContent = VIEW === "guest" ? "" : d.swatch.name;

  $("#sheet-tabs").innerHTML = tabsFor().map(function (t) {
    return '<button type="button" role="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === activeTab) + '">' + t.label + "</button>";
  }).join("");
  $("#sheet-body").innerHTML = tabBody(d, activeTab);
  $("#sheet-body").scrollTop = 0;

  if (sheetTimer) { clearTimeout(sheetTimer); sheetTimer = null; }
  sheet.hidden = false;
  requestAnimationFrame(function () { sheet.classList.add("open"); scrim.classList.add("open"); });
  $("#sheet-close").focus();
}

function closeSheet() {
  sheet.classList.remove("open");
  scrim.classList.remove("open");
  closeDrawer();
  if (sheetTimer) clearTimeout(sheetTimer);
  sheetTimer = setTimeout(function () { sheet.hidden = true; sheetTimer = null; }, 220);
  sheetDrink = null; quizOn = false;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

document.addEventListener("click", function (e) {
  var copy = e.target.closest("[data-copy]");
  if (copy) { copyEmail(copy); return; }

  var card = e.target.closest("[data-drink]");
  if (card) { lastFocus = card; openSheet(card.dataset.drink, "story"); return; }

  var tab = e.target.closest("[data-tab]");
  if (tab && sheetDrink) {
    activeTab = tab.dataset.tab;
    $("#sheet-tabs").querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === activeTab));
    });
    $("#sheet-body").innerHTML = tabBody(sheetDrink, activeTab);
    $("#sheet-body").scrollTop = 0;
    return;
  }

  if (e.target.closest("#quiz-toggle") && sheetDrink) {
    quizOn = !quizOn; $("#sheet-body").innerHTML = tabBody(sheetDrink, "build"); return;
  }
  if (e.target.closest(".quiz-prompt") && quizOn && sheetDrink) {
    quizOn = false; $("#sheet-body").innerHTML = tabBody(sheetDrink, "build"); return;
  }

  var ingBtn = e.target.closest("[data-ing]");
  if (ingBtn) { openDrawer(ingBtn.dataset.ing); return; }

  if (e.target.id === "sheet-close" || e.target.id === "scrim") { closeSheet(); }
});

document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  /* Read the class, not the hidden attribute: hidden is set on a timeout so
     the exit transition can play, and a quick second Escape would otherwise
     close the drawer twice and leave the sheet open. */
  if (drawer.classList.contains("open")) closeDrawer();
  else if (sheet.classList.contains("open")) closeSheet();
});

/* ---------------- inventory drawer ---------------- */

function openDrawer(key) {
  var ing = ING[key];
  if (!ing) return;
  var open = /TODO|CONFIRM|CHECK/.test(ing.supplier || "");
  $("#drawer-name").textContent = ing.name;
  $("#drawer-body").innerHTML =
    "<dt>Pack</dt><dd>" + esc(ing.pack) + "</dd>" +
    (ing.cost_per_pack_eur != null
      ? "<dt>Cost</dt><dd>EUR " + money(ing.cost_per_pack_eur) + " per pack" + (ing.estimate ? '<span class="todo">estimate</span>' : "") + "</dd>"
      : "<dt>Cost</dt><dd>TBD</dd>") +
    "<dt>Prebatch</dt><dd>" + esc(ing.prebatch) + "</dd>" +
    "<dt>Supplier</dt><dd>" + esc(ing.supplier) + (open ? '<span class="todo">open</span>' : "") + "</dd>" +
    (ing.notes ? "<dt>Notes</dt><dd>" + esc(ing.notes) + "</dd>" : "");
  if (drawerTimer) { clearTimeout(drawerTimer); drawerTimer = null; }
  drawer.hidden = false;
  requestAnimationFrame(function () { drawer.classList.add("open"); });
}
function closeDrawer() {
  drawer.classList.remove("open");
  if (drawerTimer) clearTimeout(drawerTimer);
  drawerTimer = setTimeout(function () { drawer.hidden = true; drawerTimer = null; }, 200);
}
drawer.addEventListener("click", function (e) { if (e.target === drawer) closeDrawer(); });

/* ---------------- copy to clipboard, offline safe ---------------- */

function copyEmail(btn) {
  var em = VENDOR_EMAILS.filter(function (x) { return x.id === btn.dataset.copy; })[0];
  if (!em) return;
  var text = (em.to ? "To: " + em.to + "\n" : "") + "Subject: " + em.subject + "\n\n" + em.body;
  var done = function () {
    btn.textContent = "Copied"; btn.classList.add("done");
    setTimeout(function () { btn.textContent = "Copy email"; btn.classList.remove("done"); }, 1800);
  };
  /* navigator.clipboard needs a secure context, and file:// is not one, so
     fall back to a hidden textarea and execCommand. */
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
  } else { legacyCopy(text, done); }
}
function legacyCopy(text, done) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.top = "-1000px";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

/* ---------------- owner view ---------------- */

var COLS = [
  { key: "name",       label: "Drink" },
  { key: "_section",   label: "Category" },
  { key: "sheetPrice", label: "Sheet proposal" },
  { key: "cost",       label: "Est. cost" },
  { key: "gp",         label: "GP EUR" },
  { key: "gpp",        label: "GP%" },
  { key: "prebatch",   label: "Prebatch" },
  { key: "steps",      label: "To-order steps" },
  { key: "complexity", label: "Complexity" },
  { key: "profile",    label: "Profile" },
  { key: "scal",       label: "Scalability" }
];

var FILTERS = {
  all:     { label: "All drinks",                fn: function () { return true; } },
  full:    { label: "Fully prebatchable",        fn: function (r) { return r.prebatch === "full"; } },
  fast:    { label: "Under 60 seconds to serve", fn: function (r) { return r.seconds < 60; } },
  fresh:   { label: "Needs to-order fresh prep", fn: function (r) { return r.prebatch === "no"; } },
  layered: { label: "Layered theatre drinks",    fn: function (r) { return r.profile === "layered"; } }
};

var ownerSort = { key: "gpp", dir: -1 };
var ownerFilter = "all";
var PREBATCH_LABEL = { full: "Fully", base: "Base only", no: "No" };

function ownerRows() {
  return ALL_DRINKS.filter(function (d) { return d.ops; }).map(function (d) {
    var cost = d.ops.cost, sp = d.sheetPrice;
    return {
      name: d.name, _section: d._section, sheetPrice: sp,
      cost: cost, estimate: d.ops.estimate, gp: gpEur(sp, cost), gpp: gpPct(sp, cost),
      prebatch: d.ops.prebatch, steps: d.ops.steps, seconds: d.ops.seconds,
      complexity: d.ops.complexity, profile: d.ops.profile, scal: scalability(d.ops)
    };
  });
}

function eur(n, est) { return n == null ? '<td class="tbd">TBD</td>' : '<td class="num">' + money(n) + (est ? " e" : "") + "</td>"; }

function economicsHTML() {
  var powderRows = POWDERS.map(function (p) {
    return "<tr><td>" + esc(p.label) + "</td><td>" + esc(p.drink) + "</td>" +
      '<td class="num">' + (p.share * 100).toFixed(0) + "%</td>" +
      '<td class="num">' + p.drinks + "</td>" +
      '<td class="num">' + p.gPerDrink + " g</td>" +
      '<td class="num">' + p.monthlyG + " g</td>" +
      '<td class="num">' + money(p.costPerKg) + (p.estimate ? " e" : "") + "</td>" +
      '<td class="num">' + money(p.costPerDrink) + "</td>" +
      '<td class="num">' + money(p.monthlyCost) + "</td>" +
      "<td>" + esc(p.buy) + "</td>" +
      '<td class="num">' + p.monthsCovered.toFixed(1) + "</td></tr>";
  }).join("");

  var glassRows = GLASSWARE.map(function (g) {
    return "<tr><td>" + esc(g.item) + "</td><td>" + esc(g.volume) + "</td>" +
      '<td class="num">' + g.qty + "</td>" +
      '<td class="num">' + money(g.unitEur) + (g.estimate ? " e" : "") + "</td>" +
      '<td class="num">' + money(g.qty * g.unitEur) + "</td></tr>";
  }).join("");

  var emails = VENDOR_EMAILS.map(function (em) {
    return '<div class="email"><h4>' + esc(em.vendor) + "</h4>" +
      '<div class="to">' + (em.to ? "To: " + esc(em.to) + (em.attn ? ", attn " + esc(em.attn) : "") : "Address: TODO, take it from the vendor's own contact page") + "</div>" +
      "<pre>Subject: " + esc(em.subject) + "\n\n" + esc(em.body) + "</pre>" +
      '<button class="copy-btn" type="button" data-copy="' + esc(em.id) + '">Copy email</button></div>';
  }).join("");

  return '<section class="section">' +
    '<div class="section-head"><div class="smallcaps">Operations</div><h2>Volume and inventory model</h2>' +
    '<p class="section-note">' + esc(VOLUME.note) + " Figures marked e are estimates, not invoices.</p></div>" +

    '<dl class="kpis">' +
      "<div class=\"kpi\"><dt>Crafted drinks a month</dt><dd>" + VOLUME.craftedPerMonth + "</dd><small>" + VOLUME.draftsPerDay + " a day, " + VOLUME.daysPerWeek + " days</small></div>" +
      "<div class=\"kpi\"><dt>Exotic powder COGS</dt><dd>EUR " + money(POWDER_TOTALS.monthly) + "</dd><small>per month, four powders</small></div>" +
      "<div class=\"kpi\"><dt>Opening powder order</dt><dd>EUR " + money(POWDER_TOTALS.opening) + "</dd><small>3 month buy at staffel</small></div>" +
      "<div class=\"kpi\"><dt>Glassware</dt><dd>EUR " + money(GLASS_TOTAL) + "</dd><small>" + GLASS_COUNT + " pieces, quote pending</small></div>" +
    "</dl>" +

    '<h3 style="margin-top:24px;font-size:18px">Exotic powders</h3>' +
    '<div class="tablewrap" style="margin-top:8px"><table><thead><tr>' +
      "<th>Ingredient</th><th>Drink</th><th>Share</th><th>Drinks</th><th>Per drink</th><th>Monthly</th><th>EUR per kg</th><th>EUR per drink</th><th>Monthly EUR</th><th>Buy</th><th>Months</th>" +
    "</tr></thead><tbody>" + powderRows + "</tbody></table></div>" +
    '<p class="legend">Fee Foam sits outside this table: EUR 12.00 for 250 ml, about 0.4 ml a drink, so EUR 0.019 a drink. ' +
    "Taro, hojicha and black sesame are bought to the staffel break rather than to exact demand, so those packs cover about 5 months each rather than 3. That is the price of the discount, not an error.</p>" +

    '<h3 style="margin-top:32px;font-size:18px">Glassware</h3>' +
    '<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Item</th><th>Volume</th><th>Qty</th><th>EUR each</th><th>EUR total</th></tr></thead><tbody>' +
      glassRows + '<tr><td colspan="4"><b>Total</b></td><td class="num"><b>' + money(GLASS_TOTAL) + "</b></td></tr>" +
    "</tbody></table></div>" +
    '<p class="legend">' + esc(GLASSWARE_NOTE) + "</p>" +

    '<h3 style="margin-top:32px;font-size:18px">Vendor quotation emails</h3>' +
    '<p class="legend">Three drafts, ready to send. They ask for staffel pricing against the three month volume above.</p>' +
    emails +
  "</section>";
}

function renderOwner() {
  var rows = ownerRows().filter(FILTERS[ownerFilter].fn);
  rows.sort(function (a, b) {
    var k = ownerSort.key, av = a[k], bv = b[k];
    /* Nulls (uncosted or unpriced rows) sort to the bottom rather than winning. */
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === "string") return av.localeCompare(bv) * ownerSort.dir;
    return (av - bv) * ownerSort.dir;
  });

  var costed = rows.filter(function (r) { return r.cost != null && r.sheetPrice != null; });
  var avgGp = costed.length ? costed.reduce(function (n, r) { return n + r.gpp; }, 0) / costed.length : null;

  var head = COLS.map(function (c) {
    var sorted = ownerSort.key === c.key;
    return '<th data-col="' + c.key + '" aria-sort="' +
      (sorted ? (ownerSort.dir === 1 ? "ascending" : "descending") : "none") + '">' + c.label +
      (sorted ? ' <span class="arrow">' + (ownerSort.dir === 1 ? "&uarr;" : "&darr;") + "</span>" : "") + "</th>";
  }).join("");

  var body = rows.map(function (r) {
    var pct = ((r.scal - 1) / 4) * 100;
    return "<tr>" +
      "<td>" + esc(r.name) + "</td>" + "<td>" + esc(r._section) + "</td>" +
      eur(r.sheetPrice) + eur(r.cost, r.estimate) + eur(r.gp) +
      (r.gpp != null ? '<td class="num">' + r.gpp.toFixed(1) + "%</td>" : '<td class="tbd">TBD</td>') +
      '<td><span class="pill ' + r.prebatch + '">' + PREBATCH_LABEL[r.prebatch] + "</span></td>" +
      '<td class="num">' + r.steps + "</td>" + '<td class="num">' + r.complexity + "</td>" +
      "<td>" + (r.profile === "layered" ? "Layered" : "Single flavour") + "</td>" +
      '<td><span class="bar"><span class="bar-track"><span class="bar-fill" style="width:' +
        pct.toFixed(0) + '%"></span></span>' + r.scal.toFixed(1) + "</span></td></tr>";
  }).join("");

  $("#owner-root").innerHTML =
    '<section class="section" style="margin-top:24px">' +
      '<div class="section-head"><div class="smallcaps">Operations</div><h2>Margin and scale</h2>' +
      '<p class="section-note">No price is live. Sheet proposal is the figure from the pricing spreadsheet, shown here so the costing survives until Achraf signs off. GP is computed from it net of VAT at ' + (VAT * 100).toFixed(0) + ' percent, never read from the sheet, because ten rows there carried broken arithmetic. Costs marked e are estimates.</p></div>' +
      '<div class="owner-controls"><div class="field"><label for="owner-filter">Filter</label>' +
      '<select id="owner-filter">' +
        Object.keys(FILTERS).map(function (k) {
          return '<option value="' + k + '"' + (k === ownerFilter ? " selected" : "") + ">" + FILTERS[k].label + "</option>";
        }).join("") +
      "</select></div></div>" +
      '<p class="owner-summary">' + rows.length + " drink" + (rows.length === 1 ? "" : "s") + " shown, " + costed.length + " with both a proposal and a cost" +
        (avgGp != null ? ", average GP if agreed " + avgGp.toFixed(1) + " percent" : "") + ".</p>" +
      '<div class="tablewrap"><table><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>" +
      '<p class="legend"><b>Scalability Score</b> = 5 minus 0.5 x to-order steps, plus 1 if fully prebatchable, clamped to 1 through 5. ' +
      "A high score means the drink survives a full room. A low score means it needs a person standing still.</p></section>" +
    economicsHTML();

  $("#owner-filter").addEventListener("change", function (e) { ownerFilter = e.target.value; renderOwner(); });
  $("#owner-root").querySelectorAll("th[data-col]").forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.dataset.col;
      if (ownerSort.key === k) ownerSort.dir *= -1;
      else { ownerSort.key = k; ownerSort.dir = (k === "name" || k === "_section" || k === "prebatch" || k === "profile") ? 1 : -1; }
      renderOwner();
    });
  });
}

setView(VIEW);
</script>
