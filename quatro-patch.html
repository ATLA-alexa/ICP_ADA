@media (max-width: 719px) {
  .inv-t, .inv-t tbody, .inv-t td { display: block; width: 100%; }
  .inv-t thead { display: none; }

  /* Two lines, not ten. The name and the count you are about to change sit
     on the first line; Per week and Still to buy sit on the second as chips.
     Everything else is behind the toggle, in the order the columns are set. */
  .inv-t tr.inv-r { display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: 3px 12px; border-bottom: 1px solid var(--gold-pale); padding: 9px 0; width: 100%; }
  .inv-t tr.inv-r td { border: 0; padding: 0; display: inline-flex; flex-wrap: wrap;
    align-items: baseline; gap: 5px; width: auto; min-width: 0; }
  .inv-t tr.inv-r td::before { content: attr(data-l); font-size: 9.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--gold); white-space: nowrap; }

  .inv-t tr.inv-r td.c-item { order: -4; flex: 1 1 calc(100% - 118px);
    display: block; padding-left: 40px; position: relative; }
  .inv-t tr.inv-r td.c-item::before { display: none; }   /* the name needs no label */
  .inv-t tr.inv-r td.c-have { order: -3; flex: 0 0 auto; }
  .inv-t tr.inv-r td.c-need { order: -2; }
  .inv-t tr.inv-r td.c-buy  { order: -1; }
  .inv-t tr.inv-r td.num { text-align: left; }
  /* Scoped to closed cards, so opening one needs no rule strong enough to
     beat this: the :not() chain outranks any plain .open selector. */
  .inv-t tr.inv-r:not(.open) td:not(.c-item):not(.c-have):not(.c-need):not(.c-buy):not(.c-st),
  .inv-t tr.inv-r td.c-plus { display: none; }
  .inv-t tr.inv-r.open td.c-where, .inv-t tr.inv-r.open td.c-dot, .inv-t tr.inv-r.open td.c-cat { flex: 1 1 100%; }
  .inv-t tr.inv-r.open td.c-note, .inv-t tr.inv-r.open td.c-x { display: block; flex: 1 1 100%; }
  .inv-t tr.inv-r.open td.c-note::before, .inv-t tr.inv-r.open td.c-x::before { display: block; margin-bottom: 2px; }
  .inv-t tr.inv-r td.c-cat .iv-field { min-width: 0; flex: 1 1 140px; }
  /* A status sits on the first line of a closed card, right of the name,
     so the card stays two lines tall. */
  .inv-t tr.inv-r:not(.open) td.c-st { order: -4; flex: 0 0 auto; }
  .inv-t tr.inv-r:not(.open) td.c-st::before { display: none; }
  .inv-t tr.inv-r:not(.open) td.c-st .iv-ssel { max-width: 104px; font-size: 11px; padding: 3px 2px 3px 6px; }

  .inv-t tr.inv-r .iv-grip { position: absolute; left: 0; top: 0; width: 14px; height: 22px; margin: 0; }
  .iv-more { display: block; position: absolute; left: 18px; top: 1px; width: 20px; height: 20px;
    border: 0; background: none; padding: 0; }
  .iv-more::before { content: ""; position: absolute; left: 5px; top: 6px;
    border-left: 5px solid var(--gold); border-top: 4px solid transparent;
    border-bottom: 4px solid transparent; transition: transform 120ms; }
  .inv-r.open .iv-more::before { transform: rotate(90deg); }
  .inv-t tr.inv-r td.c-item .iv-del { display: none; }
  .inv-t tr.inv-r.open td.c-item .iv-del { display: inline; opacity: .55; }

  /* The editable fields carry margin:0 -3px so the hover pad sits flush with
     the text. Stacked, that bleeds 3px past the container and reintroduces a
     sideways scroll, so drop the pull on a phone. */
  .inv-t tr.inv-r .iv-name, .inv-t tr.inv-r .iv-need { margin-left: 0; margin-right: 0; }
  .inv-t tr.inv-r .inv-qty { width: 62px; }
  .inv-t td.c-item, .inv-t td.c-note, .inv-t td.c-x { min-width: 0; }
  /* Two class names on purpose: ".inv-t td" above also matches this cell and
     ties on specificity, and a tie is settled by source order, which put the
     count flush against a long category name with no gap. */
  .inv-t tr.inv-cat { display: block; width: 100%; }
  .inv-t tr.inv-cat td { display: flex; width: 100%; }
  .inv-t tr.inv-new { display: block; }
  .inv-t tr.inv-new td { display: block; border: 0; padding: 0 0 6px; }
  .inv-t tr.drop-a { box-shadow: inset 0 3px 0 var(--gold); }
  .inv-t tr.drop-b { box-shadow: inset 0 -3px 0 var(--gold); }
  .inv-t tr.inv-r.drag-src { opacity: .4; }
  /* The bar caption says "0 / 11.2 L (0%)", which the per-week and
     still-to-buy chips on the next line already say. The bar itself stays. */
  .inv-t tr.inv-r .barlbl { display: none; }
  .inv-t tr.inv-r.open .barlbl { display: block; font-size: 11px; }
  .inv-cat td { display: block; }
}

  function sv(x) { return (LANG === "nl" && SRCV[x]) ? SRCV[x] : x; }

  /* The source cards used to be fixed text. A shop changes, a pack size
     changes, something moves shelf, and the card stayed wrong until the file
     was rebuilt. Every field on them is editable now and saves in this
     browser, per language, so a Dutch edit does not overwrite the English one
     and the other language is used only when its own is empty. */
  var LS_SRC = "quatro-src-v1";
  var SRCEDIT = null;
  function srcEdits() { if (!SRCEDIT) SRCEDIT = load(LS_SRC, {}); return SRCEDIT; }
  function srcGet(key, field, fallback) {
    var e = srcEdits()[key];
    if (e) {
      var mine = e[field + "_" + LANG];
      if (mine) return mine;
      var other = e[field + "_" + (LANG === "nl" ? "en" : "nl")];
      if (other) return other;
    }
    return sv(fallback) || "";
  }
  function srcSet(key, field, val) {
    var all = srcEdits();
    if (!all[key]) all[key] = {};
    all[key][field + "_" + LANG] = val;
    save(LS_SRC, all);
  }
  /* Every field is drawn even when it is empty, so a missing pack size or
     shelf can be filled in rather than simply not being there. */
  function row(label, val, key, field) {
    var shown = srcGet(key, field, val);
    return "<dt>" + esc(tt(label)) + "</dt>" +
      '<dd class="src-ed' + (shown ? "" : " empty") + '" contenteditable="true" ' +
      'data-srck="' + esc(key) + '" data-srcf="' + esc(field) + '" data-ph="' +
      et({ en: "not recorded, click to add", nl: "niet vastgelegd, klik om toe te voegen" }) +
      '">' + esc(shown) + "</dd>";
  }
  document.addEventListener("blur", function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.srck) return;
    var val = el.textContent.trim();
    srcSet(el.dataset.srck, el.dataset.srcf, val);
    el.classList.toggle("empty", !val);
  }, true);

  var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
  function openSrc(title, v, key) {
    if (!sheet) return;
    key = key || slug(title);
    var head = v.t === "house"
      ? '<span class="src-tag house">' + esc(tt({ en: "We make this", nl: "Dit maken wij zelf" })) + "</span>"
      : '<span class="src-tag bought">' + esc(tt({ en: "Bought in", nl: "Ingekocht" })) + "</span>";
    var body = '<dl class="src-row">' +
      (v.t === "house"
        ? row({ en: "Made from", nl: "Gemaakt van" }, v.from,  key, "from") +
          row({ en: "Yield",     nl: "Opbrengst" },   v.yield, key, "yield") +
          row({ en: "Keeps",     nl: "Houdbaar" },    v.keeps, key, "keeps")
        : row({ en: "Supplier",  nl: "Leverancier" }, v.shop,  key, "shop") +
          row({ en: "Pack",      nl: "Verpakking" },  v.pack,  key, "pack")) +
      row({ en: "Lives in", nl: "Staat in" }, v.home, key, "home") + "</dl>";
    /* "Click an ingredient and it tells you straight away." The card is what
       opens from every ingredient list, so the dot lives here too. A house
       item carries its own keep window, so the use-by works itself out; a
       bought-in one has none on file and says so. */
    body += dateCell("src-" + key, v.t === "house" ? sv(v.keeps) : "",
      { en: "Day dot on the one in use", nl: "Dagsticker op degene in gebruik" });
    body += '<p class="src-hint">' +
      et({ en: "Supplier, pack and where it lives are editable. Click one and type, it saves in this browser.",
           nl: "Leverancier, verpakking en waar het staat zijn aan te passen. Klik erop en typ, het wordt in deze browser bewaard." }) + "</p>";
    if (v.note) body += '<p class="src-note">' + esc(sv(v.note)) + "</p>";
    if (v.warn) body += '<div class="src-warn"><b>' +
      esc(tt({ en: "Note.", nl: "Let op." })) + "</b> " + esc(sv(v.warn)) + "</div>";
    var sw = document.getElementById("sheet-swatch");
    if (sw) sw.style.background = v.t === "house" ? "#3E5140" : "var(--gold)";
    document.getElementById("sheet-name").textContent = title;
    document.getElementById("sheet-body").innerHTML = head + body;
    sheet.hidden = false;
    requestAnimationFrame(function () {
      sheet.classList.add("open");
      if (scrim) scrim.classList.add("open");
    });
    var c = document.getElementById("sheet-close"); if (c) c.focus();
  }

  document.addEventListener("click", function (e) {
    /* This one listens on the way down, so a stopPropagation from the comment
       layer cannot reach it. It stands aside itself while commenting. */
    if (CMTMODE) return;
    var li = e.target.closest && e.target.closest(".ing li");
    if (!li) return;
    e.stopPropagation();
    var nmEl = li.querySelector(".nm");
    var raw = nmEl ? nmEl.childNodes[0].nodeValue || nmEl.textContent : li.textContent;
    var hit = lookup(raw);
    var title = String(raw).trim();
    if (!hit) {
      openSrc(title, { t: "buy", shop: "", pack: "", home: "",
                       warn: "No source recorded for this ingredient yet. The three fields are empty and editable: fill them in and they save." }, slug(title));
      return;
    }
    openSrc(title, hit.v, hit.key);
  }, true);

  /* keyboard access */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var li = e.target.closest && e.target.closest(".ing li");
    if (li) { e.preventDefault(); li.click(); }
  });
  function tagUp() {
    document.querySelectorAll(".ing li:not([tabindex])").forEach(function (li) {
      li.setAttribute("tabindex", "0");
      li.setAttribute("role", "button");
    });
  }
  new MutationObserver(tagUp).observe(document.body, { childList: true, subtree: true });
  tagUp();


  /* ---- 3. INVENTORY, the two Boiron purees ----------------------------
     These are the single most important missing lines. Paste the two rows
     under section 4 below into your INV_ITEMS array so they join the
     totals and the saved stock counts. Until you do, this banner shows on
     the Inventory tab so it cannot be forgotten. */
  function invBanner() {
    var root = document.getElementById("root");
    if (!root) return;
    var tab = document.querySelector('#subtabs button[data-tab="inventory"]');
    var onInv = !!(tab && tab.getAttribute("aria-selected") === "true");
    var existing = document.getElementById("boiron-banner");
    if (!onInv) { if (existing) existing.remove(); return; }
    /* look for the actual inventory row, not the old TBD note, which also
       contains the words "Boiron lime" */
    /* Scan the tables only. Scanning the whole of #root would match this
       banner's own text and toggle it forever. */
    var tables = root.querySelectorAll("table"), scan = "";
    for (var i = 0; i < tables.length; i++) scan += tables[i].innerText.toLowerCase();
    /* Match both languages: the Dutch table says "Boiron limoenpuree", so an
       English-only test would fire this banner over a row that is right there. */
    if (scan.indexOf("lime puree") !== -1 || scan.indexOf("limoenpuree") !== -1) {
      if (existing) existing.remove();
      return;
    }
    if (existing) return;
    var d = document.createElement("div");
    d.id = "boiron-banner";
    d.className = "src-warn";
    d.style.margin = "0 0 18px";
    d.innerHTML = LANG === "nl"
      ? "<b>Er ontbreken twee regels in deze tabel.</b> Boiron limoenpuree, " +
        "<b>19,6 L per week</b>, Sligro 217504, en Boiron citroenpuree, <b>9,1 L per week</b>, " +
        "Sligro 217502. Elk drankje dat om limoen- of citroensap vraagt, schenkt hieruit en niet " +
        "uit met de hand geperst fruit, dus het overzicht komt ongeveer 29 liter per week tekort " +
        "en geen van beide heeft al een prijs. Voeg ze toe aan INV_ITEMS, dan verdwijnt deze melding."
      : "<b>Two lines are missing from this table.</b> Boiron lime puree, " +
        "<b>19.6 L a week</b>, Sligro 217504, and Boiron lemon puree, <b>9.1 L a week</b>, " +
        "Sligro 217502. Every drink that calls for lime or lemon juice pours these, not hand " +
        "squeezed fruit, so the sheet is short by about 29 litres a week and neither has a " +
        "price yet. Add them to INV_ITEMS, then this notice disappears.";
    root.insertBefore(d, root.firstChild);
  }
  new MutationObserver(invBanner).observe(document.getElementById("root") || document.body,
    { childList: true, subtree: true });
  invBanner();

    });

  /* Which photos are open, so a re-render (tapping a rail slot redraws the
     page) does not snap them shut. */
  var ISLPH = {};
  var ISLIMG = null;
  function islPhoto(n) {
    if (ISLIMG === null) {
      ISLIMG = {};
      try {
        var el = document.getElementById("qbar-photos");
        if (el) ISLIMG = JSON.parse(el.textContent) || {};
      } catch (e) { ISLIMG = {}; }
    }
    return ISLIMG[String(n)] || "";
  }

  function islandsHTML() {
    var stop = function (label, on) {
      return '<span class="isl-stop' + (on ? " on" : "") + '">' + label + "</span>";
    };
    var route = [
      stop(et({ en: "Sink", nl: "Spoelbak" })), stop("1", 1),
      stop(et({ en: "Ticket printer", nl: "Bonprinter" })), stop("2", 1),
      stop(et({ en: "The station", nl: "Het station" })), stop("3", 1),
      stop(et({ en: "Glassware", nl: "Glaswerk" })), "&hellip;",
      stop(et({ en: "Blender", nl: "Blender" })), stop("4", 1),
      stop(et({ en: "Coffee machine", nl: "Koffiemachine" }))
    ].join('<span aria-hidden="true">&rsaquo;</span>');
    function island(isl) {
      var n = isl.n, open = !!ISLPH[n], src = open ? islPhoto(n) : "";
      return '<div class="isl" data-isl="' + n + '"><div class="isl-h">' +
        '<span class="isl-n">&#8470;&thinsp;' + n + "</span>" +
        '<span class="isl-w">' + et(isl.where) + "</span>" +
        '<span class="isl-s">' + et(isl.span) + "</span></div>" +
        '<ul class="qgar">' + isl.items.map(function (it) {
          return "<li>" + et(it[0]) + (it[1] ? '<span class="qstep-why">' + et(it[1]) + "</span>" : "") + "</li>";
        }).join("") + "</ul>" +
        '<details class="isl-ph" data-isl-ph="' + n + '"' + (open ? " open" : "") + "><summary>" +
        et({ en: "Photo of island " + n, nl: "Foto van eiland " + n }) + "</summary>" +
        (open && !src ? '<p class="qdash">' + et({ en: "The photo is not in this copy of the file.", nl: "De foto zit niet in deze versie van het bestand." }) + "</p>"
                      : '<img alt="' + et({ en: "Island " + n + ", as set up", nl: "Eiland " + n + ", zoals opgesteld" }) + '"' +
                        (src ? ' src="' + src + '"' : "") + ">") +
        "</details></div>";
    }
    return '<div class="panel" id="q-islands"><h3>' +
      et({ en: "Bar setup, clockwise", nl: "Bar-opstelling, met de klok mee" }) + "</h3>" +
      '<p class="legend" style="margin:0 0 6px">' +
      et({ en: "Four islands around the station, from the sink round to the coffee machine. The station itself is the next panel.",
           nl: "Vier eilanden rond het station, van de spoelbak tot de koffiemachine. Het station zelf staat in het volgende paneel." }) + "</p>" +
      '<div class="isl-route">' + route + "</div>" +
      island(ISLANDS[0]) + island(ISLANDS[1]) +
      '<div class="isl-mid"><b>' + et({ en: "Then the station.", nl: "Dan het station." }) + "</b> " +
      et({ en: "The speed rail, the squeeze bottles, the holders, the ice and the tools, left station to right station. Walked through in the next panel.",
           nl: "De speedrail, de knijpflessen, de houders, het ijs en het gereedschap, van linkerstation tot rechterstation. Uitgelegd in het volgende paneel." }) + "</div>" +
      island(ISLANDS[2]) + island(ISLANDS[3]) +

  }

  /* toggle does not bubble, so listen in the capture phase. The photo is only
     decoded when someone opens it. */
  document.addEventListener("toggle", function (e) {
    var d = e.target;
    if (!d || !d.matches || !d.matches("details.isl-ph")) return;
    var n = d.getAttribute("data-isl-ph");
    ISLPH[n] = d.open;
    if (!d.open) return;
    var img = d.querySelector("img");
    if (img && !img.getAttribute("src")) {
      var src = islPhoto(n);
      if (src) img.src = src;
      else img.outerHTML = '<p class="qdash">' + et({ en: "The photo is not in this copy of the file.", nl: "De foto zit niet in deze versie van het bestand." }) + "</p>";
    }
  }, true);

  /* How long a keeps line actually is, read off the English text so the maths
     does not change with the language on screen. */
  function keepsDays(keeps) {
    var s = String((keeps && keeps.en) || keeps || "").toLowerCase();
    var m = s.match(/\d+/);
    if (!m) return null;
    var n = parseInt(m[0], 10);
    if (isNaN(n)) return null;
    if (/hour|hr\b|uur/.test(s))  return n / 24;
    if (/month|maand/.test(s))     return n * 30;
    if (/week|weken/.test(s))      return n * 7;
    return n;
  }

  /* When each batch was made, kept in this browser, keyed by the row's own id
     so adding or dropping a prep line never shifts anyone else's date. */
  var LS_MADE = "quatro-prep-made-v1";
  var MADE = load(LS_MADE, {});

  function useBy(madeStr, keeps) {
    var d = String(madeStr || "").replace(/\D/g, "");
    if (d.length !== 6 && d.length !== 8) return null;
    var day = +d.slice(0, 2), mon = +d.slice(2, 4);
    var yr = d.length === 6 ? 2000 + +d.slice(4, 6) : +d.slice(4, 8);
    var made = new Date(yr, mon - 1, day);
    if (made.getDate() !== day || made.getMonth() !== mon - 1) return false;
    var days = keepsDays(keeps);
    if (days == null) return { made: made, exp: null };
    var exp = new Date(made.getTime() + days * 86400000);
    return { made: made, exp: exp };
  }
  /* The use-by is shown in the same weekday-then-date shape that goes on the
     tape, so the screen and the label read identically. */
  function dotOf(d) {
    var p2 = function (n) { return ("0" + n).slice(-2); };
    return (isNl() ? DD_NL : DD_EN)[(d.getDay() + 6) % 7] + " " +
      p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + String(d.getFullYear()).slice(-2);
  }
  /* The readout for one dated container. Shared by the Prep table, the Rail
     slots, the Inventory rows and the ingredient cards, so every place that
     shows a day dot shows the same thing and reads from the same store.
     The keep window travels on the element rather than being looked up in
     PREP2, because three of the four callers are not prep rows. */
  function mkText(v, keeps, verb) {
    var r = useBy(v, keeps), txt = "", cls = "mk-out";
    if (r === false) { txt = tt({ en: "not a date", nl: "geen datum" }); cls += " bad"; }
    else if (r && r.exp) {
      var left = (r.exp - new Date()) / 86400000;
      cls += left < 0 ? " due" : left < 1 ? " warn" : " ok";
      txt = (left < 0 ? tt({ en: "PAST DATE, bin it. Was due ", nl: "OVER DATUM, weggooien. Was THT " })
                      : tt({ en: "Use by ", nl: "THT " })) + dotOf(r.exp);
    } else if (r) {
      /* No keep window on file, and for a rail bottle or a bought-in line
         there never will be. Saying so on every one of them told you nothing
         you could act on. Say how long it has been open instead, which is the
         question you are actually asking when you pick the bottle up. */
      var days = Math.floor((new Date() - r.made) / 86400000);
      txt = tt(verb === "made" ? { en: "Made ", nl: "Gemaakt " } : { en: "Opened ", nl: "Geopend " }) +
        dotOf(r.made) +
        (days <= 0 ? tt({ en: ", today", nl: ", vandaag" })
         : days === 1 ? tt({ en: ", yesterday", nl: ", gisteren" })
         : tt({ en: ", ", nl: ", " }) + days + tt({ en: " days ago", nl: " dagen geleden" }));
      cls += days >= 7 ? " warn" : " ok";
    }
    else { txt = tt({ en: "no date on this yet", nl: "hier staat nog geen datum op" }); cls += " none"; }
    return { txt: txt, cls: cls };
  }

  function todayDot() {
    var d = new Date(), p2 = function (n) { return ("0" + n).slice(-2); };
    return p2(d.getDate()) + p2(d.getMonth() + 1) + String(d.getFullYear()).slice(-2);
  }

  function dateCell(id, keeps, label, verb) {
    var v = MADE[id] || "", r = mkText(v, keeps, verb);
    return '<div class="mk">' +
      (label ? '<span class="mk-lbl">' + et(label) + "</span>" : "") +
      '<input class="mk-in" type="text" inputmode="numeric" maxlength="10" autocomplete="off" ' +
      'data-made="' + esc(id) + '" data-keeps="' + esc(tt(keeps) || "") + '" value="' + esc(v) + '" ' +
      'data-verb="' + esc(verb || "opened") + '" ' +
      'placeholder="DDMMYY" aria-label="' + et({ en: "Date opened or made", nl: "Datum geopend of gemaakt" }) + '">' +
      '<button class="mk-now" type="button" data-today="' + esc(id) + '">' +
      et({ en: "Today", nl: "Vandaag" }) + "</button>" +
      '<span class="' + r.cls + '">' + esc(r.txt) + "</span></div>";
  }

  function madeCell(id, keeps) { return dateCell(id, keeps, null, "made"); }

  function paintMk(i) {
    var wrap = i.parentNode, out = wrap && wrap.querySelector(".mk-out");
    if (!out) return;
    var r = mkText(i.value, i.dataset.keeps, i.dataset.verb);
    out.className = r.cls; out.textContent = r.txt;
  }

  document.addEventListener("input", function (e) {
    var i = e.target.closest && e.target.closest("[data-made]");
    if (!i) return;

    paintMk(i);

  /* The entry a row actually buys: the one at the row's own supplier if that
     shop stocks it, otherwise whoever does. */
  function rowEntry(r) {
    var key = ROW_PRICE[r.key];
    if (!key) return null;
    var alts = alternatives(key, r.unit);
    if (!alts.length) return null;
    var mine = alts.filter(function (a) { return a.e.sup === r.supplier; })[0];
    return (mine || alts[0]).e;
  }
  /* The price book is the source of truth wherever it has a line, so every
     number on the Inventory tab can be traced back to a pack and a shop.
     On the seed it also sets the supplier. On saved rows it does not: someone
     may have changed where a line is bought, and that choice decides the
     price, not the other way round. */
  function applyPrices() {
    SEED.forEach(function (row) {
      var e = rowEntry(row);
      if (e) { row.supplier = e.sup; row.cost = costIn(e, row.unit); }
    });
    ROWS.forEach(function (row) {
      var e = rowEntry(row);
      if (e) row.cost = costIn(e, row.unit);
    });
  }

  function rowCheaper(r) {
    var key = ROW_PRICE[r.key];
    if (!key) return null;
    var alts = alternatives(key, r.unit);
    if (alts.length < 2) return null;
    var used = rowEntry(r), best = alts[0].e;
    if (!used || best.id === used.id) return null;
    var uc = costIn(used, r.unit), bc = alts[0].c;
    if (bc >= uc) return null;
    /* Judge the swap on what it saves in a week, not on the per-unit gap. A
       tenth of a cent a gram is noise on 60 g of thyme and real money on 450 g
       of mint. */
    var week = (uc - bc) * (r.need == null ? 0 : Number(r.need));
    return week >= 0.25 ? { e: best, c: bc, week: week } : null;
  }

  function unitBase(u) {
    if (u === "L") return { b: "ml", f: 1000 };

  /* ==================================================================
     9. COMMENTS
     Turn comment mode on and anything on the page can be clicked and
     annotated. A note is anchored to what the block says, not to where it
     sits, so it stays put when the page redraws or the language changes.
     Notes save in this browser and come back out as one block of plain
     text, ready to paste into a message.
     ================================================================== */
  var LS_CMT = "quatro-comments-v1";
  var CMT = load(LS_CMT, []);
  var CMTMODE = false;
  var CMTOPEN = null;

  function cmtHash(s) {
    var h = 5381, i;
    s = String(s || "").replace(/\s+/g, " ").trim().slice(0, 200);
    for (i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "a" + (h >>> 0).toString(36);
  }
  var CMT_SEL = "tr, .ops-c, .build, .bk-page, .panel, .warn, .flag, .qflag, " +
                ".section-head, .rcpt, .inv-sum, .src-warn, .card, li";
  function cmtRoot() { return document.getElementById("root"); }
  function cmtBlock(el) {
    var root = cmtRoot();
    if (!root || !el.closest) return null;
    var hit = el.closest(CMT_SEL);
    if (hit && root.contains(hit) && cmtLabel(hit)) return hit;
    var sec = el.closest(".section");
    return (sec && root.contains(sec)) ? sec : null;
  }
  function cmtWhere() {
    if (typeof MODE !== "undefined" && MODE === "menu") return tt({ en: "Menu", nl: "Menu" });
    return (typeof TAB !== "undefined" && typeof ui === "function") ? ui(TAB) : "Quatro";
  }
  function cmtLabel(el) {
    var s = (el.innerText || el.textContent || "").replace(/\s+/g, " ").trim();
    return s.length > 95 ? s.slice(0, 92) + "..." : s;
  }
  function cmtFor(id) { return CMT.filter(function (c) { return c.id === id; }); }
  function cmtSave() { save(LS_CMT, CMT); }
  function cmtStamp() {
    var d = new Date(), p2 = function (n) { return ("0" + n).slice(-2); };
    return p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + String(d.getFullYear()).slice(-2);
  }

  /* ---- the composer ---- */
  function cmtCompose(el) {
    var label = cmtLabel(el);
    CMTOPEN = { el: el, id: cmtHash(label), label: label, where: cmtWhere() };
    var box = document.getElementById("cmt-compose");
    if (!box) {
      box = document.createElement("div");
      box.id = "cmt-compose";
      document.body.appendChild(box);
    }
    var mine = cmtFor(CMTOPEN.id);
    box.innerHTML =
      '<div class="cc-on">' + et({ en: "Comment on", nl: "Opmerking bij" }) + "</div>" +
      '<div class="cc-q">' + esc(label) + "</div>" +
      (mine.length ? '<div class="cc-prev">' + mine.map(function (c) {
        return '<div class="cc-p"><span>' + esc(c.text) + "</span>" +
          '<button type="button" class="cc-x" data-cmtdel="' + esc(c.k) + '" title="' +
          et({ en: "Delete", nl: "Verwijderen" }) + '">&times;</button></div>';
      }).join("") + "</div>" : "") +
      '<textarea id="cc-t" rows="3" placeholder="' +
      et({ en: "What should change here?", nl: "Wat moet hier anders?" }) + '"></textarea>' +
      '<div class="cc-b"><button type="button" id="cc-save">' +
      et({ en: "Save comment", nl: "Opmerking opslaan" }) + "</button>" +
      '<button type="button" id="cc-cancel">' + et({ en: "Cancel", nl: "Annuleren" }) + "</button></div>";
    box.classList.add("open");
    var ta = document.getElementById("cc-t");
    if (ta) ta.focus();
  }
  function cmtCloseCompose() {
    var box = document.getElementById("cmt-compose");
    if (box) box.classList.remove("open");
    CMTOPEN = null;
  }

  /* ---- the list ---- */
  function cmtGroup() {
    var by = {}, order = [];
    CMT.forEach(function (c) {
      if (!by[c.where]) { by[c.where] = []; order.push(c.where); }
      by[c.where].push(c);
    });
    return { by: by, order: order };
  }
  function cmtPanelHTML() {
    if (!CMT.length) {
      return '<p class="cp-empty">' +
        et({ en: "No comments yet. Turn comment mode on, then click any row, card or block on the page.",
             nl: "Nog geen opmerkingen. Zet de opmerkingenmodus aan en klik dan op een regel, kaart of blok." }) + "</p>";
    }
    var g = cmtGroup();
    return g.order.map(function (w) {
      return '<div class="cp-g"><h4>' + esc(w) + "</h4>" + g.by[w].map(function (c) {
        return '<div class="cp-i"><div class="cp-q">' + esc(c.label) + "</div>" +
          '<div class="cp-t">' + esc(c.text) + "</div>" +
          '<div class="cp-m">' + esc(c.when) +
          '<button type="button" class="cc-x" data-cmtdel="' + esc(c.k) + '" title="' +
          et({ en: "Delete", nl: "Verwijderen" }) + '">&times;</button></div></div>';
      }).join("") + "</div>";
    }).join("");
  }
  function cmtAsText() {
    var out = "QUATRO " + tt({ en: "comments", nl: "opmerkingen" }) + ", " + cmtStamp() +
      " (" + CMT.length + ")\n";
    var g = cmtGroup();
    g.order.forEach(function (w) {
      out += "\n## " + w + "\n";
      g.by[w].forEach(function (c) {
        out += '\n- on "' + c.label + '"\n  -> ' + c.text + "\n";
      });
    });
    return out;
  }
  function cmtRenderPanel() {
    var p = document.getElementById("cmt-panel");
    if (p) {
      var b = p.querySelector(".cp-body");
      if (b) b.innerHTML = cmtPanelHTML();
    }
    var n = document.getElementById("cmt-n");
    if (n) { n.textContent = CMT.length; n.style.display = CMT.length ? "" : "none"; }
    cmtMark();
  }

  /* A mark on every block that carries a note, so it can be found again. */
  function cmtMark() {
    var root = cmtRoot();
    if (!root) return;
    Array.prototype.slice.call(root.querySelectorAll(".has-cmt")).forEach(function (e) {
      e.classList.remove("has-cmt"); e.removeAttribute("data-cmt-n");
    });
    if (!CMT.length) return;
    var want = {};
    CMT.forEach(function (c) { want[c.id] = (want[c.id] || 0) + 1; });
    Array.prototype.slice.call(root.querySelectorAll(CMT_SEL + ", .section")).forEach(function (el) {
      var h = cmtHash(cmtLabel(el));
      if (want[h] && !el.querySelector(".has-cmt")) {
        el.classList.add("has-cmt");
        el.setAttribute("data-cmt-n", want[h]);
      }
    });
  }

  function cmtLabels() {
    var f = document.querySelector("#cmt-fab .cf-l");
    if (f) f.textContent = tt(CMTMODE ? { en: "Commenting", nl: "Opmerkingen aan" }
                                      : { en: "Comment", nl: "Opmerking" });

  /* The top bar is sticky and its height changes with the tab row and with
     wrapping, so the panel is told where to start rather than guessing. */
  function cmtFit() {
    var panel = document.getElementById("cmt-panel");
    var head = document.querySelector(".topbar");
    if (!panel || !head) return;
    var h = Math.round(head.getBoundingClientRect().bottom);
    panel.style.top = Math.max(0, h) + "px";
  }
  window.addEventListener("resize", cmtFit, false);
  window.addEventListener("scroll", cmtFit, true);

  function cmtUI() {
    if (!document.getElementById("cmt-fab")) {
      var fab = document.createElement("button");
      fab.id = "cmt-fab"; fab.type = "button";
      fab.setAttribute("aria-pressed", "false");
      fab.innerHTML = '<span class="cf-i">&#9998;</span><span class="cf-l"></span>' +
        '<span id="cmt-n" class="cf-n"></span>';
      document.body.appendChild(fab);
    }
    if (!document.getElementById("cmt-panel")) {
      var panel = document.createElement("div");
      panel.id = "cmt-panel";
      panel.innerHTML = '<div class="cp-h"><b class="cp-title"></b>' +
        '<button type="button" id="cmt-close" aria-label="Close">&times;</button></div>' +
        '<div class="cp-body"></div>' +
        '<div class="cp-f"><button type="button" id="cmt-copy"></button>' +
        '<button type="button" id="cmt-dl"></button>' +
        '<button type="button" id="cmt-clear"></button></div>';
      document.body.appendChild(panel);
      /* Inside the artifact viewer a page cannot hand the viewer a file, so the
         download button would be a button that does nothing. Copy all works
         everywhere, and download comes back in the downloaded file. */
      var framed = true;
      try { framed = (window.self !== window.top); } catch (e) { framed = true; }
      if (framed) {
        var dl = document.getElementById("cmt-dl");
        if (dl) dl.style.display = "none";
      }
    }
  }

  function cmtCopy(btn) {
    var txt = cmtAsText();
    var done = function () {
      btn.textContent = tt({ en: "Copied", nl: "Gekopieerd" });
      setTimeout(cmtLabels, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (err) {}
      document.body.removeChild(ta); done();
    }
  }

  /* ---- wiring: the comment layer's own controls ---- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.closest) return;

    if (t.closest("#cmt-fab")) {
      CMTMODE = !CMTMODE;
      document.body.classList.toggle("cmt-on", CMTMODE);
      var fab = document.getElementById("cmt-fab");
      if (fab) fab.setAttribute("aria-pressed", String(CMTMODE));
      var p = document.getElementById("cmt-panel");
      if (p) p.classList.toggle("open", CMTMODE);
      if (!CMTMODE) cmtCloseCompose();
      cmtLabels(); cmtRenderPanel(); cmtFit();
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (t.closest("#cmt-close")) {
      var p2 = document.getElementById("cmt-panel");
      if (p2) p2.classList.remove("open");
      e.preventDefault(); e.stopPropagation();
      return;
    }
    var del = t.closest("[data-cmtdel]");
    if (del) {
      CMT = CMT.filter(function (c) { return c.k !== del.dataset.cmtdel; });
      cmtSave(); cmtRenderPanel();
      if (CMTOPEN && CMTOPEN.el) cmtCompose(CMTOPEN.el);
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (t.closest("#cc-cancel")) {
      cmtCloseCompose(); e.preventDefault(); e.stopPropagation(); return;
    }
    if (t.closest("#cc-save")) {
      var ta = document.getElementById("cc-t");
      var txt = ta ? ta.value.trim() : "";
      if (txt && CMTOPEN) {
        CMT.push({ k: "c" + Date.now() + Math.random().toString(36).slice(2, 6),
                   id: CMTOPEN.id, label: CMTOPEN.label, where: CMTOPEN.where,
                   text: txt, when: cmtStamp() });
        cmtSave();
      }
      cmtCloseCompose(); cmtRenderPanel();
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (t.closest("#cmt-copy")) {
      cmtCopy(t.closest("#cmt-copy")); e.preventDefault(); e.stopPropagation(); return;
    }
    if (t.closest("#cmt-dl")) {
      var blob = new Blob([cmtAsText()], { type: "text/plain;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "quatro-comments-" + cmtStamp().replace(/\./g, "") + ".txt";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (t.closest("#cmt-clear")) {
      if (CMT.length && window.confirm(tt({
            en: "Delete all " + CMT.length + " comments? This cannot be undone.",
            nl: "Alle " + CMT.length + " opmerkingen verwijderen? Dit kan niet terug." }))) {
        CMT = []; cmtSave(); cmtCloseCompose(); cmtRenderPanel();
      }
      e.preventDefault(); e.stopPropagation();
      return;
    }
  }, false);

  /* In comment mode a click in the content picks a block to annotate instead of
     doing what it normally would. The top bar and the tabs stay live, so the
     whole file can still be walked through while commenting. */
  document.addEventListener("click", function (e) {
    if (!CMTMODE) return;
    var t = e.target;
    if (!t.closest) return;
    if (t.closest("#cmt-fab") || t.closest("#cmt-panel") ||
        t.closest("#cmt-compose") || t.closest(".topbar") || t.closest(".sheet")) return;
    var root = cmtRoot();
    if (!root || !root.contains(t)) return;
    var block = cmtBlock(t);
    if (!block) return;
    e.preventDefault(); e.stopPropagation();
    cmtCompose(block);
  }, true);

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (CMTOPEN) { cmtCloseCompose(); return; }
    if (CMTMODE) {
      var fab = document.getElementById("cmt-fab");
      if (fab) fab.click();
    }
  }, false);

  /* Keep the marks, the count and the panel right across every re-render and
     every language switch, without touching the app's own render code. */
  (function () {
    var r = window.render;
    if (typeof r !== "function") return;
    window.render = function () {
      var out = r.apply(this, arguments);
      try {
        /* renderChrome assigns body.className outright, so the mode class has
           to be put back after every draw or comment mode dies on a tab or
           language change. */
        document.body.classList.toggle("cmt-on", CMTMODE);
        labelWide();
        ivPinLayout();
        coffeeMount();
        cmtUI(); cmtLabels(); cmtRenderPanel(); cmtFit();
      } catch (err) {
        /* This catch is here so a fault in the patch cannot take the whole
           app down mid-service. It used to swallow the error silently, which
           turned a one-line mistake into a hunt. */
        if (window.console && console.error) console.error("Quatro render hook:", err);
      }
      return out;
    };
  })();

  /* ---------------- 11. the coffee ratio chart ----------------
     House ratios as given on 24 November. Drawn bottom to top the way the
     cup fills: espresso at the bottom, milk or water above it, foam last. */
  var CBITS = {
    esp:  { col: "#3B2416", en: "Espresso",     nl: "Espresso" },
    milk: { col: "#F0E2CB", en: "Steamed milk", nl: "Gestoomde melk" },

  var COFFEE = [

    ["Americano",  [["esp", 20], ["water", 80]]],

  /* Its own counter: the glance block keeps UID inside a nested closure of

  var CUID = 0;

  function cupSVG(parts) {

       instead of sitting in a rectangle behind it. */
    var id = "cup" + (++CUID);

      '<path d="M51,16 Q61,17 60,25 Q59,33 47,34" fill="none" stroke="rgba(35,32,28,0.44)" stroke-width="1.7"/>' +

  /* ---------------- 10. at a glance: glass, kit, build to scale ----------------
     Tap a drink on the menu and see the build drawn from the build list
     itself, so the picture cannot drift away from the numbers on the
     Builds tab. Order runs bottom to top: first in the build, first in
     the glass. */
(function () {
  "use strict";

  /* Ingredient colours, only for drawing. Nothing reads these as data. */
  var GCOL = {
    lychee: "#E8C2CF", lycheecordial: "#E3B9C8", lycheelime: "#D9B6B0",
    coconutw: "#F6F1E4", bptcoconut: "#4C4C9D", peatea: "#4C4C9D",
    lime: "#8FBF5A", lemon: "#E4D35C", orange: "#E8791D", cranberry: "#9E1F3A",
    hibiscus: "#9E2B3B", strawpuree: "#D4566A", passionjuice: "#E8A020",
    passionpuree: "#E09018", applepear: "#D7DE92", cloudyapple: "#DCDFA8",
    pineapple: "#E8C84A", coconutcream: "#FBF7EC", cocolopez: "#F8F0DC",
    cassis: "#4A1E3C", mintsyrup: "#8CC06E", simple: "#F2EDE2",
    vanilla: "#E4D9BF", grenadine: "#B3123A", gingerbeer: "#D9A441",
    soda: "#EAF4F8", sparklemon: "#EEF3DC", cordial: "#8A6134",
    matcha: "#7A9A5B", milk: "#FFFFFF", ice: "#E8F4F8"
  };

  /* What each drink takes off the back bar. Written out per drink rather
     than guessed from the method line, because the method line does not
     know about the torch, the brute or the zester. */
  var KIT = {
    "lychee-siren": { en: ["Boston tins", "Muddler", "Hawthorne strainer", "Jigger", "Crushed ice scoop", "Brute for the tray"],
                      nl: ["Boston tins", "Muddler", "Hawthorne-zeef", "Jigger", "Schep voor crushed ice", "Brute voor het blad"] },
    "forest-fairy": { en: ["Mixing glass", "Bar spoon", "Julep strainer", "Jigger", "Zester", "Blowtorch", "Crushed ice scoop", "Rim bowl and plate"],
                      nl: ["Mengglas", "Barlepel", "Julepzeef", "Jigger", "Rasp", "Brander", "Schep voor crushed ice", "Randkom en bord"] },
    "the-hulk": { en: ["Boston tins", "Muddler", "Hawthorne strainer", "Fine strainer", "Jigger"],
                  nl: ["Boston tins", "Muddler", "Hawthorne-zeef", "Fijne zeef", "Jigger"] },
    "hibiscus-royale": { en: ["Boston tins", "Muddler", "Hawthorne strainer", "Jigger"],

                      nl: ["Boston tins", "Muddler", "Fijne zeef", "Jigger", "Barlepel om te churnen", "Schep voor crushed ice"] },
    "cosmopolitan": { en: ["Boston tins", "Hawthorne strainer", "Fine strainer", "Jigger", "Zester"],
                      nl: ["Boston tins", "Hawthorne-zeef", "Fijne zeef", "Jigger", "Zesteur"] },
    "amsterdam-sunrise": { en: ["Jigger", "Crushed ice scoop", "Brute for the tray", "Zester"],
                           nl: ["Jigger", "Schep voor crushed ice", "Brute voor het blad", "Zesteur"] },
    "tropical-velvet": { en: ["Boston tins", "Hawthorne strainer", "Fine strainer", "Jigger"],
                         nl: ["Boston tins", "Hawthorne-zeef", "Fijne zeef", "Jigger"] },
    "pina-colada": { en: ["Blender", "75 ml jigger", "Tablespoon, in the pineapple box", "Garnish stick", "Blue ice scoop"],
                     nl: ["Blender", "75 ml-jigger", "Eetlepel, in de ananasbak", "Garneerprikker", "Blauwe ijsschep"] }
  };

  /* Fall-back for the matcha and soft drinks, which are built in the glass.
     Read off the method line so a new drink gets something sensible without
     anyone having to remember this list exists. */
  function kitFor(d) {
    var named = KIT[d.id];
    if (named) return named[LANG] || named.en;
    var m = (tt(d.method) || "").toLowerCase() + " " + (tt(d.ice) || "").toLowerCase();
    var out = [];
    function add(en, nl) { out.push(LANG === "nl" ? nl : en); }
    if (m.indexOf("whisk") > -1) add("Matcha bowl and whisk", "Matchakom en garde");
    if (m.indexOf("shake") > -1) add("Boston tins", "Boston tins");
    if (m.indexOf("blend") > -1) add("Blender", "Blender");
    if (m.indexOf("stir") > -1 || m.indexOf("build") > -1) add("Bar spoon", "Barlepel");
    if (m.indexOf("strain") > -1) add("Hawthorne strainer", "Hawthorne-zeef");
    if (m.indexOf("crushed") > -1) add("Crushed ice scoop", "Schep voor crushed ice");

  }

  /* Outlines, in a 60 x 164 box. Drawn rather than approximated with border
     radius, because a hurricane and a coupe have to be tellable apart at a
     glance and rounded corners cannot do it. fill is the band of the box the
     liquid may occupy. */
  var SHAPE = {
    tall: {
      body: "M9,5 L9,148 Q9,158 19,158 L41,158 Q51,158 51,148 L51,5 Z",
      fill: [6, 157], stem: ""
    },
    hurricane: {
      body: "M8,5 C8,27 14,43 14,61 C14,79 8,95 10,114 C12,134 20,146 30,146 " +
            "C40,146 48,134 50,114 C52,95 46,79 46,61 C46,43 52,27 52,5 Z",
      fill: [6, 145],
      stem: "M24,148 L36,148 L36,152 Q46,154 46,158 L14,158 Q14,154 24,152 Z"
    },
    /* The coppa is the stemmed goblet the Hibiscus Royale goes in over
       cubed ice: a deep round bowl on a short stem. It had been drawn as the
       martini coupe, which is a wide shallow bowl on a long stem, and the two
       read as the same glass. */
    coppa: {
      body: "M11,8 C6,30 3,48 5,66 C8,92 20,106 30,106 C40,106 52,92 55,66 C57,48 54,30 49,8 Z",
      fill: [9, 105],
      stem: "M27,106 L33,106 L33,142 Q33,149 43,152 Q49,154 49,158 L11,158 " +
            "Q11,154 17,152 Q27,149 27,142 Z"
    },
    coupe: {
      body: "M5,8 C5,8 7,62 30,62 C53,62 55,8 55,8 Z",
      fill: [9, 61],
      stem: "M28,62 L32,62 L32,146 Q32,150 42,152 Q48,154 48,158 L12,158 " +
            "Q12,154 18,152 Q28,150 28,146 Z"
    }
  };

  function glassShape(d) {
    var g = (tt(d.glass) || "").toLowerCase();
    if (g.indexOf("coppa") > -1) return "coppa";
    if (g.indexOf("coupe") > -1 || g.indexOf("martini") > -1) return "coupe";
    if (g.indexOf("hurricane") > -1) return "hurricane";
    return "tall";
  }

  /* Bands are given a floor of a few units each so a 10 ml dash still shows,
     then the rest of the height is shared out by volume. Top of the list is
     the top of the glass. */
  var UID = 0;
  function glassSVG(shape, pours) {
    var sp = SHAPE[shape] || SHAPE.tall;
    var top = sp.fill[0], bot = sp.fill[1], H = bot - top;
    var n = pours.length, floor = Math.min(5, H / (n * 2.2));
    var total = 0, share = 0, i;
    for (i = 0; i < n; i++) {
      if (pours[i].kind === "fill") share += pours[i].fill; else total += pours[i].ml;
    }
    if (share > 0.9) share = 0.9;            /* always leave room for the rest */
    var id = "agc" + (++UID);

    /* An unmeasured long pour takes the share of the glass it is said to
       fill; what is left over is shared out by millilitres. */
    var free = H * (1 - share), fillH = H * share;
    var rects = "", y = top;
    for (i = n - 1; i >= 0; i--) {           /* build list is bottom first */
      var h = pours[i].kind === "fill"
        ? (fillH * (pours[i].fill / (share || 1)))
        : floor + (free - n * floor) * (total ? pours[i].ml / total : 1 / n);
      rects += '<rect x="0" y="' + y.toFixed(2) + '" width="60" height="' +
               (h + 0.4).toFixed(2) + '" fill="' +
               (pours[i].col || GCOL[pours[i].ref] || "#CFC6B4") + '"/>';
      y += h;
    }

    return '<svg class="ag-glass" data-shape="' + shape + '" viewBox="0 0 60 164" width="60" height="164" ' +
           'role="img" aria-hidden="true" focusable="false">' +
           '<defs><clipPath id="' + id + '"><path d="' + sp.body + '"/></clipPath></defs>' +
           (sp.stem ? '<path d="' + sp.stem + '" class="ag-stem"/>' : "") +
           '<path d="' + sp.body + '" class="ag-well"/>' +
           '<g clip-path="url(#' + id + ')">' + rects + "</g>" +
           '<path d="' + sp.body + '" class="ag-edge"/>' +
           "</svg>";
  }

  function vizHTML(d) {
    /* The build list is read as the order things reach the GLASS. Two kinds
       of entry are not a plain pour:

       fill   a long pour nobody has measured, like the Spa Rood that fills
              half a Forest Fairy. It takes its share of the glass by the
              fraction given, and says so instead of inventing millilitres.
       pre    something combined before it reaches the glass. The mixing
              glass and the tin arrive as one liquid, so they are drawn as
              one band, not as separate layers that never existed. */
    var pours = [], extras = [], goesIn = [], i, b, ing, last = null;
    for (i = 0; i < (d.build || []).length; i++) {
      b = d.build[i];
      ing = ING[b.ref];
      if (!ing) continue;
      if (b.fill) {
        pours.push({ kind: "fill", ref: b.ref, fill: b.fill, name: tt(ing.name),
                     note: b.note ? tt(b.note) : "" });
        last = null;
      } else if (b.pre) {
        var lbl = tt(b.pre);
        if (last && last.kind === "mix" && last.name === lbl) {
          last.ml += b.ml;
          last.parts.push({ ref: b.ref, name: tt(ing.name), ml: b.ml, note: b.note ? tt(b.note) : "" });
          /* The band takes the colour of whatever is most of it, not of
             whichever ingredient happens to be written first. */
          if (b.ml > last.big) { last.big = b.ml; last.ref = b.ref; }
          if (b.col) last.col = b.col;
        } else {
          last = { kind: "mix", ref: b.ref, col: b.col || null, ml: b.ml, name: lbl, note: "", big: b.ml,
                   parts: [{ ref: b.ref, name: tt(ing.name), ml: b.ml, note: b.note ? tt(b.note) : "" }] };
          pours.push(last);
        }
      } else if (b.ml > 0) {
        pours.push({ kind: "ml", ref: b.ref, ml: b.ml, name: tt(ing.name),
                     note: b.note ? tt(b.note) : "" });
        last = null;
      } else {
        /* Something with no millilitres is not automatically a garnish. The
           muddled grapes in a Hulk end up in the liquid; the basil leaf on
           top does not. Listing both under one heading read as if the fruit
           were decoration. */
        (b.in ? goesIn : extras).push({ name: tt(ing.name), note: b.note ? tt(b.note) : "" });
        last = null;
      }
    }

    /* Anything that arrives from a mixing vessel is ONE band, always, even
       when it is the whole drink. That is what tells a Cosmopolitan apart
       from an Ocean Mojito at a glance: one is a single liquid, the other
       is genuinely stacked. The ingredients are not lost, they are drawn in
       their own colours in the strip under the band. */
    var allMixed = pours.length === 1 && pours[0].kind === "mix";
    var mixName = allMixed ? pours[0].name : "";

    var shape = glassShape(d);
    var h = '<div class="ag">';

    /* ---- glass + kit ---- */
    h += '<div class="ag-facts">' +
         '<div><span class="ag-k">' + et({ en: "Glass", nl: "Glas" }) + '</span>' +
         '<span class="ag-v">' + esc(tt(d.glass) || "—") + "</span></div>" +
         '<div><span class="ag-k">' + et({ en: "Ice", nl: "IJs" }) + '</span>' +
         '<span class="ag-v">' + esc(tt(d.ice) || "—") + "</span></div>" +
         '<div><span class="ag-k">' + et({ en: "Method", nl: "Methode" }) + '</span>' +
         '<span class="ag-v">' + esc(tt(d.method) || "—") + "</span></div>" +
         "</div>";

    /* ---- the stack ---- */
    if (pours.length) {
      var total = 0, anyFill = false;
      for (i = 0; i < pours.length; i++) {
        if (pours[i].kind === "fill") anyFill = true; else total += pours[i].ml;
      }

      /* Drawn top first, so the list reads the same way down the page as the
         liquid sits in the glass. The build list is bottom first. */
      var legend = "";
      for (i = pours.length - 1; i >= 0; i--) {
        var p = pours[i];
        /* Volume is not the same as colour: 40 ml of green mint syrup and
           20 ml of cassis shake out purple, not green. Where that matters the
           build says so. */
        var col = p.col || GCOL[p.ref] || "#CFC6B4";
        var amount = p.kind === "fill"
          ? '<span class="ag-ml">' + Math.round(p.fill * 100) + "%</span>"
          : '<span class="ag-ml">' + p.ml + " ml</span>";
        var sub = p.note ? '<span class="ag-no">' + esc(p.note) + "</span>" : "";
        if (p.kind === "mix") {
          /* A proportion strip of the parts, each in its own colour, so an
             ingredient is still visible inside the mixture it went into. */
          var tot = 0, q;
          for (q = 0; q < p.parts.length; q++) tot += p.parts[q].ml;
          if (tot > 0) {
            sub = '<span class="ag-strip">' + p.parts.map(function (x) {
              return x.ml > 0
                ? '<i style="flex:' + x.ml + ' 1 0;background:' +
                  (GCOL[x.ref] || "#CFC6B4") + '" title="' + esc(x.name) + '"></i>'
                : "";
            }).join("") + "</span>";
          } else { sub = ""; }
          sub += '<span class="ag-no">' + p.parts.map(function (x) {
            /* Something muddled or bashed in has no millilitres; saying
               "0 ml" would read as none of it going in. */
            return esc(x.name) + (x.ml > 0 ? " " + x.ml + " ml" : "") +
                   (x.note ? " (" + esc(x.note) + ")" : "");
          }).join(" · ") + "</span>";
        }
        legend += '<li><i style="background:' + col + '"></i>' +
                  '<span class="ag-nm">' + esc(p.name) +
                  (p.kind === "mix" ? ' <span class="ag-tag">' +
                     et({ en: "one mixture", nl: "een mengsel" }) + "</span>" : "") +
                  "</span>" + amount + sub + "</li>";
      }

      h += '<div class="ag-viz' + (allMixed ? " mixed" : "") + '">' + glassSVG(shape, pours) +
           '<ol class="ag-leg">' + legend + "</ol>" +
           "</div>" +
           '<p class="ag-tot">' + (allMixed
             ? esc(mixName) + ". " + et({ en: "One liquid in the glass, no layers. The strip shows what is in it, in proportion.",
                                          nl: "Een vloeistof in het glas, geen lagen. De strook laat zien wat erin zit, op verhouding." })
             : et({ en: "Drawn to scale, bottom of the glass first.", nl: "Op schaal getekend, onderkant van het glas eerst." })) +
           " " + total + " ml" + et({ en: " of measured liquid", nl: " afgemeten vloeistof" }) +
           (anyFill
             ? et({ en: ", plus a long pour nobody has measured, drawn by the share of the glass it fills.",
                    nl: ", plus een lange schenk die niemand heeft afgemeten, getekend naar het deel van het glas dat hij vult." })
             : ".") + "</p>";
    }

    /* ---- everything with no millilitres, in two lists ---- */
    function lst(items, head) {
      if (!items.length) return "";
      var out = '<div class="ag-sec">' + et(head) + "</div><ul class=\"ag-x\">", k;
      for (k = 0; k < items.length; k++) {
        out += "<li>" + esc(items[k].name) +
          (items[k].note ? ' <span class="ag-no">' + esc(items[k].note) + "</span>" : "") + "</li>";
      }
      return out + "</ul>";
    }
    h += lst(goesIn, { en: "Also goes in", nl: "Gaat er ook in" });
    h += lst(extras, { en: "On top, to finish", nl: "Erop, als afwerking" });

    /* ---- kit ---- */
    var kit = kitFor(d);
    if (kit.length) {
      h += '<div class="ag-sec">' + et({ en: "What you need to make it", nl: "Wat je nodig hebt om hem te maken" }) + "</div><div class=\"ag-kit\">";
      for (i = 0; i < kit.length; i++) h += '<span class="ag-tool">' + esc(kit[i]) + "</span>";
      h += "</div>";
    }

    return h + "</div>";
  }

  /* openSheet writes the guest copy and nothing else, so the glance block is
     appended after it rather than threaded through it. */
  var open0 = window.openSheet;
  if (typeof open0 === "function") {
    window.openSheet = function (id) {
      var out = open0.apply(this, arguments);
      try {
        var d = null, si, di;
        for (si = 0; si < SECTIONS.length; si++) {
          var ds = SECTIONS[si].drinks || [];
          for (di = 0; di < ds.length; di++) if (ds[di].id === id) d = ds[di];
        }
        var body = document.getElementById("sheet-body");
        if (d && body) body.insertAdjacentHTML("beforeend", vizHTML(d));
      } catch (err) {}
      return out;
    };
  }
})();

  if (typeof render === "function") render();
})();

</script>
