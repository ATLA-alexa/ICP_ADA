  function sv(x) { return (LANG === "nl" && SRCV[x]) ? SRCV[x] : x; }

  function row(label, val) {
    return val ? "<dt>" + esc(tt(label)) + "</dt><dd>" + esc(sv(val)) + "</dd>" : "";
  }

  var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
  function openSrc(title, v) {
    if (!sheet) return;
    var head = v.t === "house"
      ? '<span class="src-tag house">' + esc(tt({ en: "We make this", nl: "Dit maken wij zelf" })) + "</span>"
      : '<span class="src-tag bought">' + esc(tt({ en: "Bought in", nl: "Ingekocht" })) + "</span>";
    var body = '<dl class="src-row">' +
      (v.t === "house"
        ? row({ en: "Made from", nl: "Gemaakt van" }, v.from) +
          row({ en: "Yield",     nl: "Opbrengst" },   v.yield) +
          row({ en: "Keeps",     nl: "Houdbaar" },    v.keeps)
        : row({ en: "Supplier",  nl: "Leverancier" }, v.shop) +
          row({ en: "Pack",      nl: "Verpakking" },  v.pack)) +
      row({ en: "Lives in", nl: "Staat in" }, v.home) + "</dl>";
    if (v.note) body += '<p class="src-note">' + esc(sv(v.note)) + "</p>";
    if (v.warn) body += '<div class="src-warn"><b>' +
      esc(tt({ en: "Note.", nl: "Let op." })) + "</b> " + esc(sv(v.warn)) + "</div>";
    var sw = document.getElementById("sheet-swatch");
    if (sw) sw.style.background = v.t === "house" ? "#3E5140" : "var(--gold)";
    document.getElementById("sheet-name").textContent = title;
    document.getElementById("sheet-body").innerHTML = head + body;
    sheet.hidden = false;
    requestAnimationFrame(function () {
      sheet.classList.add("open");
      if (scrim) scrim.classList.add("open");
    });
    var c = document.getElementById("sheet-close"); if (c) c.focus();
  }

  document.addEventListener("click", function (e) {
    var li = e.target.closest && e.target.closest(".ing li");
    if (!li) return;
    e.stopPropagation();
    var nmEl = li.querySelector(".nm");
    var raw = nmEl ? nmEl.childNodes[0].nodeValue || nmEl.textContent : li.textContent;
    var hit = lookup(raw);
    var title = String(raw).trim();
    if (!hit) {
      openSrc(title, { t: "buy", shop: "Not yet recorded", pack: "Add this line to the patch block",
                       home: "", warn: "No source recorded for this ingredient yet." });
      return;
    }
    openSrc(title, hit.v);
  }, true);

  /* keyboard access */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var li = e.target.closest && e.target.closest(".ing li");
    if (li) { e.preventDefault(); li.click(); }
  });
  function tagUp() {
    document.querySelectorAll(".ing li:not([tabindex])").forEach(function (li) {

     These are the single most important missing lines. Paste the two rows

     the Inventory tab so it cannot be forgotten. */
  function invBanner() {
    var root = document.getElementById("root");
    if (!root) return;
    var tab = document.querySelector('#subtabs button[data-tab="inventory"]');
    var onInv = !!(tab && tab.getAttribute("aria-selected") === "true");
    var existing = document.getElementById("boiron-banner");
    if (!onInv) { if (existing) existing.remove(); return; }
    /* look for the actual inventory row, not the old TBD note, which also
       contains the words "Boiron lime" */
    /* Scan the tables only. Scanning the whole of #root would match this
       banner's own text and toggle it forever. */
    var tables = root.querySelectorAll("table"), scan = "";
    for (var i = 0; i < tables.length; i++) scan += tables[i].innerText.toLowerCase();
    /* Match both languages: the Dutch table says "Boiron limoenpuree", so an
       English-only test would fire this banner over a row that is right there. */
    if (scan.indexOf("lime puree") !== -1 || scan.indexOf("limoenpuree") !== -1) {
      if (existing) existing.remove();
      return;
    }
    if (existing) return;
    var d = document.createElement("div");
    d.id = "boiron-banner";
    d.className = "src-warn";
    d.style.margin = "0 0 18px";
    d.innerHTML = LANG === "nl"
      ? "<b>Er ontbreken twee regels in deze tabel.</b> Boiron limoenpuree, " +
        "<b>19,6 L per week</b>, Sligro 217504, en Boiron citroenpuree, <b>9,1 L per week</b>, " +

        "uit met de hand geperst fruit, dus het overzicht komt ongeveer 29 liter per week tekort " +
        "en geen van beide heeft al een prijs. Voeg ze toe aan INV_ITEMS, dan verdwijnt deze melding."
      : "<b>Two lines are missing from this table.</b> Boiron lime puree, " +
        "<b>19.6 L a week</b>, Sligro 217504, and Boiron lemon puree, <b>9.1 L a week</b>, " +
        "Sligro 217502. Every drink that calls for lime or lemon juice pours these, not hand " +
        "squeezed fruit, so the sheet is short by about 29 litres a week and neither has a " +
        "price yet. Add them to INV_ITEMS, then this notice disappears.";
    root.insertBefore(d, root.firstChild);
  }

    h += '<div class="bk-blocks">' + d.b.map(function (r) {
      return '<div class="bk-b"><span class="bk-k">' + esc(t(r[0])) + "</span>" +
             '<span class="bk-v">' + esc(t(r[1])) + "</span></div>";
    }).join("") + "</div>";
    if (d.tbl) h += '<div class="bk-tbl"><span class="bk-k">' +

      t(d.tbl).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";

  /* ---- sales counter: how many of each cocktail went out this week ---- */
  var LS_SALES = "quatro-sales-v1";
  var SALES = load(LS_SALES, {});
  var WEEK0 = new Date(2026, 7, 27); /* Thursday 27.08.2026, the first counted week */
  function weekKey(d) {
    var ms = d - WEEK0, w = Math.floor(ms / (7 * 864e5));
    return w < 0 ? 0 : w;
  }
  function weekLabel(w) {
    var a = new Date(WEEK0.getTime() + w * 7 * 864e5), b = new Date(a.getTime() + 6 * 864e5);
    function f(x) { return ("0" + x.getDate()).slice(-2) + "." + ("0" + (x.getMonth() + 1)).slice(-2) + "." + String(x.getFullYear()).slice(-2); }
    return f(a) + tt({ en: " to ", nl: " tot " }) + f(b);
  }
  var CURW = weekKey(new Date());
  function salesHTML() {
    var wk = SALES["w" + CURW] || {};
    var total = 0;
    var rows = BK.map(function (d) {
      var n = Number(wk[d.id] || 0); total += n;
      return '<tr><td><span class="slot"><span class="slot-dot" style="background:' + d.sw +
        '"></span>' + esc(d.name) + "</span></td>" +
        '<td><button class="sl-b" type="button" data-sales="-|' + esc(d.id) + '">&minus;</button>' +
        '<input class="sl-i" type="number" min="0" step="1" inputmode="numeric" data-salesin="' + esc(d.id) +
        '" value="' + n + '" aria-label="' + esc(d.name) + '">' +
        '<button class="sl-b" type="button" data-sales="+|' + esc(d.id) + '">+</button></td>' +
        '<td class="num">' + (total ? Math.round(n / total * 100) : 0) + "%</td></tr>";
    }).join("");
    var best = BK.slice().sort(function (a, b) { return (wk[b.id] || 0) - (wk[a.id] || 0); })[0];
    return '<div class="panel"><h3>' +
      et({ en: "Drinks sold this week", nl: "Deze week verkochte drankjes" }) + "</h3>" +
      '<p class="legend">' + et({ en: "Week ", nl: "Week " }) + (CURW + 1) + ", " + weekLabel(CURW) + ". " +
      et({ en: "Counting started 27.08.26. Tap plus as they go out, or type the number at close. It saves in this browser and rolls into a new week automatically.",
           nl: "De telling begon op 27.08.26. Tik op plus zodra ze de bar uit gaan, of typ het aantal bij sluiting. Het wordt in deze browser bewaard en rolt vanzelf door naar een nieuwe week." }) + "</p>" +
      '<div class="tablewrap"><table class="wide"><thead><tr>' +
      "<th>" + et({ en: "Cocktail", nl: "Cocktail" }) + "</th>" +
      "<th>" + et({ en: "Sold", nl: "Verkocht" }) + "</th>" +
      "<th>" + et({ en: "Share", nl: "Aandeel" }) + "</th></tr></thead><tbody>" + rows +
      "<tr><td><b>" + et({ en: "Total", nl: "Totaal" }) + '</b></td><td class="num"><b>' + total +
      "</b></td><td></td></tr></tbody></table></div>" +
      (total ? '<p class="legend"><b>' +
        et({ en: "Best seller so far: ", nl: "Best verkocht tot nu toe: " }) + esc(best.name) + "</b>, " +
        (wk[best.id] || 0) + et({ en: " of ", nl: " van " }) + total + ". " +
        et({ en: "That is the one to keep stocked deepest.",
             nl: "Daar moet de voorraad het diepst op zijn." }) : "") +
      "</div>";
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-sales]");
    if (!b) return;
    var p = b.dataset.sales.split("|"), k = "w" + CURW;
    SALES[k] = SALES[k] || {};
    SALES[k][p[1]] = Math.max(0, Number(SALES[k][p[1]] || 0) + (p[0] === "+" ? 1 : -1));
    save(LS_SALES, SALES); render();
  });
  document.addEventListener("input", function (e) {
    var i = e.target.closest && e.target.closest("[data-salesin]");
    if (!i) return;
    var k = "w" + CURW;
    SALES[k] = SALES[k] || {};
    SALES[k][i.dataset.salesin] = Math.max(0, Number(i.value || 0));
    save(LS_SALES, SALES);
  });

  if (typeof TABS !== "undefined" && TABS) TABS.storage = storageHTML;

  if (typeof render === "function") render();
})();
