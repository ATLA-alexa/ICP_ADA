<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Quatro · Prep, FIFO and inventory</title>
<style>
/* ==========================================================================
   QUATRO. One file, no network, runs offline on a phone behind the bar.
   The arch (20px 20px 6px 6px) is the brand, taken from the backlit
   limestone niches. The room is the calm canvas; the drinks are the paint.
   ========================================================================== */

:root {
  --limestone: #FAF6EF;
  --limestone-deep: #F2EBDF;
  --ink: #23201C;
  --ink-soft: #6B6459;
  --gold: #A8863C;
  --gold-pale: #D9C79A;

  --amber: #B26A05;
  --amber-bg: #FBF0DC;
  --green: #2F6B3A;
  --green-bg: #EEF6F0;
  --red: #8C3A2E;
  --red-bg: #FBEEEB;
  --pink-zone: #C4708A;
  --yellow-zone: #C9A227;

  --arch: 20px 20px 6px 6px;
  --arch-sm: 12px 12px 4px 4px;

  --display: 'Marcellus', Georgia, 'Times New Roman', serif;
  --body: 'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--limestone); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }

.wrap { max-width: 820px; margin: 0 auto; padding: 0 var(--s4) var(--s8); }
.smallcaps { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; color: var(--gold); }

/* ---- top bar -------------------------------------------------------------- */

.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--limestone) 93%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--gold-pale); }
.topbar-inner { max-width: 820px; margin: 0 auto; padding: var(--s3) var(--s4); display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: var(--s2); flex: 1 1 auto; min-width: 0; }
.brand-name { font-family: var(--display); font-size: 22px; letter-spacing: 0.02em; }
.brand-city { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }

.seg { display: flex; gap: 2px; background: var(--limestone-deep); border-radius: 999px; padding: 3px; flex: 0 0 auto; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); transition: background 140ms ease, color 140ms ease; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--limestone); }
.seg--lang button { padding: 6px 9px; }

/* ---- sub tabs ------------------------------------------------------------- */

.subtabs { display: flex; gap: var(--s1); overflow-x: auto; padding: var(--s3) var(--s4); max-width: 820px; margin: 0 auto; border-bottom: 1px solid var(--limestone-deep); -webkit-overflow-scrolling: touch; }
.subtabs button { flex: 0 0 auto; border: 1px solid transparent; background: none; border-radius: 999px; padding: 6px 12px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
.subtabs button[aria-selected="true"] { background: #fff; border-color: var(--gold-pale); color: var(--ink); }

/* ---- masthead ------------------------------------------------------------- */

.masthead { text-align: center; padding: var(--s7) 0 var(--s5); }
.masthead h1 { font-size: 40px; letter-spacing: 0.03em; }
.masthead .rule { display: block; width: 120px; height: 1px; background: var(--gold-pale); margin: var(--s4) auto; }
.masthead p { margin: 0; color: var(--ink-soft); font-size: 15px; font-style: italic; }

/* ---- sections ------------------------------------------------------------- */

.section { margin-top: var(--s7); }
.section-head { border-bottom: 1px solid var(--gold-pale); padding-bottom: var(--s2); margin-bottom: var(--s4); }
.section-head h2 { font-size: 26px; margin-top: var(--s1); }
.section-note { margin: var(--s2) 0 0; font-size: 14px; color: var(--ink-soft); font-style: italic; }

.cards { display: grid; grid-template-columns: 1fr; gap: var(--s3); }
@media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr; } }

.card { position: relative; display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch); padding: var(--s4); transition: border-color 140ms ease, transform 140ms ease; }
.card:hover { border-color: var(--gold-pale); }
.card:active { transform: scale(0.995); }
.card-top { display: flex; align-items: baseline; gap: var(--s2); }
.swatch { width: 12px; height: 12px; border-radius: 999px; flex: 0 0 auto; transform: translateY(1px); box-shadow: inset 0 0 0 1px rgba(35,32,28,0.22); }
.card-name { font-family: var(--display); font-size: 19px; flex: 1 1 auto; min-width: 0; }
.card-desc { display: block; margin: var(--s2) 0 0; font-size: 14px; color: var(--ink-soft); }
.card-tag { display: inline-block; margin-top: var(--s3); font-size: 11.5px; color: var(--gold); border: 1px solid var(--gold-pale); border-radius: 999px; padding: 3px 9px; }

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: baseline; gap: var(--s3); border-bottom: 1px solid var(--limestone-deep); padding: var(--s3) 0; }
.row-name { font-family: var(--display); font-size: 17px; flex: 0 0 auto; }
.row-comp { font-size: 13px; color: var(--ink-soft); flex: 1 1 auto; min-width: 0; }

.panel { margin-top: var(--s4); background: var(--limestone-deep); border-radius: var(--arch); padding: var(--s4) var(--s5); }
.panel h3 { font-size: 18px; margin-bottom: var(--s1); }
.panel p { margin: 0; font-size: 14px; color: var(--ink-soft); }
.panel--upsell { background: #fff; border: 1px solid var(--gold-pale); padding: var(--s5); text-align: center; }
.panel--upsell .smallcaps { display: block; margin-bottom: var(--s2); }
.panel--upsell h3 { font-size: 22px; margin-bottom: var(--s2); }
.panel--upsell p { font-size: 15px; color: var(--ink); }
.panel--upsell .sub { display: block; margin-top: var(--s2); font-size: 13px; color: var(--ink-soft); }

.altlist { margin: var(--s3) 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s2); }
.altlist li { font-size: 14px; color: var(--ink-soft); }
.altlist b { color: var(--ink); font-weight: 600; }

.footer { margin-top: var(--s8); border-top: 1px solid var(--gold-pale); padding-top: var(--s4); text-align: center; }
.footer .claim { font-family: var(--display); font-size: 18px; }
.footer .fine { font-size: 12px; color: var(--ink-soft); margin-top: var(--s2); }

/* ---- flags and notes ------------------------------------------------------ */

.flag { margin-top: var(--s3); background: var(--amber-bg); border: 1px dashed var(--amber); border-radius: var(--arch-sm); padding: var(--s3); font-size: 13px; color: var(--amber); line-height: 1.5; }
.flag strong { display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
.warn { margin-top: var(--s3); background: var(--red-bg); border: 1px solid var(--red); border-radius: var(--arch-sm); padding: var(--s3) var(--s4); font-size: 13px; color: var(--red); line-height: 1.5; }
.warn strong { display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
.todo { display: inline-block; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--amber-bg); color: var(--amber); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; margin-left: 6px; font-weight: 600; }

/* ---- detail sheet --------------------------------------------------------- */

.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(35,32,28,0.42); opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; max-height: 88vh; display: flex; flex-direction: column; background: var(--limestone); border-radius: var(--arch); transform: translateY(102%); transition: transform 220ms cubic-bezier(0.2,0,0.2,1); box-shadow: 0 -8px 40px rgba(35,32,28,0.18); }
.sheet.open { transform: translateY(0); }
/* display:flex above beats the browser default for [hidden], so say it here.
   Without this the sheet stays in the hit test and swallows every tap. */
.sheet[hidden] { display: none; }
@media (min-width: 720px) { .sheet { left: 50%; right: auto; width: 660px; transform: translate(-50%, 102%); bottom: 3vh; max-height: 90vh; } .sheet.open { transform: translate(-50%, 0); } }
.sheet-head { padding: var(--s5) var(--s5) var(--s3); border-bottom: 1px solid var(--gold-pale); }
.sheet-title { display: flex; align-items: baseline; gap: var(--s2); padding-right: 40px; }
.sheet-title h3 { font-size: 24px; flex: 1 1 auto; }
.sheet-close { position: absolute; top: var(--s3); right: var(--s3); width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--limestone-deep); background: #fff; color: var(--ink-soft); font-size: 18px; line-height: 1; display: grid; place-items: center; }
.sheet-body { overflow-y: auto; padding: var(--s4) var(--s5) var(--s7); -webkit-overflow-scrolling: touch; }
.story { font-size: 16px; line-height: 1.7; margin: 0; }

/* ---- builds --------------------------------------------------------------- */

.build { background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch); padding: var(--s5); margin-top: var(--s4); }
.build-head { display: flex; align-items: baseline; gap: var(--s2); }
.build-head h3 { font-size: 21px; flex: 1 1 auto; }
.spec { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); margin: var(--s3) 0 var(--s4); padding: 0; }
.spec div { font-size: 13px; }
.spec dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.spec dd { margin: 2px 0 0; }
.ing { margin: 0 0 var(--s4); padding: 0; list-style: none; }
.ing li { display: flex; align-items: baseline; gap: var(--s3); border-bottom: 1px solid var(--limestone-deep); padding: 7px 0; font-size: 14.5px; }
.ing .ml { font-variant-numeric: tabular-nums; color: var(--gold); font-size: 13px; min-width: 56px; flex: 0 0 auto; }
.ing .nm { flex: 1 1 auto; }
.ing .nm small { display: block; color: var(--ink-soft); font-size: 12.5px; }
.substack { margin-bottom: var(--s4); }
.substack h4 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: var(--s2); }
.steps { margin: 0; padding-left: 20px; }
.steps li { margin-bottom: var(--s2); font-size: 14.5px; }
blockquote.say { margin: 0 0 var(--s3); padding: var(--s3) var(--s4); border-left: 2px solid var(--gold); background: var(--limestone); border-radius: 0 var(--arch-sm) var(--arch-sm) 0; font-family: var(--display); font-size: 16.5px; line-height: 1.5; }

/* ---- tables --------------------------------------------------------------- */

.tablewrap { overflow-x: auto; border: 1px solid var(--limestone-deep); border-radius: var(--arch); background: #fff; margin-top: var(--s3); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
table.wide { min-width: 760px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--limestone-deep); vertical-align: top; }
th { background: var(--limestone-deep); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.tbd { color: var(--amber); font-size: 11px; letter-spacing: 0.08em; }
.legend { font-size: 12px; color: var(--ink-soft); margin-top: var(--s3); line-height: 1.6; }

.chip { display: inline-block; font-size: 11px; border-radius: 999px; padding: 2px 9px; border: 1px solid; white-space: nowrap; }
.chip.yes { color: var(--green); border-color: #A9C9B0; background: var(--green-bg); }
.chip.no  { color: var(--red); border-color: #E0B3AA; background: var(--red-bg); }
.chip.due { color: var(--amber); border-color: var(--gold-pale); background: var(--amber-bg); }

/* rail slot colour dot, the house language */
.slot { display: inline-flex; align-items: center; gap: var(--s2); }
.slot-dot { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(35,32,28,0.28); }
.slot-n { font-family: var(--display); font-size: 16px; min-width: 14px; }

/* ---- storage zones ------------------------------------------------------- */

.zone { border-radius: var(--arch); padding: var(--s4) var(--s5); margin-top: var(--s4); background: #fff; border: 1px solid var(--limestone-deep); border-left: 4px solid var(--limestone-deep); }
.zone--pink { border-left-color: var(--pink-zone); }
.zone--yellow { border-left-color: var(--yellow-zone); }
.zone h3 { font-size: 19px; }
.zone-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
.zone--pink .zone-label { color: var(--pink-zone); }
.zone--yellow .zone-label { color: var(--yellow-zone); }
.stations { margin: var(--s3) 0 0; padding-left: 18px; }
.stations li { font-size: 14px; margin-bottom: var(--s2); }
.fridge { margin-top: var(--s4); }
.fridge h4 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: var(--s2); }
.doors { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s1); }
.doors li { font-size: 13.5px; }
.doors b { font-family: var(--mono); font-size: 12px; color: var(--gold); }

/* ---- picks and tool blocks, also used by the print button ----------------- */

.tool-block { background: #fff; border: 1px solid var(--limestone-deep); border-radius: var(--arch); padding: var(--s4) var(--s5); margin-top: var(--s4); }
.tool-block h3 { font-size: 19px; margin-bottom: var(--s3); }
.picks { display: flex; flex-wrap: wrap; gap: var(--s2); }
.pick { border: 1px solid var(--gold-pale); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: var(--s2); transition: opacity 140ms ease, border-color 140ms ease, background 140ms ease; }
.pick .swatch { width: 10px; height: 10px; }
.pick[aria-pressed="true"] { border-color: var(--gold); background: var(--limestone-deep); font-weight: 600; }
body.has-picks .pick[aria-pressed="false"] { opacity: 0.38; }
.pick-count { font-size: 12px; color: var(--ink-soft); margin-top: var(--s2); }

/* ---- print booklet -------------------------------------------------------- */

#booklet { display: none; }

@media print {
  @page { margin: 12mm; }
  body { background: #fff; }
  .topbar, .subtabs, .scrim, .sheet, .print-hide { display: none !important; }

  /* Booklet mode: one drink per page, everything else gone. */
  body.booklet #app { display: none !important; }
  body.booklet #booklet { display: block !important; }
  .bk-page { break-after: page; page-break-after: always; padding-bottom: 6mm; }
  .bk-page:last-child { break-after: auto; page-break-after: auto; }
  .bk-head { border-bottom: 1.5pt solid #000; padding-bottom: 2mm; margin-bottom: 4mm; }
  .bk-head h2 { font-size: 22pt; }
  .bk-swatch { display: inline-block; width: 10pt; height: 10pt; border-radius: 50%; border: 0.75pt solid #000; margin-right: 4pt; }
  .bk-spec { font-size: 9.5pt; letter-spacing: 0.06em; text-transform: uppercase; color: #000; margin-top: 1.5mm; }
  .bk-sec { margin-bottom: 4mm; }
  .bk-sec h3 { font-size: 8.5pt; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 1.5mm; border-bottom: 0.5pt solid #999; padding-bottom: 0.8mm; }
  .bk-sec ol, .bk-sec ul { margin: 0; padding-left: 5mm; font-size: 10pt; }
  .bk-sec li { margin-bottom: 1mm; }
  .bk-say { font-family: var(--display); font-size: 11pt; border-left: 1.5pt solid #000; padding-left: 3mm; margin: 0 0 2mm; }
  .bk-flag { border: 0.75pt dashed #000; padding: 2mm; font-size: 9pt; margin-bottom: 3mm; }
  /* Grayscale safe: a ruled box, no fills. */
  .bk-notes { border: 0.75pt solid #000; padding: 2mm 3mm 0; margin-top: 5mm; }
  .bk-notes h3 { font-size: 8.5pt; letter-spacing: 0.16em; text-transform: uppercase; border: 0; margin-bottom: 1mm; }
  .bk-rule { border-bottom: 0.4pt solid #666; height: 7mm; }

  /* Plain menu print, when not in booklet mode. */
  body:not(.booklet) .wrap { max-width: none; padding: 0; }
  body:not(.booklet) .card { border: 0; padding: 0 0 2mm; break-inside: avoid; border-radius: 0; }
  body:not(.booklet) .cards { grid-template-columns: 1fr 1fr; gap: 2mm 6mm; }
  body:not(.booklet) .flag, body:not(.booklet) .warn { display: none !important; }
}

@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
/* guide, sweet note, prep methods, owner tables */
.sweetnote { margin: 10px 0 0; color: var(--ink-soft); font-size: 14px; }
.guide { margin: 0 0 20px; background: var(--limestone-deep); border: 1px solid var(--gold-pale);
  border-radius: 20px 20px 6px 6px; padding: 12px 16px; }
.guide summary { cursor: pointer; font-weight: 600; font-size: 14px; letter-spacing: 0.02em; color: var(--gold); }
.guide-open { margin: 12px 0; font-size: 14px; line-height: 1.6; }
.guide-list { margin: 0; display: grid; gap: 8px; }
.guide-list div { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-size: 13px; line-height: 1.55; }
.guide-list dt { font-weight: 600; }
.guide-list dd { margin: 0; color: var(--ink-soft); }
.prep-method td { font-size: 13px; line-height: 1.6; color: var(--ink-soft); background: var(--limestone-deep); }
.owner-h { font-size: 16px; margin: 24px 0 8px; }
@media print { .guide { display: none; } }
</style>
</head>

<script>
/* ==========================================================================
   CREW BUILD. This is quatro-WORKING.html with one flag set. The patch block
   reads it and shows only Prep and FIFO, Inventory, and the Order of
   operations: what someone covering the bar needs, without the guest menu,
   the drink reference or the price book. Everything else is identical, and
   generated from the same source, so the two files cannot drift apart.
   ========================================================================== */
window.QUATRO_CREW = true;
</script>


<div id="app">

<header class="topbar print-hide">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-name">Quatro</span>
      <span class="brand-city">Amsterdam</span>
    </div>
    <div class="seg" id="modes" role="group" aria-label="Mode"></div>
    <div class="seg seg--lang" id="langs" role="group" aria-label="Language"></div>
  </div>
  <nav class="subtabs" id="subtabs" role="tablist" hidden></nav>
</header>

<main class="wrap">
  <div id="root"></div>
</main>

</div>

<div id="booklet"></div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name" hidden>
  <div class="sheet-head">
    <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">&times;</button>
    <div class="sheet-title">
      <span class="swatch" id="sheet-swatch"></span>
      <h3 id="sheet-name"></h3>
    </div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script>
"use strict";

/* ==========================================================================
   DATA
   One object. A non-developer can edit any text here, add a price, or change
   a build without touching the code below it.

   Every translatable string is {en, nl}. Drink names stay in English by
   instruction, so name is a plain string.

   PRICES. price is null on every drink and nothing renders one. The layout is
   built to look finished without them. When prices land, fill price and
   ops.cost and the Owner block fills in on its own.
   ========================================================================== */

var VAT = 0.09;

var UI = {
  menu:        { en: "Menu",            nl: "Menu" },
  runsheet:    { en: "Run sheet",       nl: "Werkblad" },
  builds:      { en: "Builds",          nl: "Opbouw" },
  rail:        { en: "Rail",            nl: "Speedrail" },
  prep:        { en: "Prep and FIFO",   nl: "Voorbereiding en FIFO" },
  inventory:   { en: "Inventory",       nl: "Voorraad" },
  storage:     { en: "Storage",         nl: "Opslag" },
  future:      { en: "Future",          nl: "Toekomst" },
  tagline:     { en: "The room is the calm canvas. The drinks are the paint.",
                 nl: "De ruimte is het rustige doek. De drankjes zijn de verf." },
  alcoholFree: { en: "Everything on this menu is alcohol-free",
                 nl: "Alles op dit menu is alcoholvrij" },

                 nl: "Laat het ons weten bij allergieen. Wij passen de drank aan." },
  glass:       { en: "Glass",           nl: "Glas" },
  ice:         { en: "Ice",             nl: "Ijs" },
  method:      { en: "Method",          nl: "Methode" },
  atBar:       { en: "At the bar",      nl: "Achter de bar" },
  atTable:     { en: "At the table",    nl: "Aan tafel" },
  sayThis:     { en: "Say this",        nl: "Zeg dit" },
  ingredients: { en: "Ingredients, in build order", nl: "Ingredienten, in opbouwvolgorde" },
  printBooklet:{ en: "Print booklet",   nl: "Boekje afdrukken" },
  bookletNote: { en: "One drink per page with a notes box, grayscale safe.",
                 nl: "Een drankje per pagina met een notitievak, geschikt voor grijstinten." },
  myNotes:     { en: "My notes",        nl: "Mijn aantekeningen" },
  staffBlock:  { en: "Staff",           nl: "Personeel" },
  ownerBlock:  { en: "Owner",           nl: "Eigenaar" },
  slot:        { en: "Slot",            nl: "Slot" },
  colour:      { en: "Colour",          nl: "Kleur" },
  contents:    { en: "Contents",        nl: "Inhoud" },

var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
};

  TAB  = localStorage.getItem("quatro-tab") || "builds";
} catch (e) {}
if (["en", "nl"].indexOf(LANG) === -1) LANG = "en";
if (["menu", "runsheet"].indexOf(MODE) === -1) MODE = "menu";

/* t() takes either a plain string or an {en, nl} pair, so DATA can mix both. */
function t(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[LANG] != null ? v[LANG] : (v.en != null ? v.en : "");
}
function ui(k) { return t(UI[k]); }

/* ---------------- render ---------------- */

var TABS = { builds: renderBuilds, rail: renderRail, prep: renderPrep, inventory: renderInventory, storage: renderStorage, future: renderFuture };

function render() {
  renderChrome();
  $("#root").innerHTML = MODE === "menu" ? renderMenu() : guideHTML() + (TABS[TAB] || renderBuilds)();
  try {
    localStorage.setItem("quatro-lang", LANG);
    localStorage.setItem("quatro-mode", MODE);
    localStorage.setItem("quatro-tab", TAB);
  } catch (e) {}
  if (sheetDrink) openSheet(sheetDrink.id);
}

/* ---------------- detail sheet, guest facing ---------------- */

var sheet = $("#sheet"), scrim = $("#scrim");
var sheetDrink = null, sheetTimer = null, lastFocus = null;

function openSheet(id) {
  var d = byId[id];
  if (!d) return;
  sheetDrink = d;
  $("#sheet-swatch").style.background = d.swatch;
  $("#sheet-name").textContent = d.name;

  /* FIX 1: STORY DUPLICATION, use story if present, otherwise fall back to desc */
  var displayText = d.story ? t(d.story) : t(d.desc);

  /* Guest sheet: story/desc and tag only. No glass, no ice, no method. */
  $("#sheet-body").innerHTML = '<p class="story">' + esc(displayText) + "</p>" +
    (d.tag ? '<p style="margin-top:20px"><span class="card-tag">' + esc(t(d.tag)) + "</span></p>" : "");

  if (sheetTimer) { clearTimeout(sheetTimer); sheetTimer = null; }
  sheet.hidden = false;
  requestAnimationFrame(function () { sheet.classList.add("open"); scrim.classList.add("open"); });
  $("#sheet-close").focus();
}
function closeSheet() {
  sheet.classList.remove("open"); scrim.classList.remove("open");
  if (sheetTimer) clearTimeout(sheetTimer);
  /* Hiding is deferred so the exit transition can play, and the timer is held
     so a fast reopen can cancel it. */
  sheetTimer = setTimeout(function () { sheet.hidden = true; sheetTimer = null; }, 220);
  sheetDrink = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------------- events ---------------- */

document.addEventListener("click", function (e) {
  var m = e.target.closest("[data-mode]");
  if (m) { MODE = m.dataset.mode; render(); return; }

  var l = e.target.closest("[data-lang]");
  if (l) { LANG = l.dataset.lang; render(); return; }

  var tb = e.target.closest("[data-tab]");
  if (tb) { TAB = tb.dataset.tab; render(); return; }

  if (e.target.closest("#print-booklet")) {
    $("#booklet").innerHTML = bookletHTML();
    document.body.classList.add("booklet");
    window.print();
    /* Leave booklet mode once the dialog is done with. */
    setTimeout(function () { document.body.classList.remove("booklet"); }, 500);
    return;
  }

  var card = e.target.closest("[data-drink]");
  if (card) { lastFocus = card; openSheet(card.dataset.drink); return; }

  if (e.target.id === "sheet-close" || e.target.id === "scrim") closeSheet();
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
});

window.addEventListener("afterprint", function () { document.body.classList.remove("booklet"); });

render();
</script>

/* Inventory table. Six columns, a banded row per category, and no min-width,

/* Flex rather than a float: at phone width a floated count lands on top of a

.inv-cat td { display: flex; align-items: baseline; gap: 10px; }
.inv-cat .cat-r { margin-left: auto; text-align: right; font-family: var(--body);

.sup-sel.tbd { border-color: #E0B3AA; color: #9E2B3B; background: rgba(158,43,59,.06); }

/* The group band is a button on every width: tap it to fold the group away. */

/* The band name is the category name, so editing it there is the obvious
   way to rename one. Only editable while you are grouped by category. */

.cat-nm[contenteditable="true"]:hover { background: rgba(255,255,255,.55); }

.iv-field { font: inherit; font-size: 13px; padding: 4px 7px; min-width: 130px;
  border: 1px solid var(--gold-pale); border-radius: 6px; background: #fff; }

@media print { .cat-nm { box-shadow: none; } .iv-catf { display: none; } }
.cat-tw { display: inline-block; width: 0; height: 0; margin-right: 7px; vertical-align: middle;

.inv-cat.shut .cat-tw { transform: rotate(0deg); }

/* The details toggle. Off on wide screens, where every column is visible
   anyway and there is nothing to reveal. */
.iv-more { display: none; }

/* Every wide table stacks on a phone. Four of them scrolled sideways at
   390 px, which is the thing you cannot do one-handed behind a bar: the
   inventory, the rail, the prep sheet and the storage list. The cells get
   their column name from labelWide, so the stack says what each value is. */
@media (max-width: 719px) {
  /* The base sets table.wide { min-width: 760px }, which is what actually
     forces the sideways scroll: stacking the cells alone does not undo it. */
  table.wide { min-width: 0; }
  .wide, .wide tbody, .wide tr, .wide td { display: block; width: 100%; }
  .wide thead { display: none; }
  .wide tr { border-bottom: 1px solid var(--gold-pale); padding: 10px 0; }
  .wide td { border: 0; padding: 2px 0; }
  .wide td[data-l]::before { content: attr(data-l); display: block; font-size: 9.5px;
    letter-spacing: .09em; text-transform: uppercase; color: var(--gold); margin-bottom: 1px; }
  .wide td:empty { display: none; }
  .wide .num { text-align: left; }

  /* Prep: the date made and the use by go directly under the item, because
     that pair is what you are checking when you pick the bottle up. */
  .prep-t tbody tr { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .prep-t tbody td { width: auto; }
  .prep-t tbody td:nth-child(1) { order: 1; flex: 1 1 100%; font-size: 15px; }
  .prep-t tbody td:nth-child(5) { order: 2; flex: 1 1 100%; }
  .prep-t tbody td:nth-child(2) { order: 3; }
  .prep-t tbody td:nth-child(3) { order: 4; }
  .prep-t tbody td:nth-child(4) { order: 5; flex: 1 1 100%; }
  .prep-t tbody td:nth-child(6) { order: 6; flex: 1 1 100%; margin-top: 4px; }
  .prep-t tbody td:nth-child(2)::before,
  .prep-t tbody td:nth-child(3)::before { display: inline; margin-right: 5px; }
}

@media (max-width: 719px) {
  .inv-t, .inv-t tbody, .inv-t td { display: block; width: 100%; }
  .inv-t thead { display: none; }

  /* Two lines, not six. The name and the count you are about to change sit
     on the first line; the numbers you read sit on the second as chips.
     Anything you only need occasionally is behind the toggle. */
  .inv-t tr.inv-r { display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: 3px 12px; border-bottom: 1px solid var(--gold-pale); padding: 9px 0; width: 100%; }
  .inv-t tr.inv-r td { border: 0; padding: 0; display: inline-flex; flex-wrap: wrap;
    align-items: baseline; gap: 5px; width: auto; }
  .inv-t tr.inv-r td::before { content: attr(data-l); font-size: 9.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--gold); white-space: nowrap; }

  .inv-t tr.inv-r td:nth-child(1) { order: 1; flex: 1 1 calc(100% - 118px);
    display: block; padding-left: 22px; position: relative; }
  .inv-t tr.inv-r td:nth-child(1)::before { display: none; }   /* the name needs no label */
  .inv-t tr.inv-r td:nth-child(3) { order: 2; flex: 0 0 auto; }          /* have  */
  .inv-t tr.inv-r td:nth-child(2) { order: 3; }                          /* need  */
  .inv-t tr.inv-r td:nth-child(4) { order: 4; }                          /* buy   */
  .inv-t tr.inv-r td:nth-child(5) { order: 5; }                          /* cost  */
  .inv-t tr.inv-r td:nth-child(6) { order: 6; flex: 1 1 100%; }          /* buy at */
  .inv-t tr.inv-r td.num { text-align: left; }

  /* Behind the toggle: cost, where to buy, the day dot and the note. */
  .inv-t tr.inv-r td:nth-child(5),
  .inv-t tr.inv-r td:nth-child(6),
  .inv-t tr.inv-r .mk,
  .inv-t tr.inv-r .iv-catf,
  .inv-t tr.inv-r .iv-note { display: none; }
  .inv-t tr.inv-r.open td:nth-child(5) { display: inline-flex; }
  .inv-t tr.inv-r.open td:nth-child(6) { display: flex; }
  .inv-t tr.inv-r.open .mk { display: flex; }
  .inv-t tr.inv-r.open .iv-catf { display: flex; }
  .inv-t tr.inv-r.open .iv-note { display: block; }

  .iv-more { display: block; position: absolute; left: -2px; top: 1px; width: 20px; height: 20px;
    border: 0; background: none; padding: 0; }
  .iv-more::before { content: ""; position: absolute; left: 5px; top: 6px;
    border-left: 5px solid var(--gold); border-top: 4px solid transparent;
    border-bottom: 4px solid transparent; transition: transform 120ms; }
  .inv-r.open .iv-more::before { transform: rotate(90deg); }

  /* The editable fields carry margin:0 -3px so the hover pad sits flush with
     the text. Stacked, that bleeds 3px past the container and reintroduces a
     sideways scroll, so drop the pull on a phone. */
  .inv-t tr.inv-r .iv-name, .inv-t tr.inv-r .iv-need { margin-left: 0; margin-right: 0; }
  .inv-t tr.inv-r .inv-qty { width: 62px; }
  /* Two class names on purpose: ".inv-t td" above also matches this cell and
     ties on specificity, and a tie is settled by source order, which put the
     count flush against a long category name with no gap. */
  .inv-t tr.inv-cat { display: block; width: 100%; }
  .inv-t tr.inv-cat td { display: flex; width: 100%; }
  /* The bar caption says "0 / 11.2 L (0%)", which the per-week and
     still-to-buy chips on the next line already say. The bar itself stays. */
  .inv-t tr.inv-r .barlbl { display: none; }
  .inv-t tr.inv-r.open .barlbl { display: block; font-size: 11px; }
  .inv-cat td { display: block; }
}

body.cmt-on #cmt-fab .cf-n { background: #fff; color: var(--gold); }

/* In comment mode every block that can take a note says so on hover. */
body.cmt-on #root tr:hover, body.cmt-on #root .ops-c:hover, body.cmt-on #root .build:hover,
body.cmt-on #root .panel:hover, body.cmt-on #root .bk-page:hover, body.cmt-on #root .warn:hover,

body.cmt-on #root { cursor: crosshair; }

/* A block that already carries a note keeps a mark, mode on or off. */
#root .has-cmt { position: relative; box-shadow: inset 3px 0 0 var(--gold); }
#root .has-cmt::after { content: attr(data-cmt-n); position: absolute; top: 2px; right: 2px;

  font-size: 10px; line-height: 15px; text-align: center; padding: 0 3px; z-index: 2; }

#cmt-compose { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(140%);
  z-index: 80; width: min(560px, calc(100vw - 24px)); background: #fff;

#cmt-compose .cc-b { display: flex; gap: 8px; margin-top: 10px; }
#cmt-compose .cc-b button, #cmt-panel .cp-f button { font: inherit; font-size: 13px;
  padding: 8px 13px; border-radius: 9px; border: 1px solid var(--gold-pale);
  background: var(--limestone); color: var(--ink); cursor: pointer; }
#cmt-compose #cc-save { background: var(--gold); border-color: var(--gold); color: #fff; }
#cmt-compose .cc-prev { margin-bottom: 9px; display: grid; gap: 5px; }

#cmt-panel .cp-h b { font-family: 'Marcellus', Georgia, serif; letter-spacing: .12em;

#cmt-panel #cmt-close { margin-left: auto; border: 0; background: none; font: inherit;

#cmt-panel .cp-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
#cmt-panel .cp-empty { font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }

#cmt-panel .cp-f button { flex: 1; padding: 8px 6px; font-size: 12px; }
@media (max-width: 720px) {

  function sv(x) { return (LANG === "nl" && SRCV[x]) ? SRCV[x] : x; }

  /* The source cards used to be fixed text. A shop changes, a pack size
     changes, something moves shelf, and the card stayed wrong until the file
     was rebuilt. Every field on them is editable now and saves in this
     browser, per language, so a Dutch edit does not overwrite the English one
     and the other language is used only when its own is empty. */
  var LS_SRC = "quatro-src-v1";
  var SRCEDIT = null;
  function srcEdits() { if (!SRCEDIT) SRCEDIT = load(LS_SRC, {}); return SRCEDIT; }
  function srcGet(key, field, fallback) {
    var e = srcEdits()[key];
    if (e) {
      var mine = e[field + "_" + LANG];
      if (mine) return mine;
      var other = e[field + "_" + (LANG === "nl" ? "en" : "nl")];
      if (other) return other;
    }
    return sv(fallback) || "";
  }
  function srcSet(key, field, val) {
    var all = srcEdits();
    if (!all[key]) all[key] = {};
    all[key][field + "_" + LANG] = val;
    save(LS_SRC, all);
  }
  /* Every field is drawn even when it is empty, so a missing pack size or
     shelf can be filled in rather than simply not being there. */
  function row(label, val, key, field) {
    var shown = srcGet(key, field, val);
    return "<dt>" + esc(tt(label)) + "</dt>" +
      '<dd class="src-ed' + (shown ? "" : " empty") + '" contenteditable="true" ' +
      'data-srck="' + esc(key) + '" data-srcf="' + esc(field) + '" data-ph="' +
      et({ en: "not recorded, click to add", nl: "niet vastgelegd, klik om toe te voegen" }) +
      '">' + esc(shown) + "</dd>";
  }
  document.addEventListener("blur", function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.srck) return;
    var val = el.textContent.trim();
    srcSet(el.dataset.srck, el.dataset.srcf, val);
    el.classList.toggle("empty", !val);
  }, true);

  var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
  function openSrc(title, v, key) {
    if (!sheet) return;
    key = key || slug(title);
    var head = v.t === "house"
      ? '<span class="src-tag house">' + esc(tt({ en: "We make this", nl: "Dit maken wij zelf" })) + "</span>"
      : '<span class="src-tag bought">' + esc(tt({ en: "Bought in", nl: "Ingekocht" })) + "</span>";
    var body = '<dl class="src-row">' +
      (v.t === "house"
        ? row({ en: "Made from", nl: "Gemaakt van" }, v.from,  key, "from") +
          row({ en: "Yield",     nl: "Opbrengst" },   v.yield, key, "yield") +
          row({ en: "Keeps",     nl: "Houdbaar" },    v.keeps, key, "keeps")
        : row({ en: "Supplier",  nl: "Leverancier" }, v.shop,  key, "shop") +
          row({ en: "Pack",      nl: "Verpakking" },  v.pack,  key, "pack")) +
      row({ en: "Lives in", nl: "Staat in" }, v.home, key, "home") + "</dl>";
    /* "Click an ingredient and it tells you straight away." The card is what
       opens from every ingredient list, so the dot lives here too. A house
       item carries its own keep window, so the use-by works itself out; a
       bought-in one has none on file and says so. */
    body += dateCell("src-" + key, v.t === "house" ? sv(v.keeps) : "",
      { en: "Day dot on the one in use", nl: "Dagsticker op degene in gebruik" });
    body += '<p class="src-hint">' +
      et({ en: "Supplier, pack and where it lives are editable. Click one and type, it saves in this browser.",
           nl: "Leverancier, verpakking en waar het staat zijn aan te passen. Klik erop en typ, het wordt in deze browser bewaard." }) + "</p>";
    if (v.note) body += '<p class="src-note">' + esc(sv(v.note)) + "</p>";
    if (v.warn) body += '<div class="src-warn"><b>' +
      esc(tt({ en: "Note.", nl: "Let op." })) + "</b> " + esc(sv(v.warn)) + "</div>";
    var sw = document.getElementById("sheet-swatch");
    if (sw) sw.style.background = v.t === "house" ? "#3E5140" : "var(--gold)";
    document.getElementById("sheet-name").textContent = title;
    document.getElementById("sheet-body").innerHTML = head + body;
    sheet.hidden = false;
    requestAnimationFrame(function () {
      sheet.classList.add("open");
      if (scrim) scrim.classList.add("open");
    });
    var c = document.getElementById("sheet-close"); if (c) c.focus();
  }

  document.addEventListener("click", function (e) {
    /* This one listens on the way down, so a stopPropagation from the comment
       layer cannot reach it. It stands aside itself while commenting. */
    if (CMTMODE) return;
    var li = e.target.closest && e.target.closest(".ing li");
    if (!li) return;
    e.stopPropagation();
    var nmEl = li.querySelector(".nm");
    var raw = nmEl ? nmEl.childNodes[0].nodeValue || nmEl.textContent : li.textContent;
    var hit = lookup(raw);
    var title = String(raw).trim();
    if (!hit) {
      openSrc(title, { t: "buy", shop: "", pack: "", home: "",
                       warn: "No source recorded for this ingredient yet. The three fields are empty and editable: fill them in and they save." }, slug(title));
      return;
    }
    openSrc(title, hit.v, hit.key);
  }, true);

  /* keyboard access */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var li = e.target.closest && e.target.closest(".ing li");
    if (li) { e.preventDefault(); li.click(); }
  });
  function tagUp() {
    document.querySelectorAll(".ing li:not([tabindex])").forEach(function (li) {
      li.setAttribute("tabindex", "0");
      li.setAttribute("role", "button");
    });
  }
  new MutationObserver(tagUp).observe(document.body, { childList: true, subtree: true });
  tagUp();


  /* ---- 3. INVENTORY, the two Boiron purees ----------------------------
     These are the single most important missing lines. Paste the two rows
     under section 4 below into your INV_ITEMS array so they join the
     totals and the saved stock counts. Until you do, this banner shows on
     the Inventory tab so it cannot be forgotten. */
  function invBanner() {
    var root = document.getElementById("root");
    if (!root) return;
    var tab = document.querySelector('#subtabs button[data-tab="inventory"]');
    var onInv = !!(tab && tab.getAttribute("aria-selected") === "true");
    var existing = document.getElementById("boiron-banner");
    if (!onInv) { if (existing) existing.remove(); return; }
    /* look for the actual inventory row, not the old TBD note, which also
       contains the words "Boiron lime" */
    /* Scan the tables only. Scanning the whole of #root would match this
       banner's own text and toggle it forever. */
    var tables = root.querySelectorAll("table"), scan = "";
    for (var i = 0; i < tables.length; i++) scan += tables[i].innerText.toLowerCase();
    /* Match both languages: the Dutch table says "Boiron limoenpuree", so an
       English-only test would fire this banner over a row that is right there. */
    if (scan.indexOf("lime puree") !== -1 || scan.indexOf("limoenpuree") !== -1) {
      if (existing) existing.remove();
      return;
    }
    if (existing) return;
    var d = document.createElement("div");
    d.id = "boiron-banner";
    d.className = "src-warn";
    d.style.margin = "0 0 18px";
    d.innerHTML = LANG === "nl"
      ? "<b>Er ontbreken twee regels in deze tabel.</b> Boiron limoenpuree, " +
        "<b>19,6 L per week</b>, Sligro 217504, en Boiron citroenpuree, <b>9,1 L per week</b>, " +
        "Sligro 217502. Elk drankje dat om limoen- of citroensap vraagt, schenkt hieruit en niet " +
        "uit met de hand geperst fruit, dus het overzicht komt ongeveer 29 liter per week tekort " +
        "en geen van beide heeft al een prijs. Voeg ze toe aan INV_ITEMS, dan verdwijnt deze melding."
      : "<b>Two lines are missing from this table.</b> Boiron lime puree, " +
        "<b>19.6 L a week</b>, Sligro 217504, and Boiron lemon puree, <b>9.1 L a week</b>, " +
        "Sligro 217502. Every drink that calls for lime or lemon juice pours these, not hand " +
        "squeezed fruit, so the sheet is short by about 29 litres a week and neither has a " +
        "price yet. Add them to INV_ITEMS, then this notice disappears.";
    root.insertBefore(d, root.firstChild);
  }
  new MutationObserver(invBanner).observe(document.getElementById("root") || document.body,
    { childList: true, subtree: true });
  invBanner();

          esc(nt) + "</div>" +
          /* In the item cell rather than a new column: the inventory table
             rebuilds itself as a stacked card on a phone, and the stack is
             keyed to the columns it already has. */
          dateCell("inv-" + r.id, "", { en: "Day dot", nl: "Dagsticker" }) +
          /* A list-backed input rather than a select: it offers the categories

          '<div class="iv-catf"><span class="iv-catl">' +
          et({ en: "Category", nl: "Categorie" }) + "</span>" +
          '<input class="iv-field iv-cat" list="iv-cats" data-cat="' + esc(r.id) + '" value="' +
          esc(catLabel(r.cat)) + '" aria-label="' +
          et({ en: "Category for this line", nl: "Categorie voor deze regel" }) + '">' +
          '<span class="iv-catl">' + et({ en: "Counted in", nl: "Geteld in" }) + "</span>" +
          '<input class="iv-field iv-unit" list="iv-units" data-unit="' + esc(r.id) + '" value="' +
          esc(unitLabel(r.unit)) + '" aria-label="' +
          et({ en: "Unit for this line", nl: "Eenheid voor deze regel" }) + '"></div></td>' +
        '<td class="num" data-l="' + esc(L.need) + '"><span class="iv-need" contenteditable="true" data-f="need">' +
          (need == null ? et(SETPAR) : tidy(need)) + "</span> " + esc(unitLabel(r.unit)) + "</td>" +
        '<td data-l="' + esc(L.have) + '"><input class="inv-qty" type="text" inputmode="decimal" autocomplete="off" data-id="' + esc(r.id) +
          '" value="' + (HAVE[r.id] != null ? esc(dec(HAVE[r.id])) : "") + '" aria-label="' + esc(nm) +
          '"><span class="inv-unit">' + esc(unitLabel(r.unit)) + "</span></td>" +
        '<td data-c="buy" data-l="' + esc(L.buy) + '" class="buy' + (short === 0 ? " ok" : "") + '">' +
          (need == null ? et(SETPAR)
            : short > 0 ? tidy(short) + " " + esc(unitLabel(r.unit))
            : et({ en: "covered", nl: "gedekt" })) + "</td>" +
        '<td data-c="cost" class="num" data-l="' + esc(L.cost) + '">' + (!priced ? '<span class="iv-tbd">' +
            et({ en: "price TBD", nl: "prijs volgt" }) + "</span>"
          : short > 0 ? n2(short * r.cost) : "-") + provenance(r) + "</td>" +
        '<td data-l="' + esc(L.where) + '">' + supTag(r) +
          '<button class="iv-del" type="button" data-del="' + esc(r.id) + '" title="' +
          et({ en: "Delete row", nl: "Regel verwijderen" }) + '">&times;</button></td>' +
        "</tr>";
      return { key: groupOf(r, cls), html: html, buyCost: (priced && short > 0) ? short * r.cost : 0 };
    });

    /* Rows come out of the map as objects so they can be grouped; a category
       band is only drawn if something under it survived the filter. */
    var groups = [], seen = {};
    body.forEach(function (x) {
      if (!x) return;
      if (!seen[x.key]) { seen[x.key] = { key: x.key, rows: [], buy: 0 }; groups.push(seen[x.key]); }
      seen[x.key].rows.push(x.html);
      seen[x.key].buy += x.buyCost;
    });
    var shown = 0;
    groups.forEach(function (g) { shown += g.rows.length; });
    var L = INVCOL();
    var catList = '<datalist id="iv-cats">' +
      catsInUse().map(function (c) { return '<option value="' + esc(c) + '"></option>'; }).join("") +
      '</datalist><datalist id="iv-units">' +
      UNITS.map(function (u) {
        return '<option value="' + esc(isNl() ? (UNIT_NL[u] || u) : u) + '"></option>';
      }).join("") + "</datalist>";
    var tbody = groups.map(function (g) {
      var n = g.rows.length, shut = !!IVFOLD[g.key];
      var nameCell = GROUPBY === "cat"
        ? '<span class="cat-nm" contenteditable="true" data-ren="' + esc(g.key) + '">' +
          esc(g.key) + "</span>"
        : '<span class="cat-nm plain">' + esc(g.key) + "</span>";
      return '<tr class="inv-cat' + (shut ? " shut" : "") + '" data-fold="' + esc(g.key) + '">' +
        '<td colspan="6"><span class="cat-tw"></span>' + nameCell +
        '<span class="cat-r">' + n + " " +
        tt(n === 1 ? { en: "line", nl: "regel" } : { en: "lines", nl: "regels" }) +
        (g.buy > 0 ? "  ·  " + n2(g.buy) + tt({ en: " to buy", nl: " te kopen" }) : "") +
        "</span></td></tr>" + (shut ? "" : g.rows.join(""));
    }).join("");

    var FILTERS = [
      ["all",     { en: "All",           nl: "Alles" }],
      ["short",   { en: "Still to buy",  nl: "Nog kopen" }],
      ["covered", { en: "Covered",       nl: "Gedekt" }],
      ["note",    { en: "Has a note",    nl: "Heeft een notitie" }]
    ];
    return '<section class="section"><div class="section-head"><div class="smallcaps">' +
      esc(ui("runsheet")) + "</div><h2>" + esc(ui("inventory")) + "</h2></div>" +
      '<h3 style="font-size:20px;margin-top:8px">' +
      et({ en: "Staff", nl: "Personeel" }) + "</h3>" +
      '<p class="legend">' +
      et({ en: "Every field on this page is editable. Click a name, a quantity or a note and type. Use Add row for anything new and the cross to delete. Everything saves to this browser and survives a reload.",
           nl: "Elk veld op deze pagina is aan te passen. Klik op een naam, een aantal of een notitie en typ. Gebruik Regel toevoegen voor iets nieuws en het kruisje om te verwijderen. Alles wordt in deze browser bewaard en blijft na herladen staan." }) + "</p>" +
      dayDotHTML() +
      '<div class="inv-filters"><span class="ivf"><span class="smallcaps">' +
      et({ en: "Show", nl: "Toon" }) + "</span>" +
      '<select id="iv-filter"' + (FILTER === "all" ? "" : ' class="on"') + ">" +
        FILTERS.map(function (o) {
          return '<option value="' + o[0] + '"' + (FILTER === o[0] ? " selected" : "") + ">" +
                 et(o[1]) + "</option>"; }).join("") +
        '<optgroup label="' + et({ en: "Buy at", nl: "Waar te koop" }) + '">' +
        suppliers().map(function (s) {
          var v = "sup:" + s;
          return '<option value="' + esc(v) + '"' + (FILTER === v ? " selected" : "") + ">" +
                 esc(s) + "</option>"; }).join("") + "</optgroup>" +
      "</select></span>" +
      '<span class="ivf ivf-g"><span class="smallcaps">' + et({ en: "Stack into", nl: "Stapel in" }) + "</span>" +
      '<select id="iv-group">' +
        [["cat", { en: "Category", nl: "Categorie" }],
         ["sup", { en: "Buy at", nl: "Waar te koop" }],
         ["status", { en: "Still to buy first", nl: "Nog kopen eerst" }]].map(function (o) {
          return '<option value="' + o[0] + '"' + (GROUPBY === o[0] ? " selected" : "") + ">" +
                 et(o[1]) + "</option>"; }).join("") +
      "</select></span>" +
      '<button type="button" id="iv-fold">' +
      et({ en: "Fold all", nl: "Alles inklappen" }) + "</button>" +
      '<button type="button" id="iv-add">' +
      et({ en: "Add row", nl: "Regel toevoegen" }) + "</button>" +
      '<button type="button" id="iv-reset">' +
      et({ en: "Reset to defaults", nl: "Terug naar standaard" }) + "</button>" +
      '<button type="button" id="iv-shops">' +
      et({ en: "Shops", nl: "Winkels" }) + "</button></div>" +
      /* The two controls looked alike and read alike, so it was not obvious
         which did what. This says, in a sentence, what each has just done. */
      '<p class="iv-state' + (FILTER === "all" ? "" : " on") + '">' +
      (FILTER === "all"
        ? et({ en: "Showing every line", nl: "Alle regels zichtbaar" })
        : et({ en: "Showing only ", nl: "Alleen " }) + "<b>" + esc(filterLabel()) + "</b>" +
          et({ en: " lines", nl: " regels zichtbaar" })) +
      ": <b>" + shown + "</b>" + et({ en: " of ", nl: " van de " }) + ROWS.length +
      et({ en: ", stacked into ", nl: ", gestapeld in " }) + "<b>" + groups.length + "</b> " +
      et({ en: "groups by ", nl: "groepen op " }) + esc(groupLabel()) + "." +
      (FILTER === "all" ? "" :
        ' <button type="button" class="iv-clear" id="iv-all">' +
        et({ en: "Show every line", nl: "Toon alle regels" }) + "</button>") + "</p>" +
      (unpriced ? '<div class="src-warn" style="margin:0 0 14px"><b>' +
        (isNl() ? (unpriced === 1 ? "1 regel heeft nog geen prijs." : unpriced + " regels hebben nog geen prijs.")
                : (unpriced === 1 ? "1 line has no price yet." : unpriced + " lines have no price yet.")) + "</b> " +
        et({ en: "They are counted in the quantities but not in the money below.",
             nl: "Ze tellen mee in de aantallen, maar niet in de bedragen hieronder." }) + "</div>" : "") +
      '<div class="tablewrap"><table class="inv-t"><thead><tr>' +
      "<th>" + esc(L.item) + "</th>" +
      '<th class="num">' + esc(L.need) + "</th>" +
      "<th>" + esc(L.have) + "</th>" +
      "<th>" + esc(L.buy) + "</th>" +
      '<th class="num" title="' + et({ en: "What the missing quantity will cost to order",
                                       nl: "Wat het ontbrekende aantal kost om te bestellen" }) + '">' +
      esc(L.cost) + "</th>" +
      "<th>" + esc(L.where) + "</th>" +
      "</tr></thead><tbody>" + tbody + "</tbody></table></div>" + catList +
      '<div class="inv-sum"><div><dt>' +
      et({ en: "A full week, if you held nothing", nl: "Een hele week, als je niets had" }) +
      "</dt><dd>" + n2(totNeed) + "</dd></div>" +
      "<div><dt>" + et({ en: "Worth of what you already have", nl: "Waarde van wat je al hebt" }) +
      "</dt><dd>" + n2(totHave) + "</dd></div>" +
      "<div><dt>" + et({ en: "What this week's order costs", nl: "Wat de bestelling van deze week kost" }) +
      '</dt><dd class="hi">' + n2(totBuy) + "</dd></div></div>" +
      '<p class="legend">' +
      et({ en: "The last figure is the one to act on: it is the cost of everything still short. Lines marked price TBD are counted in quantity but not in money, so the true order is higher until the two Boiron purees are priced.",
           nl: "Het laatste bedrag is waar je op stuurt: dat is de kostprijs van alles wat nog tekort is. Regels met prijs volgt tellen wel mee in aantal maar niet in geld, dus de echte bestelling valt hoger uit tot de twee Boiron-purees een prijs hebben." }) + "</p>" +
      salesHTML() +
      (typeof ownerBlockHTML === "function" ? ownerBlockHTML() : "") +
      "</section>";
  }

  /* A full re-render is fine for structural changes, but it must not throw the
     reader back to the top of a long table. */
  function invRender() {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if (document.getElementById("root")) render();
    window.scrollTo(0, y);
  }

  /* Typing a stock count repaints only the cells that actually changed. No
     re-render, so the page does not jump and the caret stays where it is. */
  function refreshRow(id) {
    var tr = document.querySelector('tr[data-id="' + id + '"]');
    var r = ROWS.filter(function (x) { return x.id === id; })[0];
    if (!tr || !r) return;
    var c = calcRow(r);
    /* Assigning c.cls alone wiped inv-r off the row, and with it every rule
       that lays the row out. Harmless-looking on a wide screen, where the
       table still had columns to fall back on; on a phone the row collapsed
       the moment you typed a count into it. */
    tr.className = "inv-r " + c.cls + (IVOPEN[id] ? " open" : "");

    var bar = tr.querySelector(".bar"), lbl = tr.querySelector(".barlbl");
    if (bar) {
      bar.className = "bar " + (c.pct >= 100 ? "" : c.pct > 0 ? "part" : "none");
      if (bar.firstChild) bar.firstChild.style.width = c.pct + "%";
    }
    if (lbl) lbl.textContent = tidy(c.have) + " / " + tidy(c.need) + " " +
      unitLabel(r.unit) + "  (" + c.pct + "%)";

    var buy = tr.querySelector('[data-c="buy"]');
    if (buy) {
      buy.className = "buy" + (c.short === 0 ? " ok" : "");
      buy.textContent = c.need == null ? tt(SETPAR)
        : c.short > 0 ? tidy(c.short) + " " + unitLabel(r.unit)
        : tt({ en: "covered", nl: "gedekt" });
    }
    var cost = tr.querySelector('[data-c="cost"]');
    if (cost) {
      cost.innerHTML = !c.priced
        ? '<span class="iv-tbd">' + et({ en: "price TBD", nl: "prijs volgt" }) + "</span>"
        : c.short > 0 ? n2(c.short * r.cost) : "-";
    }
    refreshTotals();
  }
  function refreshTotals() {
    var t = invTotals(), dd = document.querySelectorAll(".inv-sum dd");
    if (dd.length >= 3) {
      dd[0].textContent = n2(t.need);
      dd[1].textContent = n2(t.have);
      dd[2].textContent = n2(t.buy);
    }
  }

  document.addEventListener("input", function (e) {
    var q = e.target.closest && e.target.closest(".inv-qty[data-id]");
    if (!q) return;
    HAVE[q.dataset.id] = parseQty(q.value);
    persist();
    refreshRow(q.dataset.id);
  });
  document.addEventListener("change", function (e) {
    var sel = e.target.closest && e.target.closest("[data-sup]");
    if (sel) {
      var row = ROWS.filter(function (r) { return r.id === sel.dataset.sup; })[0];
      if (!row) return;
      var pick = sel.value;
      if (pick === "__add") {
        var name = window.prompt(tt({ en: "Name of the shop, for example Sligro or AH",
                                      nl: "Naam van de winkel, bijvoorbeeld Sligro of AH" }));
        pick = addSup(name);
        if (!pick) { invRender(); return; }          /* cancelled, put the select back */
      }
      row.supplier = pick;
      var pe = rowEntry(row);
      if (pe) row.cost = costIn(pe, row.unit);
      persist(); invRender();
      return;
    }
    if (e.target.id === "iv-filter") { FILTER = e.target.value; invRender(); return; }
    var uf = e.target.closest && e.target.closest("[data-unit]");
    if (uf) {
      var urow = ROWS.filter(function (x) { return x.id === uf.dataset.unit; })[0];
      var uv = String(uf.value || "").trim();
      if (urow && uv && uv !== unitLabel(urow.unit)) {
        /* Stored as typed. Nothing is converted: the figures stay as they
           are and only their label changes, which is the honest behaviour
           when nobody has told us how many litres are in a crate. */
        urow.unit = uv;
        persist();
        var y2 = window.scrollY || 0;
        invRender();
        window.scrollTo(0, y2);
      }
      return;
    }
    var cf = e.target.closest && e.target.closest("[data-cat]");
    if (cf) {
      var row = ROWS.filter(function (x) { return x.id === cf.dataset.cat; })[0];
      var v = String(cf.value || "").trim();
      if (row && v && v !== catLabel(row.cat)) {
        row.cat = v;
        persist();
        var y0 = window.scrollY || 0;
        invRender();
        window.scrollTo(0, y0);
      }
      return;
    }
    if (e.target.id === "iv-group") {
      GROUPBY = e.target.value;
      IVFOLD = {};          /* fold keys from the old grouping mean nothing now */
      invRender(); return;
    }
    var q = e.target.closest && e.target.closest(".inv-qty[data-id]");
    /* Only once the field is committed can a row legitimately drop out of a
       filtered view. Doing that mid-keystroke would pull the row away as you
       type in it. */
    if (q && (FILTER === "short" || FILTER === "covered" || FILTER === "note")) invRender();
  });
  /* Renaming the band renames the category, which means moving every row
     filed under it. Committed on blur, like the other editable fields. */
  document.addEventListener("blur", function (e) {
    var el = e.target;
    if (!el || !el.dataset || !el.dataset.ren) return;
    var was = el.dataset.ren, now = el.textContent.trim();
    if (!now || now === was) { el.textContent = was; return; }
    var moved = 0;
    ROWS.forEach(function (r) {
      if (catLabel(r.cat) === was) { r.cat = now; moved++; }
    });
    if (!moved) { el.textContent = was; return; }
    persist();
    if (IVFOLD[was]) { IVFOLD[now] = true; delete IVFOLD[was]; }
    var y1 = window.scrollY || 0;
    invRender();
    window.scrollTo(0, y1);
  }, true);

  document.addEventListener("click", function (e) {
    /* Typing in the band name must not fold the group under the caret. */
    if (e.target.closest && e.target.closest(".cat-nm")) return;
    var m = e.target.closest && e.target.closest("[data-more]");
    if (m) {
      var id = m.dataset.more;
      IVOPEN[id] = !IVOPEN[id];
      /* Toggled in place. A full redraw here would scroll the row you just
         tapped off the screen, which is the thing being complained about. */
      var tr = m.closest("tr");
      if (tr) tr.classList.toggle("open", !!IVOPEN[id]);
      m.setAttribute("aria-expanded", IVOPEN[id] ? "true" : "false");
      return;
    }
    var f = e.target.closest && e.target.closest("[data-fold]");
    if (f) {
      var k = f.dataset.fold;
      IVFOLD[k] = !IVFOLD[k];
      var y = window.scrollY || 0;
      invRender();
      window.scrollTo(0, y);
      return;
    }
    if (e.target.id === "iv-all") { FILTER = "all"; invRender(); return; }
    if (e.target.id === "iv-fold") {
      var heads = document.querySelectorAll("#root .inv-cat[data-fold]");
      var anyOpen = false, i;
      for (i = 0; i < heads.length; i++) if (!heads[i].classList.contains("shut")) anyOpen = true;
      IVFOLD = {};
      if (anyOpen) for (i = 0; i < heads.length; i++) IVFOLD[heads[i].dataset.fold] = true;
      invRender();
      return;
    }
  });

  document.addEventListener("blur", function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.f) return;
    var tr = el.closest("tr"); if (!tr) return;
    var row = ROWS.filter(function (r) { return r.id === tr.dataset.id; })[0]; if (!row) return;
    var val = el.textContent.trim();
    /* Re-render only on a real change. Blurring a field you merely looked at
       should not rebuild the table under the reader. */
    if (el.dataset.f === "need") {
      var nv = isSetPar(val) ? null : parseQty(val);
      if (nv === undefined) nv = row.need;
      if (nv === row.need) return;
      row.need = nv;
    } else if (el.dataset.f === "name") {
      if (!val) return;
      if (isNl()) { if (val === row.nameNl) return; row.nameNl = val; }
      else { if (val === row.name) return; row.name = val; }
    } else if (el.dataset.f === "note") {
      if (isNl()) { if (val === (row.noteNl || "")) return; row.noteNl = val; }
      else { if (val === (row.note || "")) return; row.note = val; }
    }
    persist(); invRender();
  }, true);
  document.addEventListener("click", function (e) {
    var d = e.target.closest && e.target.closest("[data-del]");
    if (d) { var dr = ROWS.filter(function (r) { return r.id === d.dataset.del; })[0];
             var nm = dr ? rowName(dr) : tt({ en: "this row", nl: "deze regel" });
             if (window.confirm(tt({ en: "Delete ", nl: "Verwijder " }) + nm + "?")) {
               ROWS = ROWS.filter(function (r) { return r.id !== d.dataset.del; }); persist(); invRender(); }
             return; }
    if (e.target.id === "iv-add") {
      var name = window.prompt(tt({ en: "Name of the new item", nl: "Naam van het nieuwe item" }));
      if (!name) return;
      var cat = window.prompt(tt({ en: "Category", nl: "Categorie" }),
                              tt({ en: "Liquids", nl: "Vloeistoffen" })) ||
                tt({ en: "Uncategorised", nl: "Zonder categorie" });
      var unit = window.prompt(tt({ en: "Unit, for example L, kg, g, pcs, bottle",
                                    nl: "Eenheid, bijvoorbeeld L, kg, g, st, fles" }), "L") || "L";
      /* A row typed in by hand has one name, and it shows in both languages
         until someone edits it while the other language is on screen. */
      var where = window.prompt(tt({ en: "Buy at, for example AH, AO, JUMBO, Sligro",
                                     nl: "Waar te koop, bijvoorbeeld AH, AO, JUMBO, Sligro" }), "TBD") || "TBD";
      ROWS.push({ id:slug(name) || ("u" + Date.now()), key:name, cat:cat, name:name, nameNl:name,
                  supplier:where, need:null, unit:unit, cost:null, note:"", noteNl:"", prep:false });
      persist(); invRender(); return;
    }
    if (e.target.id === "iv-shops") {
      /* Add a shop, or drop one that nothing is bought from any more. */
      var list = supList();
      var inUse = {};
      ROWS.forEach(function (r) { inUse[r.supplier || "TBD"] = (inUse[r.supplier || "TBD"] || 0) + 1; });
      var lines = list.map(function (s) {
        return s + " (" + (inUse[s] || 0) + ")";
      }).join("\n");
      var ans = window.prompt(
        tt({ en: "Shops, with how many lines use each:\n\n", nl: "Winkels, met hoeveel regels elk gebruikt:\n\n" }) +
        lines +
        tt({ en: "\n\nType a name to ADD it, or type  -Name  to remove one that nothing uses.",
             nl: "\n\nTyp een naam om die TOE TE VOEGEN, of typ  -Naam  om er een te verwijderen die nergens gebruikt wordt." }), "");
      if (!ans) return;
      ans = ans.trim();
      if (ans.charAt(0) === "-") {
        var kill = ans.slice(1).trim();
        var hit = list.filter(function (s) { return s.toLowerCase() === kill.toLowerCase(); })[0];
        if (!hit) { window.alert(tt({ en: "No shop by that name.", nl: "Geen winkel met die naam." })); return; }
        if (inUse[hit]) {
          window.alert(tt({ en: "Cannot remove " + hit + ", " + inUse[hit] + " line(s) still buy from it. Move them first.",
                            nl: "Kan " + hit + " niet verwijderen, " + inUse[hit] + " regel(s) kopen daar nog. Verplaats die eerst." }));
          return;
        }
        SUPS = list.filter(function (s) { return s !== hit; });
        save(LS_SUPS, SUPS); invRender(); return;
      }
      addSup(ans); invRender(); return;
    }
    if (e.target.id === "iv-reset") {
      if (window.confirm(tt({ en: "Reset every row and every stock count back to the defaults?",
                              nl: "Alle regels en alle voorraadtellingen terugzetten naar de standaard?" }))) {
        ROWS = SEED.slice(); HAVE = {}; persist(); invRender(); }
      return;
    }
  });

  if (typeof TABS !== "undefined" && TABS) TABS.inventory = invHTML;

  function tt(v) {
    if (v && typeof v === "object") return v[LANG] != null ? v[LANG] : (v.en != null ? v.en : "");

  function et(v) { return esc(tt(v)); }

      '" data-ph="' + et(ph || { en: "Type here. It saves in this browser.",
                                nl: "Typ hier. Het wordt in deze browser bewaard." }) + '">' + esc(v) + "</div></div>";
  }

    var el = e.target;

    el.classList.toggle("empty", !el.textContent.trim());
  }, true);

  /* How long a keeps line actually is, read off the English text so the maths
     does not change with the language on screen. */
  function keepsDays(keeps) {
    var s = String((keeps && keeps.en) || keeps || "").toLowerCase();
    var m = s.match(/\d+/);
    if (!m) return null;
    var n = parseInt(m[0], 10);
    if (isNaN(n)) return null;
    if (/hour|hr\b|uur/.test(s))  return n / 24;
    if (/month|maand/.test(s))     return n * 30;
    if (/week|weken/.test(s))      return n * 7;
    return n;
  }

  /* When each batch was made, kept in this browser, keyed by the row's own id
     so adding or dropping a prep line never shifts anyone else's date. */
  var LS_MADE = "quatro-prep-made-v1";
  var MADE = load(LS_MADE, {});

  function useBy(madeStr, keeps) {
    var d = String(madeStr || "").replace(/\D/g, "");
    if (d.length !== 6 && d.length !== 8) return null;
    var day = +d.slice(0, 2), mon = +d.slice(2, 4);
    var yr = d.length === 6 ? 2000 + +d.slice(4, 6) : +d.slice(4, 8);
    var made = new Date(yr, mon - 1, day);
    if (made.getDate() !== day || made.getMonth() !== mon - 1) return false;
    var days = keepsDays(keeps);
    if (days == null) return { made: made, exp: null };
    var exp = new Date(made.getTime() + days * 86400000);
    return { made: made, exp: exp };
  }
  /* The use-by is shown in the same weekday-then-date shape that goes on the
     tape, so the screen and the label read identically. */
  function dotOf(d) {
    var p2 = function (n) { return ("0" + n).slice(-2); };
    return (isNl() ? DD_NL : DD_EN)[(d.getDay() + 6) % 7] + " " +
      p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + String(d.getFullYear()).slice(-2);
  }
  /* The readout for one dated container. Shared by the Prep table, the Rail
     slots, the Inventory rows and the ingredient cards, so every place that
     shows a day dot shows the same thing and reads from the same store.
     The keep window travels on the element rather than being looked up in
     PREP2, because three of the four callers are not prep rows. */
  function mkText(v, keeps, verb) {
    var r = useBy(v, keeps), txt = "", cls = "mk-out";
    if (r === false) { txt = tt({ en: "not a date", nl: "geen datum" }); cls += " bad"; }
    else if (r && r.exp) {
      var left = (r.exp - new Date()) / 86400000;
      cls += left < 0 ? " due" : left < 1 ? " warn" : " ok";
      txt = (left < 0 ? tt({ en: "PAST DATE, bin it. Was due ", nl: "OVER DATUM, weggooien. Was THT " })
                      : tt({ en: "Use by ", nl: "THT " })) + dotOf(r.exp);
    } else if (r) {
      /* No keep window on file, and for a rail bottle or a bought-in line
         there never will be. Saying so on every one of them told you nothing
         you could act on. Say how long it has been open instead, which is the
         question you are actually asking when you pick the bottle up. */
      var days = Math.floor((new Date() - r.made) / 86400000);
      txt = tt(verb === "made" ? { en: "Made ", nl: "Gemaakt " } : { en: "Opened ", nl: "Geopend " }) +
        dotOf(r.made) +
        (days <= 0 ? tt({ en: ", today", nl: ", vandaag" })
         : days === 1 ? tt({ en: ", yesterday", nl: ", gisteren" })
         : tt({ en: ", ", nl: ", " }) + days + tt({ en: " days ago", nl: " dagen geleden" }));
      cls += days >= 7 ? " warn" : " ok";
    }
    else { txt = tt({ en: "no date on this yet", nl: "hier staat nog geen datum op" }); cls += " none"; }
    return { txt: txt, cls: cls };
  }

  function todayDot() {
    var d = new Date(), p2 = function (n) { return ("0" + n).slice(-2); };
    return p2(d.getDate()) + p2(d.getMonth() + 1) + String(d.getFullYear()).slice(-2);
  }

  function dateCell(id, keeps, label, verb) {
    var v = MADE[id] || "", r = mkText(v, keeps, verb);
    return '<div class="mk">' +
      (label ? '<span class="mk-lbl">' + et(label) + "</span>" : "") +
      '<input class="mk-in" type="text" inputmode="numeric" maxlength="10" autocomplete="off" ' +
      'data-made="' + esc(id) + '" data-keeps="' + esc(tt(keeps) || "") + '" value="' + esc(v) + '" ' +
      'data-verb="' + esc(verb || "opened") + '" ' +
      'placeholder="DDMMYY" aria-label="' + et({ en: "Date opened or made", nl: "Datum geopend of gemaakt" }) + '">' +
      '<button class="mk-now" type="button" data-today="' + esc(id) + '">' +
      et({ en: "Today", nl: "Vandaag" }) + "</button>" +
      '<span class="' + r.cls + '">' + esc(r.txt) + "</span></div>";
  }

  function madeCell(id, keeps) { return dateCell(id, keeps, null, "made"); }

  function paintMk(i) {
    var wrap = i.parentNode, out = wrap && wrap.querySelector(".mk-out");
    if (!out) return;
    var r = mkText(i.value, i.dataset.keeps, i.dataset.verb);
    out.className = r.cls; out.textContent = r.txt;
  }

  document.addEventListener("input", function (e) {
    var i = e.target.closest && e.target.closest("[data-made]");
    if (!i) return;
    MADE[i.dataset.made] = i.value;
    save(LS_MADE, MADE);
    /* Repaint only this cell's readout, so the caret stays put. */
    paintMk(i);
  });

  document.addEventListener("click", function (e) {

  function bkPage(d) {
    var h = '<div class="bk-page"><div class="bk-head">' +
      '<h2><span class="bk-sw" style="background:' + d.sw + '"></span>' + esc(d.name) + "</h2>" +
      '<div class="bk-spec">' + esc(t(d.spec)) + "</div>" +
      '<div class="bk-house">' + esc(t(HEADSPACE)) + "</div></div>";
    h += '<div class="bk-blocks">' + d.b.map(function (r) {
      return '<div class="bk-b"><span class="bk-k">' + esc(t(r[0])) + "</span>" +
             '<span class="bk-v">' + esc(t(r[1])) + "</span></div>";
    }).join("") + "</div>";
    if (d.tbl) h += '<div class="bk-tbl"><span class="bk-k">' +
      (LANG === "nl" ? "Aan tafel" : "At the table") + "</span><ol>" +
      t(d.tbl).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
    if (d.say) h += '<p class="bk-say"><b>' + (LANG === "nl" ? "Zeg dit." : "Say.") + "</b> " + esc(t(d.say)) + "</p>";
    if (d.flag) h += '<p class="bk-flag">' + esc(t(d.flag)) + "</p>";
    h += '<div class="bk-notes"><span class="bk-k">' + (LANG === "nl" ? "Mijn aantekeningen" : "My notes") + "</span>" +
      '<div class="bk-rule"></div><div class="bk-rule"></div><div class="bk-rule"></div><div class="bk-rule"></div></div>';
    return h + "</div>";
  }
  window.bookletHTML = function () { return BK.map(bkPage).join(""); };

  /* The entry a row actually buys: the one at the row's own supplier if that
     shop stocks it, otherwise whoever does. */
  function rowEntry(r) {
    var key = ROW_PRICE[r.key];
    if (!key) return null;
    var alts = alternatives(key, r.unit);
    if (!alts.length) return null;
    var mine = alts.filter(function (a) { return a.e.sup === r.supplier; })[0];
    return (mine || alts[0]).e;
  }
  /* The price book is the source of truth wherever it has a line, so every
     number on the Inventory tab can be traced back to a pack and a shop.
     On the seed it also sets the supplier. On saved rows it does not: someone
     may have changed where a line is bought, and that choice decides the
     price, not the other way round. */
  function applyPrices() {
    SEED.forEach(function (row) {
      var e = rowEntry(row);
      if (e) { row.supplier = e.sup; row.cost = costIn(e, row.unit); }
    });
    ROWS.forEach(function (row) {
      var e = rowEntry(row);
      if (e) row.cost = costIn(e, row.unit);
    });
  }

  function rowCheaper(r) {
    var key = ROW_PRICE[r.key];
    if (!key) return null;
    var alts = alternatives(key, r.unit);
    if (alts.length < 2) return null;
    var used = rowEntry(r), best = alts[0].e;
    if (!used || best.id === used.id) return null;
    var uc = costIn(used, r.unit), bc = alts[0].c;
    if (bc >= uc) return null;
    /* Judge the swap on what it saves in a week, not on the per-unit gap. A
       tenth of a cent a gram is noise on 60 g of thyme and real money on 450 g
       of mint. */
    var week = (uc - bc) * (r.need == null ? 0 : Number(r.need));
    return week >= 0.25 ? { e: best, c: bc, week: week } : null;
  }

  /* Convert a price book entry into the unit the inventory row counts in.
     Base units are ml, g and pcs; a row counting in L or kg scales by 1000.
     Anything that cannot be converted, litres against grams say, returns null
     rather than a number that looks right and is not. */
  function unitBase(u) {
    if (u === "L") return { b: "ml", f: 1000 };
    if (u === "kg") return { b: "g", f: 1000 };
    if (u === "g") return { b: "g", f: 1 };
    if (u === "ml") return { b: "ml", f: 1 };
    return { b: "pcs", f: 1 };          /* pcs, cans, bottles, jars, packs, sets */
  }
  function costIn(entry, unit) {
    if (!entry) return null;
    var t = unitBase(unit);
    if (entry.u !== t.b) return null;
    return entry.price / entry.qty * t.f;
  }
  /* Every entry that sells the same thing, cheapest per unit first. */
  function alternatives(matchKey, unit) {
    return PRICEBOOK
      .filter(function (e) { return e.m === matchKey && !e.kit && costIn(e, unit) != null; })
      .map(function (e) { return { e: e, c: costIn(e, unit) }; })
      .sort(function (a, b) { return a.c - b.c; });
  }

  var LS_CMT = "quatro-comments-v1";

  function cmtHash(s) {
    var h = 5381, i;
    s = String(s || "").replace(/\s+/g, " ").trim().slice(0, 200);
    for (i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "a" + (h >>> 0).toString(36);
  }
  var CMT_SEL = "tr, .ops-c, .build, .bk-page, .panel, .warn, .flag, .qflag, " +
                ".section-head, .rcpt, .inv-sum, .src-warn, .card, li";

    var root = cmtRoot();
    if (!root || !el.closest) return null;
    var hit = el.closest(CMT_SEL);
    if (hit && root.contains(hit) && cmtLabel(hit)) return hit;
    var sec = el.closest(".section");
    return (sec && root.contains(sec)) ? sec : null;

    if (typeof MODE !== "undefined" && MODE === "menu") return tt({ en: "Menu", nl: "Menu" });

  function cmtLabel(el) {

  }
