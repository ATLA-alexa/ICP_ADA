          '<div class="cp-t">' + esc(c.text) + "</div>" +
          '<div class="cp-m">' + esc(c.when) +
          '<button type="button" class="cc-x" data-cmtdel="' + esc(c.k) + '" title="' +
          et({ en: "Delete", nl: "Verwijderen" }) + '">&times;</button></div></div>';
      }).join("") + "</div>";
    }).join("");
  }
  function cmtAsText() {
    var out = "QUATRO " + tt({ en: "comments", nl: "opmerkingen" }) + ", " + cmtStamp() +
      " (" + CMT.length + ")\n";
    var g = cmtGroup();
    g.order.forEach(function (w) {
      out += "\n## " + w + "\n";
      g.by[w].forEach(function (c) {
        out += '\n- on "' + c.label + '"\n  -> ' + c.text + "\n";
      });
    });
    return out;
  }
  function cmtRenderPanel() {
    var p = document.getElementById("cmt-panel");
    if (p) {
      var b = p.querySelector(".cp-body");
      if (b) b.innerHTML = cmtPanelHTML();
    }
    var n = document.getElementById("cmt-n");
    if (n) { n.textContent = CMT.length; n.style.display = CMT.length ? "" : "none"; }
    cmtMark();
  }

  /* A mark on every block that carries a note, so it can be found again. */
  function cmtMark() {
    var root = cmtRoot();
    if (!root) return;
    Array.prototype.slice.call(root.querySelectorAll(".has-cmt")).forEach(function (e) {
      e.classList.remove("has-cmt"); e.removeAttribute("data-cmt-n");
    });
    if (!CMT.length) return;
    var want = {};
    CMT.forEach(function (c) { want[c.id] = (want[c.id] || 0) + 1; });
    Array.prototype.slice.call(root.querySelectorAll(CMT_SEL + ", .section")).forEach(function (el) {
      var h = cmtHash(cmtLabel(el));
      if (want[h] && !el.querySelector(".has-cmt")) {
        el.classList.add("has-cmt");
        el.setAttribute("data-cmt-n", want[h]);
      }
    });
  }

  function cmtLabels() {
    var f = document.querySelector("#cmt-fab .cf-l");
    if (f) f.textContent = tt(CMTMODE ? { en: "Commenting", nl: "Opmerkingen aan" }
                                      : { en: "Comment", nl: "Opmerking" });
    var t = document.querySelector("#cmt-panel .cp-title");
    if (t) t.textContent = tt({ en: "Comments", nl: "Opmerkingen" });
    var m = { "cmt-copy":  { en: "Copy all",  nl: "Alles kopieren" },
              "cmt-dl":    { en: "Download",  nl: "Downloaden" },
              "cmt-clear": { en: "Clear all", nl: "Alles wissen" } };
    Object.keys(m).forEach(function (k) {
      var b = document.getElementById(k); if (b) b.textContent = tt(m[k]);
    });
    var fab = document.getElementById("cmt-fab");
    if (fab) fab.title = tt({ en: "Click anything on the page to leave a note on it.",
                              nl: "Klik ergens op de pagina om er een opmerking bij te zetten." });
  }

  /* The top bar is sticky and its height changes with the tab row and with
     wrapping, so the panel is told where to start rather than guessing. */
  function cmtFit() {
    var panel = document.getElementById("cmt-panel");
    var head = document.querySelector(".topbar");
    if (!panel || !head) return;
    var h = Math.round(head.getBoundingClientRect().bottom);
    panel.style.top = Math.max(0, h) + "px";
  }
  window.addEventListener("resize", cmtFit, false);
  window.addEventListener("scroll", cmtFit, true);

  function cmtUI() {
    if (!document.getElementById("cmt-fab")) {
      var fab = document.createElement("button");
      fab.id = "cmt-fab"; fab.type = "button";
      fab.setAttribute("aria-pressed", "false");
      fab.innerHTML = '<span class="cf-i">&#9998;</span><span class="cf-l"></span>' +
        '<span id="cmt-n" class="cf-n"></span>';
      document.body.appendChild(fab);
    }
    if (!document.getElementById("cmt-panel")) {
      var panel = document.createElement("div");
      panel.id = "cmt-panel";
      panel.innerHTML = '<div class="cp-h"><b class="cp-title"></b>' +
        '<button type="button" id="cmt-close" aria-label="Close">&times;</button></div>' +
        '<div class="cp-body"></div>' +
        '<div class="cp-f"><button type="button" id="cmt-copy"></button>' +
        '<button type="button" id="cmt-dl"></button>' +
        '<button type="button" id="cmt-clear"></button></div>';
      document.body.appendChild(panel);
      /* Inside the artifact viewer a page cannot hand the viewer a file, so the
         download button would be a button that does nothing. Copy all works
         everywhere, and download comes back in the downloaded file. */
      var framed = true;
      try { framed = (window.self !== window.top); } catch (e) { framed = true; }
      if (framed) {
        var dl = document.getElementById("cmt-dl");
        if (dl) dl.style.display = "none";
      }
    }
  }

  function cmtCopy(btn) {
    var txt = cmtAsText();
    var done = function () {
      btn.textContent = tt({ en: "Copied", nl: "Gekopieerd" });
      setTimeout(cmtLabels, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (err) {}
      document.body.removeChild(ta); done();
    }
  }

  /* ---- wiring: the comment layer's own controls ---- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.closest) return;

    if (t.closest("#cmt-fab")) {
      CMTMODE = !CMTMODE;
      document.body.classList.toggle("cmt-on", CMTMODE);
      var fab = document.getElementById("cmt-fab");
      if (fab) fab.setAttribute("aria-pressed", String(CMTMODE));
      var p = document.getElementById("cmt-panel");
      if (p) p.classList.toggle("open", CMTMODE);
      if (!CMTMODE) cmtCloseCompose();
      cmtLabels(); cmtRenderPanel(); cmtFit();
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (t.closest("#cmt-close")) {
      var p2 = document.getElementById("cmt-panel");
      if (p2) p2.classList.remove("open");
      e.preventDefault(); e.stopPropagation();
      return;
    }
    var del = t.closest("[data-cmtdel]");
    if (del) {
      CMT = CMT.filter(function (c) { return c.k !== del.dataset.cmtdel; });
      cmtSave(); cmtRenderPanel();
      if (CMTOPEN && CMTOPEN.el) cmtCompose(CMTOPEN.el);
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (t.closest("#cc-cancel")) {
      cmtCloseCompose(); e.preventDefault(); e.stopPropagation(); return;
    }
    if (t.closest("#cc-save")) {
      var ta = document.getElementById("cc-t");
      var txt = ta ? ta.value.trim() : "";
      if (txt && CMTOPEN) {
        CMT.push({ k: "c" + Date.now() + Math.random().toString(36).slice(2, 6),
                   id: CMTOPEN.id, label: CMTOPEN.label, where: CMTOPEN.where,
                   text: txt, when: cmtStamp() });
        cmtSave();
      }
      cmtCloseCompose(); cmtRenderPanel();
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (t.closest("#cmt-copy")) {
      cmtCopy(t.closest("#cmt-copy")); e.preventDefault(); e.stopPropagation(); return;
    }
    if (t.closest("#cmt-dl")) {
      var blob = new Blob([cmtAsText()], { type: "text/plain;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "quatro-comments-" + cmtStamp().replace(/\./g, "") + ".txt";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (t.closest("#cmt-clear")) {
      if (CMT.length && window.confirm(tt({
            en: "Delete all " + CMT.length + " comments? This cannot be undone.",
            nl: "Alle " + CMT.length + " opmerkingen verwijderen? Dit kan niet terug." }))) {
        CMT = []; cmtSave(); cmtCloseCompose(); cmtRenderPanel();
      }
      e.preventDefault(); e.stopPropagation();
      return;
    }
  }, false);

  /* In comment mode a click in the content picks a block to annotate instead of
     doing what it normally would. The top bar and the tabs stay live, so the
     whole file can still be walked through while commenting. */
  document.addEventListener("click", function (e) {
    if (!CMTMODE) return;
    var t = e.target;
    if (!t.closest) return;
    if (t.closest("#cmt-fab") || t.closest("#cmt-panel") ||
        t.closest("#cmt-compose") || t.closest(".topbar") || t.closest(".sheet")) return;
    var root = cmtRoot();
    if (!root || !root.contains(t)) return;
    var block = cmtBlock(t);
    if (!block) return;
    e.preventDefault(); e.stopPropagation();
    cmtCompose(block);
  }, true);

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (CMTOPEN) { cmtCloseCompose(); return; }
    if (CMTMODE) {
      var fab = document.getElementById("cmt-fab");
      if (fab) fab.click();
    }
  }, false);

  /* Keep the marks, the count and the panel right across every re-render and
     every language switch, without touching the app's own render code. */
  (function () {
    var r = window.render;
    if (typeof r !== "function") return;
    window.render = function () {
      var out = r.apply(this, arguments);
      try {
        /* renderChrome assigns body.className outright, so the mode class has
           to be put back after every draw or comment mode dies on a tab or
           language change. */
        document.body.classList.toggle("cmt-on", CMTMODE);
        labelWide();
        cmtUI(); cmtLabels(); cmtRenderPanel(); cmtFit();
      } catch (err) {}
      return out;
    };
  })();

  /* ---------------- 10. at a glance: glass, kit, build to scale ----------------
     Tap a drink on the menu and see the build drawn from the build list
     itself, so the picture cannot drift away from the numbers on the
     Builds tab. Order runs bottom to top: first in the build, first in
     the glass. */
(function () {
  "use strict";

  /* Ingredient colours, only for drawing. Nothing reads these as data. */
  var GCOL = {
    lychee: "#E8C2CF", lycheecordial: "#E3B9C8", lycheelime: "#D9B6B0",
    coconutw: "#F6F1E4", bptcoconut: "#4C4C9D", peatea: "#4C4C9D",
    lime: "#8FBF5A", lemon: "#E4D35C", orange: "#E8791D", cranberry: "#9E1F3A",
    hibiscus: "#9E2B3B", strawpuree: "#D4566A", passionjuice: "#E8A020",
    passionpuree: "#E09018", applepear: "#D7DE92", cloudyapple: "#DCDFA8",
    pineapple: "#E8C84A", coconutcream: "#FBF7EC", cocolopez: "#F8F0DC",
    cassis: "#4A1E3C", mintsyrup: "#8CC06E", simple: "#F2EDE2",
    vanilla: "#E4D9BF", grenadine: "#B3123A", gingerbeer: "#D9A441",
    soda: "#EAF4F8", sparklemon: "#EEF3DC", cordial: "#8A6134",
    matcha: "#7A9A5B", milk: "#FFFFFF", ice: "#E8F4F8"
  };

  /* What each drink takes off the back bar. Written out per drink rather
     than guessed from the method line, because the method line does not
     know about the torch, the brute or the zester. */
  var KIT = {
    "lychee-siren": { en: ["Boston tins", "Muddler", "Hawthorne strainer", "Jigger", "Crushed ice scoop", "Brute for the tray"],
                      nl: ["Boston tins", "Muddler", "Hawthorne-zeef", "Jigger", "Schep voor crushed ice", "Brute voor het blad"] },
    "forest-fairy": { en: ["Mixing glass", "Bar spoon", "Hawthorne strainer", "Jigger", "Blowtorch", "Crushed ice scoop", "Rim bowl"],
                      nl: ["Mengglas", "Barlepel", "Hawthorne-zeef", "Jigger", "Brander", "Schep voor crushed ice", "Randbakje"] },
    "the-hulk": { en: ["Boston tins", "Muddler", "Hawthorne strainer", "Fine strainer", "Jigger"],
                  nl: ["Boston tins", "Muddler", "Hawthorne-zeef", "Fijne zeef", "Jigger"] },
    "hibiscus-royale": { en: ["Boston tins", "Muddler", "Hawthorne strainer", "Jigger"],
                         nl: ["Boston tins", "Muddler", "Hawthorne-zeef", "Jigger"] },
    "jalapeno-mule": { en: ["Mixing glass", "Muddler", "Bar spoon", "Hawthorne strainer", "Jigger", "Crushed ice scoop"],
                       nl: ["Mengglas", "Muddler", "Barlepel", "Hawthorne-zeef", "Jigger", "Schep voor crushed ice"] },
    "ocean-mojito": { en: ["Boston tins", "Muddler", "Fine strainer", "Jigger", "Bar spoon to churn", "Crushed ice scoop"],
                      nl: ["Boston tins", "Muddler", "Fijne zeef", "Jigger", "Barlepel om te churnen", "Schep voor crushed ice"] },
    "cosmopolitan": { en: ["Boston tins", "Hawthorne strainer", "Fine strainer", "Jigger", "Zester"],
                      nl: ["Boston tins", "Hawthorne-zeef", "Fijne zeef", "Jigger", "Zesteur"] },
    "amsterdam-sunrise": { en: ["Jigger", "Crushed ice scoop", "Brute for the tray", "Zester"],
                           nl: ["Jigger", "Schep voor crushed ice", "Brute voor het blad", "Zesteur"] },
    "tropical-velvet": { en: ["Boston tins", "Hawthorne strainer", "Fine strainer", "Jigger"],
                         nl: ["Boston tins", "Hawthorne-zeef", "Fijne zeef", "Jigger"] },
    "pina-colada": { en: ["Blender", "Jigger", "Blue ice scoop"],
                     nl: ["Blender", "Jigger", "Blauwe ijsschep"] }
  };

  /* Fall-back for the matcha and soft drinks, which are built in the glass.
     Read off the method line so a new drink gets something sensible without
     anyone having to remember this list exists. */
  function kitFor(d) {
    var named = KIT[d.id];
    if (named) return named[LANG] || named.en;
    var m = (tt(d.method) || "").toLowerCase() + " " + (tt(d.ice) || "").toLowerCase();
    var out = [];
    function add(en, nl) { out.push(LANG === "nl" ? nl : en); }
    if (m.indexOf("whisk") > -1) add("Matcha bowl and whisk", "Matchakom en garde");
    if (m.indexOf("shake") > -1) add("Boston tins", "Boston tins");
    if (m.indexOf("blend") > -1) add("Blender", "Blender");
    if (m.indexOf("stir") > -1 || m.indexOf("build") > -1) add("Bar spoon", "Barlepel");
    if (m.indexOf("strain") > -1) add("Hawthorne strainer", "Hawthorne-zeef");
    if (m.indexOf("crushed") > -1) add("Crushed ice scoop", "Schep voor crushed ice");
    add("Jigger", "Jigger");
    return out;
  }

  /* Outlines, in a 60 x 164 box. Drawn rather than approximated with border
     radius, because a hurricane and a coupe have to be tellable apart at a
     glance and rounded corners cannot do it. fill is the band of the box the
     liquid may occupy. */
  var SHAPE = {
    tall: {
      body: "M9,5 L9,148 Q9,158 19,158 L41,158 Q51,158 51,148 L51,5 Z",
      fill: [6, 157], stem: ""
    },
    hurricane: {
      body: "M8,5 C8,27 14,43 14,61 C14,79 8,95 10,114 C12,134 20,146 30,146 " +
            "C40,146 48,134 50,114 C52,95 46,79 46,61 C46,43 52,27 52,5 Z",
      fill: [6, 145],
      stem: "M24,148 L36,148 L36,152 Q46,154 46,158 L14,158 Q14,154 24,152 Z"
    },
    coupe: {
      body: "M5,8 C5,8 7,62 30,62 C53,62 55,8 55,8 Z",
      fill: [9, 61],
      stem: "M28,62 L32,62 L32,146 Q32,150 42,152 Q48,154 48,158 L12,158 " +
            "Q12,154 18,152 Q28,150 28,146 Z"
    }
  };

  function glassShape(d) {
    var g = (tt(d.glass) || "").toLowerCase();
    if (g.indexOf("coupe") > -1 || g.indexOf("coppa") > -1 || g.indexOf("martini") > -1) return "coupe";
    if (g.indexOf("hurricane") > -1) return "hurricane";
    return "tall";
  }

  /* Bands are given a floor of a few units each so a 10 ml dash still shows,
     then the rest of the height is shared out by volume. Top of the list is
     the top of the glass. */
  var UID = 0;
  function glassSVG(shape, pours) {
    var sp = SHAPE[shape] || SHAPE.tall;
    var top = sp.fill[0], bot = sp.fill[1], H = bot - top;
    var n = pours.length, floor = Math.min(5, H / (n * 2.2));
    var total = 0, share = 0, i;
    for (i = 0; i < n; i++) {
      if (pours[i].kind === "fill") share += pours[i].fill; else total += pours[i].ml;
    }
    if (share > 0.9) share = 0.9;            /* always leave room for the rest */
    var id = "agc" + (++UID);

    /* An unmeasured long pour takes the share of the glass it is said to
       fill; what is left over is shared out by millilitres. */
    var free = H * (1 - share), fillH = H * share;
    var rects = "", y = top;
    for (i = n - 1; i >= 0; i--) {           /* build list is bottom first */
      var h = pours[i].kind === "fill"
        ? (fillH * (pours[i].fill / (share || 1)))
        : floor + (free - n * floor) * (total ? pours[i].ml / total : 1 / n);
      rects += '<rect x="0" y="' + y.toFixed(2) + '" width="60" height="' +
               (h + 0.4).toFixed(2) + '" fill="' +
               (pours[i].col || GCOL[pours[i].ref] || "#CFC6B4") + '"/>';
      y += h;
    }

    return '<svg class="ag-glass" data-shape="' + shape + '" viewBox="0 0 60 164" width="60" height="164" ' +
           'role="img" aria-hidden="true" focusable="false">' +
           '<defs><clipPath id="' + id + '"><path d="' + sp.body + '"/></clipPath></defs>' +
           (sp.stem ? '<path d="' + sp.stem + '" class="ag-stem"/>' : "") +
           '<path d="' + sp.body + '" class="ag-well"/>' +
           '<g clip-path="url(#' + id + ')">' + rects + "</g>" +
           '<path d="' + sp.body + '" class="ag-edge"/>' +
           "</svg>";
  }

  function vizHTML(d) {
    /* The build list is read as the order things reach the GLASS. Two kinds
       of entry are not a plain pour:

       fill   a long pour nobody has measured, like the Spa Rood that fills
              half a Forest Fairy. It takes its share of the glass by the
              fraction given, and says so instead of inventing millilitres.
       pre    something combined before it reaches the glass. The mixing
              glass and the tin arrive as one liquid, so they are drawn as
              one band, not as separate layers that never existed. */
    var pours = [], extras = [], goesIn = [], i, b, ing, last = null;
    for (i = 0; i < (d.build || []).length; i++) {
      b = d.build[i];
      ing = ING[b.ref];
      if (!ing) continue;
      if (b.fill) {
        pours.push({ kind: "fill", ref: b.ref, fill: b.fill, name: tt(ing.name),
                     note: b.note ? tt(b.note) : "" });
        last = null;
      } else if (b.pre) {
        var lbl = tt(b.pre);
        if (last && last.kind === "mix" && last.name === lbl) {
          last.ml += b.ml;
          last.parts.push({ name: tt(ing.name), ml: b.ml, note: b.note ? tt(b.note) : "" });
          /* The band takes the colour of whatever is most of it, not of
             whichever ingredient happens to be written first. */
          if (b.ml > last.big) { last.big = b.ml; last.ref = b.ref; }
          if (b.col) last.col = b.col;
        } else {
          last = { kind: "mix", ref: b.ref, col: b.col || null, ml: b.ml, name: lbl, note: "", big: b.ml,
                   parts: [{ name: tt(ing.name), ml: b.ml, note: b.note ? tt(b.note) : "" }] };
          pours.push(last);
        }
      } else if (b.ml > 0) {
        pours.push({ kind: "ml", ref: b.ref, ml: b.ml, name: tt(ing.name),
                     note: b.note ? tt(b.note) : "" });
        last = null;
      } else {
        /* Something with no millilitres is not automatically a garnish. The
           muddled grapes in a Hulk end up in the liquid; the basil leaf on
           top does not. Listing both under one heading read as if the fruit
           were decoration. */
        (b.in ? goesIn : extras).push({ name: tt(ing.name), note: b.note ? tt(b.note) : "" });
        last = null;
      }
    }

    var shape = glassShape(d);
    var h = '<div class="ag">';

    /* ---- glass + kit ---- */
    h += '<div class="ag-facts">' +
         '<div><span class="ag-k">' + et({ en: "Glass", nl: "Glas" }) + '</span>' +
         '<span class="ag-v">' + esc(tt(d.glass) || "—") + "</span></div>" +
         '<div><span class="ag-k">' + et({ en: "Ice", nl: "IJs" }) + '</span>' +
         '<span class="ag-v">' + esc(tt(d.ice) || "—") + "</span></div>" +
         '<div><span class="ag-k">' + et({ en: "Method", nl: "Methode" }) + '</span>' +
         '<span class="ag-v">' + esc(tt(d.method) || "—") + "</span></div>" +
         "</div>";

    /* ---- the stack ---- */
    if (pours.length) {
      var total = 0, anyFill = false;
      for (i = 0; i < pours.length; i++) {
        if (pours[i].kind === "fill") anyFill = true; else total += pours[i].ml;
      }

      /* Drawn top first, so the list reads the same way down the page as the
         liquid sits in the glass. The build list is bottom first. */
      var legend = "";
      for (i = pours.length - 1; i >= 0; i--) {
        var p = pours[i];
        /* Volume is not the same as colour: 40 ml of green mint syrup and
           20 ml of cassis shake out purple, not green. Where that matters the
           build says so. */
        var col = p.col || GCOL[p.ref] || "#CFC6B4";
        var amount = p.kind === "fill"
          ? '<span class="ag-ml">' + Math.round(p.fill * 100) + "%</span>"
          : '<span class="ag-ml">' + p.ml + " ml</span>";
        var sub = p.note ? '<span class="ag-no">' + esc(p.note) + "</span>" : "";
        if (p.kind === "mix") {
          sub = '<span class="ag-no">' + p.parts.map(function (x) {
            /* Something muddled or bashed in has no millilitres; saying
               "0 ml" would read as none of it going in. */
            return esc(x.name) + (x.ml > 0 ? " " + x.ml + " ml" : "") +
                   (x.note ? " (" + esc(x.note) + ")" : "");
          }).join(" · ") + "</span>";
        }
        legend += '<li><i style="background:' + col + '"></i>' +
                  '<span class="ag-nm">' + esc(p.name) +
                  (p.kind === "mix" ? ' <span class="ag-tag">' +
                     et({ en: "one mixture", nl: "een mengsel" }) + "</span>" : "") +
                  "</span>" + amount + sub + "</li>";
      }

      h += '<div class="ag-viz">' + glassSVG(shape, pours) +
           '<ol class="ag-leg">' + legend + "</ol>" +
           "</div>" +
           '<p class="ag-tot">' + et({ en: "Drawn to scale, bottom of the glass first.", nl: "Op schaal getekend, onderkant van het glas eerst." }) +
           " " + total + " ml" + et({ en: " of measured liquid", nl: " afgemeten vloeistof" }) +
           (anyFill
             ? et({ en: ", plus a long pour nobody has measured, drawn by the share of the glass it fills.",
                    nl: ", plus een lange schenk die niemand heeft afgemeten, getekend naar het deel van het glas dat hij vult." })
             : ".") + "</p>";
    }

    /* ---- everything with no millilitres, in two lists ---- */
    function lst(items, head) {
      if (!items.length) return "";
      var out = '<div class="ag-sec">' + et(head) + "</div><ul class=\"ag-x\">", k;
      for (k = 0; k < items.length; k++) {
        out += "<li>" + esc(items[k].name) +
          (items[k].note ? ' <span class="ag-no">' + esc(items[k].note) + "</span>" : "") + "</li>";
      }
      return out + "</ul>";
    }
    h += lst(goesIn, { en: "Also goes in", nl: "Gaat er ook in" });
    h += lst(extras, { en: "On top, to finish", nl: "Erop, als afwerking" });

    /* ---- kit ---- */
    var kit = kitFor(d);
    if (kit.length) {
      h += '<div class="ag-sec">' + et({ en: "What you need to make it", nl: "Wat je nodig hebt om hem te maken" }) + "</div><div class=\"ag-kit\">";
      for (i = 0; i < kit.length; i++) h += '<span class="ag-tool">' + esc(kit[i]) + "</span>";
      h += "</div>";
    }

    return h + "</div>";
  }

  /* openSheet writes the guest copy and nothing else, so the glance block is
     appended after it rather than threaded through it. */
  var open0 = window.openSheet;
  if (typeof open0 === "function") {
    window.openSheet = function (id) {
      var out = open0.apply(this, arguments);
      try {
        var d = null, si, di;
        for (si = 0; si < SECTIONS.length; si++) {
          var ds = SECTIONS[si].drinks || [];
          for (di = 0; di < ds.length; di++) if (ds[di].id === id) d = ds[di];
        }
        var body = document.getElementById("sheet-body");
        if (d && body) body.insertAdjacentHTML("beforeend", vizHTML(d));
      } catch (err) {}
      return out;
    };
  }
})();

  if (typeof render === "function") render();
})();

</script>
